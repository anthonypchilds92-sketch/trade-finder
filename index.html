let EVAL = { team: '', give: new Set(), get: new Set(), mode: 'received' };
function renderEvaluate() {
  const el = $('#tab-evaluate');
  const others = MODEL.teams.filter(t => t !== MODEL.me).sort((a, b) => a.name.localeCompare(b.name));
  const t = EVAL.team ? MODEL.teamById.get(+EVAL.team) : null;
  const chips = (assets, set, side) => assets.slice().sort((a, b) => b.value - a.value).filter(a => a.value >= 50 || set.has(a.id)).map(a =>
    `<button class="chip ${set.has(a.id) ? 'on' : ''}" data-side="${side}" data-id="${esc(a.id)}">${esc(a.name)} <span class="small">${a.kind === 'pick' ? '' : esc(a.pos) + ' · '}${fmt(a.value)}</span></button>`).join('');
  const prop = EVAL.mode === 'propose';
  el.innerHTML = `<div class="seg" id="ev-mode" style="margin:4px 0 8px"><button data-mode="received" class="${prop ? '' : 'on'}" style="padding:6px 12px;font-size:13px">They sent me this</button><button data-mode="propose" class="${prop ? 'on' : ''}" style="padding:6px 12px;font-size:13px">I'm proposing this</button></div>
    <p class="small">${prop ? "Build your own offer: pick the team, tick what you'd give and what you'd ask for. You'll see whether it's good for you and how likely they are to accept." : "Got an offer? Pick the team, tick what they want from you and what they're offering, and you'll get a verdict and a counter-offer."}</p>
    <div class="card"><div class="row"><select id="ev-team"><option value="">${prop ? 'Which team?' : 'Who sent it?'}</option>${others.map(x => `<option value="${x.rosterId}" ${String(x.rosterId) === String(EVAL.team) ? 'selected' : ''}>${esc(x.name)} (${label(x.strategy)})</option>`).join('')}</select>
      ${EVAL.give.size || EVAL.get.size ? '<button class="btn ghost" id="ev-clear" style="padding:4px 10px">Clear</button>' : ''}</div>
    ${t ? `<h4 class="small" style="margin:12px 0 6px;text-transform:uppercase;letter-spacing:.06em">${prop ? 'You give' : 'They want from you'}</h4><div class="chips">${chips(MODEL.me.assets, EVAL.give, 'give')}</div>
      <h4 class="small" style="margin:14px 0 6px;text-transform:uppercase;letter-spacing:.06em">${prop ? 'You ask for' : "They're offering"}</h4><div class="chips">${chips(t.assets, EVAL.get, 'get')}</div>` : ''}</div>
    <div id="ev-out"></div>`;
  $('#ev-team').onchange = e => { EVAL = { team: e.target.value, give: new Set(), get: new Set(), mode: EVAL.mode }; renderEvaluate(); };
  el.querySelectorAll('#ev-mode button').forEach(b => b.onclick = () => { EVAL.mode = b.dataset.mode; renderEvaluate(); });
  if ($('#ev-clear')) $('#ev-clear').onclick = () => { EVAL.give.clear(); EVAL.get.clear(); renderEvaluate(); };
  el.querySelectorAll('button.chip').forEach(b => b.onclick = () => {
    const set = b.dataset.side === 'give' ? EVAL.give : EVAL.get;
    set.has(b.dataset.id) ? set.delete(b.dataset.id) : set.add(b.dataset.id);
    const y = window.scrollY; renderEvaluate(); window.scrollTo(0, y);
  });
  if (!t || !EVAL.give.size || !EVAL.get.size) return;
  const res = ENGINE.evaluateIncoming(MODEL, P(), t.rosterId, [...EVAL.give], [...EVAL.get], EVAL.mode);
  if (!res) return;
  const { r } = res;
  const col = { good: 'var(--good)', warn: 'var(--warn)', bad: 'var(--bad)' }[res.tone];
  const pct = Math.round(r.diff * 100);
  const why = [
    `Market: you give ${fmt(r.gv)}, you get ${fmt(r.rv)} (${pct === 0 ? 'even' : pct > 0 ? `+${pct}% your way` : `${-pct}% their way`}).${res.proposing ? '' : ` They came to you, so aim for at least +${Math.round(res.premium * 100)}%.`}`,
    ...(res.proposing ? [`Chance they accept: ${res.likely}. ${r.theirNow > 150 ? `Their lineup gets stronger by about ${fmt(r.theirNow)}. ` : r.theirNow < -150 ? `It weakens their lineup by about ${fmt(-r.theirNow)}. ` : ''}${r.theirFut > 0 ? 'They gain long-term value.' : 'They lose long-term value.'}`] : []),
    ...(r.cuffNotes?.length ? [`Handcuff: ${r.cuffNotes.join('; ')}.`] : []),
    ...(r.tendency?.length ? [`Their trade history: ${r.tendency.join('; ')}.`] : []),
    ...(r.learned?.length ? [`From your past offers: ${r.learned.join('; ')}.`] : []),
    r.myFut > 0 ? `Long-term value for your rebuild: up about ${fmt(r.myFut)}.` : `Long-term value for your rebuild: down about ${fmt(-r.myFut)}.`,
  ];
  const counterCard = c => { const pc = Math.round(c.r.diff * 100); return `<div class="card" style="margin:8px 0"><div class="small" style="margin-bottom:6px"><b>${esc(c.kind)}</b> · ${esc(c.note)}</div>
    <div class="sides"><div class="side"><h4>You give</h4>${assetRows(c.give)}</div><div class="side"><h4>You get</h4>${assetRows(c.get)}</div></div>
    <div class="small" style="margin-top:6px">Market ${pc === 0 ? 'even' : pc > 0 ? `+${pc}% your way` : `${-pc}% their way`}.</div>${offerButton(Object.assign(c.r, { partner: res.team }))}</div>`; };
  $('#ev-out').innerHTML = `<div class="card"><div class="trade-top"><span style="font-size:20px;font-weight:700;color:${col}">${res.verdict}</span><span class="pill">${esc(res.team.name)} · ${label(res.team.strategy)}</span></div>
    <ul class="why">${why.map(w => `<li>${esc(w)}</li>`).join('')}${res.goods.map(w => `<li style="color:var(--good)">${esc(w)}</li>`).join('')}${res.flags.map(w => `<li style="color:var(--warn)">${esc(w)}</li>`).join('')}</ul>
    <div class="row" style="margin-top:10px">${res.proposing ? offerButton(Object.assign(r, { partner: res.team })) : '<button class="btn ghost" id="ev-log">Log interest in my players</button>'}</div></div>
    ${res.counters.length ? `<h3 style="margin:14px 0 4px;font-size:16px">${res.proposing ? 'Tweaks that might get it accepted' : res.verdict === 'Accept' ? 'You could still try' : 'Counter-offers'}</h3>${res.counters.map(counterCard).join('')}` : res.proposing ? (res.r.partnerU < 0.1 ? '<div class="card small">No simple addition from your tradeable assets makes this attractive to them. Try a different target or package.</div>' : '') : res.verdict === 'Decline' ? '<div class="card small">No simple counter from their roster closes the gap. Declining is reasonable.</div>' : res.verdict === 'Counter' ? '<div class="card small">Close, but no single change from their roster fixes it. Ask them to improve the offer, or name what you\'d want.</div>' : ''}`;
  bindOfferButtons($('#ev-out'));
  if ($('#ev-log')) $('#ev-log').onclick = () => {
    const day = new Date().toISOString().slice(0, 10);
    for (const a of res.G) if (a.kind === 'player' && !INTEREST.some(i => i.playerId === a.id && i.ownerId === res.team.ownerId && i.day === day))
      INTEREST.unshift({ ts: Date.now(), day, ownerId: res.team.ownerId, teamName: res.team.name, playerId: a.id, playerName: a.name });
    saveInterest(); LEARN = ENGINE.learnFromOffers(OFFERS, INTEREST); renderOffers();
    $('#ev-log').outerHTML = '<span class="pill" style="color:var(--good)">Interest logged</span>';
  };
}

function assetRows(list) {
  return list.map(a => `<div class="asset"><div><div class="nm">${esc(a.name)}</div><div class="meta">${esc(assetMeta(a))}</div></div><div class="val">${fmt(a.value)}</div></div>`).join('');
}
function toggleOffers(tr) {
  const next = tr.nextElementSibling;
  if (next && next.classList.contains('offer-row')) { next.remove(); tr.classList.remove('open'); return; }
  document.querySelectorAll('#tab-targets .offer-row').forEach(r => { r.previousElementSibling?.classList.remove('open'); r.remove(); });
  const { target, team, offers, nearest } = ENGINE.offersFor(MODEL, P(), tr.dataset.id, 3);
  const cols = tr.children.length;
  let html;
  if (offers.length) {
    html = `<div class="small" style="margin-bottom:6px">Offers ${esc(team.name)} (${label(team.strategy)}, ${team.wins}–${team.losses}) might accept for <b>${esc(target.name)}</b>:</div>` +
      offers.map((r, i) => `<div class="card" style="margin:8px 0">
        <div class="small" style="margin-bottom:6px"><b>Offer ${i + 1}</b></div>
        <div class="sides"><div class="side"><h4>You send</h4>${assetRows(r.give)}</div><div class="side"><h4>You get</h4>${assetRows(r.get)}</div></div>
        <ul class="why">${ENGINE.theirSideReasons(r).map(w => `<li>${esc(w)}</li>`).join('')}</ul>${offerButton(r)}</div>`).join('');
  } else if (nearest) {
    html = `<div class="card" style="margin:8px 0"><div class="small" style="margin-bottom:6px">No offer from your tradeable players gets a fair deal they'd want. The closest:</div>
      <div class="sides"><div class="side"><h4>You send</h4>${assetRows(nearest.give)}</div><div class="side"><h4>You get</h4>${assetRows(nearest.get)}</div></div>
      <p class="small">Why it falls short: ${esc(nearest.fail || 'not enough in it for them')}. Try marking more players "Shop" in My team${prefs.protectPicks ? ', or allow your picks in Settings' : ''}. You can still send it as a starting point.</p>${offerButton(nearest)}</div>`;
  } else {
    html = `<div class="card small" style="margin:8px 0">None of your tradeable players or picks are a fit for this one. Mark more players "Shop" in My team${prefs.protectPicks ? ', or allow your picks in Settings' : ''}.</div>`;
  }
  const row = document.createElement('tr'); row.className = 'offer-row';
  row.innerHTML = `<td colspan="${cols}" style="background:var(--bg)">${html}</td>`;
  tr.after(row); tr.classList.add('open');
  bindOfferButtons(row);
}

// ---------- Offer tracking ----------
function offerButton(tr) {
  const key = ENGINE.offerKey(tr.give, tr.get);
  const existing = OFFERS.find(o => o.key === key && o.status === 'open');
  if (existing) return `<div class="row" style="margin-top:10px"><span class="pill" style="color:var(--good)">Offer sent ${new Date(existing.ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })} · open</span></div>`;
  CARDS.push(tr);
  return `<div class="row" style="margin-top:10px"><button class="btn ghost" data-card="${CARDS.length - 1}">I've sent this offer</button></div>`;
}
function bindOfferButtons(root) {
  root.querySelectorAll('button[data-card]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const tr = CARDS[+b.dataset.card]; if (!tr) return;
    const slim = a => ({ id: a.id, name: a.name, value: Math.round(a.value), pos: a.pos, kind: a.kind });
    OFFERS.unshift({
      key: ENGINE.offerKey(tr.give, tr.get), ts: Date.now(), ownerId: tr.partner.ownerId, partnerName: tr.partner.name,
      give: tr.give.map(slim), get: tr.get.map(slim), diff: tr.diff, status: 'open',
    });
    saveOffers();
    b.outerHTML = `<span class="pill" style="color:var(--good)">Saved to Offers · open</span>`;
    renderOffers();
  });
}
// If a logged offer shows up as a completed Sleeper trade, mark it accepted automatically
function autoDetectAccepted() {
  const log = MODEL.tradeLog || [];
  let changed = false;
  for (const o of OFFERS) {
    if (o.status !== 'open') continue;
    const wantIds = o.get.filter(a => a.kind === 'player').map(a => a.id);
    if (!wantIds.length) continue;
    const hit = log.find(e => e.when >= o.ts - 86400000 && e.sides.some(sd => sd.team === MODEL.me && wantIds.every(id => sd.got.some(g => g.id === id))));
    if (hit) { o.status = 'accepted'; o.closedTs = hit.when; o.auto = true; changed = true; }
  }
  if (changed) saveOffers();
}
function renderOffers() {
  const el = $('#tab-offers'); if (!el) return;
  const open = OFFERS.filter(o => o.status === 'open'), closed = OFFERS.filter(o => o.status !== 'open');
  const assetList = l => l.map(a => `<div class="asset"><div class="nm">${esc(a.name)}</div><div class="val">${fmt(a.value)}</div></div>`).join('');
  const card = (o, i) => `<div class="card">
    <div class="trade-top"><span class="partner">${esc(o.partnerName)}</span><span class="small">${new Date(o.ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}</span></div>
    <div class="sides"><div class="side"><h4>You offered</h4>${assetList(o.give)}</div><div class="side"><h4>For</h4>${assetList(o.get)}</div></div>
    ${o.status === 'open' ? `<div class="row" style="margin-top:10px">
        <button class="btn" data-act="accepted" data-i="${i}">Accepted</button>
        <button class="btn ghost" data-act="reject" data-i="${i}">Rejected</button>
        <button class="btn ghost" data-act="withdrawn" data-i="${i}">Withdrawn</button></div>
      <div class="reasons hidden" data-for="${i}" style="margin-top:8px"><div class="small" style="margin-bottom:4px">Why did they say no?</div><div class="row">
        <button class="btn ghost" data-act="rejected" data-reason="more" data-i="${i}">Wanted more</button>
        <button class="btn ghost" data-act="rejected" data-reason="keep" data-i="${i}">Won't sell ${esc(o.get.length === 1 ? o.get[0].name : 'them')}</button>
        <button class="btn ghost" data-act="rejected" data-reason="dislike" data-i="${i}">Didn't want my players</button>
        <button class="btn ghost" data-act="rejected" data-reason="none" data-i="${i}">No reason given</button></div></div>`
    : `<div class="row" style="margin-top:8px"><span class="pill" style="color:${o.status === 'accepted' ? 'var(--good)' : o.status === 'rejected' ? 'var(--bad)' : 'var(--muted)'}">${o.status[0].toUpperCase() + o.status.slice(1)}${o.auto ? ' (spotted on Sleeper)' : ''}${o.reason ? ' · ' + ({ more: 'wanted more', keep: "won't sell", dislike: "didn't want my players", none: 'no reason' }[o.reason]) : ''}</span>
       <button class="btn ghost" data-act="undo" data-i="${i}" style="padding:3px 8px;font-size:12px">Undo</button></div>`}
  </div>`;
  // What the model has learned
  const L = LEARN || { mgrBias: {}, premium: {}, notes: {} };
  const teamByOwner = new Map((MODEL?.teams || []).map(t => [t.ownerId, t]));
  const learnRows = Object.entries(L.notes).map(([owner, n]) => {
    const b = L.mgrBias[owner] || 0;
    return `<li><b>${esc(teamByOwner.get(owner)?.name || 'Manager')}</b>: ${esc(n.join(', '))}. ${b > 0.05 ? `Offers to them now need about ${Math.round(b * 1000)} more value to be suggested.` : b < -0.05 ? 'They now get slightly easier suggestions.' : ''}</li>`;
  });
  const premRows = Object.entries(L.premium).filter(([, v]) => v > 0).map(([id, v]) => {
    const p = MODEL?.players.get(id);
    return `<li>${esc(p?.name || id)}: managers value him about ${Math.round(v * 100)}% above market.</li>`;
  });
  el.innerHTML = `<p class="small">Tap "I've sent this offer" on any suggested trade or tapped-player offer to log it here. Mark the result when you hear back, and future suggestions adjust. If an offer goes through on Sleeper, it's marked accepted automatically.</p>
    <h3 style="margin:14px 0 4px;font-size:16px">Open (${open.length})</h3>
    ${open.length ? open.map(o => card(o, OFFERS.indexOf(o))).join('') : '<div class="card small">No open offers.</div>'}
    <h3 style="margin:18px 0 4px;font-size:16px">Interest in your players (${INTEREST.length})</h3>
    ${INTEREST.length ? `<div class="card">${INTEREST.slice(0, 20).map((i, k) => `<div class="row" style="justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)"><span><b>${esc(i.teamName)}</b> asked about ${esc(i.playerName)} <span class="small">· ${new Date(i.ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}</span></span><button class="btn ghost" data-rmint="${k}" style="padding:2px 8px;font-size:12px">Remove</button></div>`).join('')}<p class="small">Each enquiry makes that player worth a bit more to the team that asked, and slightly more to everyone.</p></div>` : '<div class="card small">Log interest from the Interest? button in My team.</div>'}
    <h3 style="margin:18px 0 4px;font-size:16px">What the model has learned</h3>
    <div class="card">${learnRows.length || premRows.length ? `<ul class="why" style="margin:0">${learnRows.join('')}${premRows.join('')}</ul>` : '<div class="small">Nothing yet. Results from your offers will show here.</div>'}</div>
    <h3 style="margin:18px 0 4px;font-size:16px">History (${closed.length})</h3>
    ${closed.length ? closed.map(o => card(o, OFFERS.indexOf(o))).join('') : '<div class="card small">No closed offers yet.</div>'}
    <div class="card"><b>Backup</b><p class="small">Your offers are saved in this browser only. Copy them now and then so you can restore them on another device, or if your browser data gets cleared.</p>
      <div class="row"><button class="btn ghost" id="o-copy">Copy offer data</button></div>
      <textarea id="o-import" placeholder="Paste offer data here to restore" style="margin-top:8px;min-height:70px"></textarea>
      <div class="row" style="margin-top:6px"><button class="btn ghost" id="o-restore">Restore</button><span class="small" id="o-msg"></span></div></div>`;
  el.querySelectorAll('button[data-act]').forEach(b => b.onclick = () => {
    const o = OFFERS[+b.dataset.i]; const act = b.dataset.act;
    if (act === 'reject') { el.querySelector(`.reasons[data-for="${b.dataset.i}"]`).classList.toggle('hidden'); return; }
    if (act === 'undo') { o.status = 'open'; delete o.reason; delete o.closedTs; delete o.auto; }
    else { o.status = act; o.closedTs = Date.now(); if (b.dataset.reason) o.reason = b.dataset.reason; }
    saveOffers(); rebuild();
  });
  el.querySelectorAll('button[data-rmint]').forEach(b => b.onclick = () => { INTEREST.splice(+b.dataset.rmint, 1); saveInterest(); rebuild(); });
  $('#o-copy').onclick = async () => {
    try { await navigator.clipboard.writeText(JSON.stringify({ offers: OFFERS, interest: INTEREST })); $('#o-msg').textContent = 'Copied.'; }
    catch { $('#o-import').value = JSON.stringify({ offers: OFFERS, interest: INTEREST }); $('#o-msg').textContent = 'Couldn\'t copy automatically. The data is in the box, so select it and copy.'; }
  };
  $('#o-restore').onclick = () => {
    try { const v = JSON.parse($('#o-import').value); if (Array.isArray(v)) OFFERS = v; else if (v && Array.isArray(v.offers)) { OFFERS = v.offers; INTEREST = v.interest || []; saveInterest(); } else throw 0; saveOffers(); rebuild(); $('#o-msg').textContent = 'Restored.'; }
    catch { $('#o-msg').textContent = "That doesn't look like offer data."; }
  };
}

function toggleInterest(btn) {
  const tr = btn.closest('tr');
  const next = tr.nextElementSibling;
  if (next && next.classList.contains('offer-row')) { next.remove(); return; }
  document.querySelectorAll('#tab-myteam .offer-row').forEach(r => r.remove());
  const id = btn.dataset.id;
  const a = MODEL.me.assets.find(x => x.id === id);
  const others = MODEL.teams.filter(t => t !== MODEL.me).sort((x, y) => x.name.localeCompare(y.name));
  const row = document.createElement('tr'); row.className = 'offer-row';
  row.innerHTML = `<td colspan="4" style="background:var(--bg)"><div class="card" style="margin:8px 0">
    <div class="small" style="margin-bottom:6px">Who asked about <b>${esc(a.name)}</b>, or sent you an offer for him?</div>
    <div class="row"><select class="int-team"><option value="">Choose a team…</option>${others.map(t => `<option value="${t.rosterId}">${esc(t.name)} (${label(t.strategy)})</option>`).join('')}</select></div>
    <div class="int-out" style="margin-top:8px"></div></div></td>`;
  tr.after(row);
  row.querySelector('.int-team').onchange = e => {
    const rid = e.target.value; if (!rid) return;
    const team = MODEL.teamById.get(+rid);
    // Log the interest (once per team, player and day)
    const day = new Date().toISOString().slice(0, 10);
    if (!INTEREST.some(i => i.playerId === id && i.ownerId === team.ownerId && i.day === day)) {
      INTEREST.unshift({ ts: Date.now(), day, ownerId: team.ownerId, teamName: team.name, playerId: id, playerName: a.name });
      saveInterest(); LEARN = ENGINE.learnFromOffers(OFFERS, INTEREST); renderOffers();
      btn.textContent = `Interest? (${INTEREST.filter(i => i.playerId === id).length})`;
    }
    const res = ENGINE.asksFor(MODEL, P(), id, rid);
    const out = row.querySelector('.int-out');
    if (!res) { out.innerHTML = '<div class="small">Something went wrong building asks.</div>'; return; }
    out.innerHTML = `<div class="small">Logged: ${esc(team.name)} are interested in ${esc(a.name)}. Market value ${fmt(a.value)}, <b>ask for at least about ${fmt(res.floor)}</b> in value:</div>
      <ul class="why">${res.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>
      ${res.asks.length ? res.asks.map(c => `<div class="card" style="margin:8px 0"><div class="small" style="margin-bottom:6px"><b>${c.label}</b> · ${esc(c.hint)}</div>
        <div class="side"><h4>Ask ${esc(team.name)} for</h4>${c.get.map(g => `<div class="asset"><div><div class="nm">${esc(g.name)}${g.injStash ? '<span class="tag hot">injury stash</span>' : g.buyLow ? '<span class="tag buy">buy low</span>' : g.breakout >= 0.55 && g.kind === 'player' ? '<span class="tag hot">breakout</span>' : ''}</div><div class="meta">${esc(assetMeta(g))}</div></div><div class="val">${fmt(g.value)}</div></div>`).join('')}</div>
        <div class="small" style="margin-top:6px">Package worth about ${fmt(c.rv)}, or ${c.rv >= a.value ? '+' : ''}${Math.round((c.rv / a.value - 1) * 100)}% on his market value.${c.theirNow < -200 && team.strategy === 'winnow' ? ' Note: this weakens their lineup, so a contender may push back.' : ''}</div></div>`).join('')
      : `<div class="small">${esc(team.name)} don't have young players or picks worth enough to meet your ask. Holding him is reasonable, or ask them to name an offer first.</div>`}`;
  };
}

function renderMyTeam() {
  const me = MODEL.me;
  const starters = ENGINE.lineupValue(me.players, MODEL.slots).starters;
  const rows = me.assets.slice().sort((a, b) => b.value - a.value);
  const markBtns = a => {
    const m = prefs.marks[a.id] || 'auto';
    return `<span class="seg" data-id="${esc(a.id)}">${['protect', 'auto', 'shop'].map(k => `<button data-m="${k}" class="${m === k ? 'on' : ''}">${k[0].toUpperCase() + k.slice(1)}</button>`).join('')}</span>`;
  };
  const tags = a => {
    if (a.kind === 'pick') return '';
    let t = '';
    if (a.injuredOut) t += `<span class="tag hot">${esc(a.injury)} · hold</span>`;
    else if (a.dip) t += '<span class="tag buy" title="Value down but role intact: hold, don\'t sell low">dip · hold</span>';
    else if (a.sell >= 0.45) t += '<span class="tag sell">sell high</span>';
    if (a.breakout >= 0.55) t += '<span class="tag buy">core</span>';
    if (starters.has(a.id)) t += '<span class="tag">starter</span>';
    if (a.cuffOf) {
      const owner = MODEL.players.get(a.cuffOf)?.owner;
      const ot = owner != null ? MODEL.teamById.get(owner) : null;
      t += ot && ot !== MODEL.me
        ? `<span class="tag sell" title="Backs up ${esc(a.cuffOfName)}, who is on ${esc(ot.name)}">handcuff · ${esc(ot.name)} need him</span>`
        : `<span class="tag">handcuff to ${esc(a.cuffOfName)}</span>`;
    }
    return t;
  };
  $('#tab-myteam').innerHTML = `<p class="small"><b>Protect</b> keeps a player out of every trade, and <b>Shop</b> forces him into the trade search. <b>Auto</b> lets the site decide: it shops players near their value peak who are past their age peak or whose value is mostly about this season. It won't sell anyone whose value is falling. "Dip · hold" marks a player whose value has dropped while his role hasn't, which is a bad time to sell.</p>
  <div class="card scroll"><table><thead><tr><th>Asset</th><th class="n">Value</th><th class="n">2-yr</th><th>Trade?</th></tr></thead><tbody>
  ${rows.map(a => `<tr><td><b>${esc(a.name)}</b>${tags(a)}<div class="small">${esc(assetMeta(a))}${a.injury ? ' · ' + esc(a.injury) : ''}</div></td>
  <td class="n">${fmt(a.value)}</td><td class="n" style="color:${a.ageMult >= 1 ? 'var(--good)' : a.ageMult < 0.8 ? 'var(--bad)' : 'var(--muted)'}">${fmt(a.future)}</td><td>${markBtns(a)}<div style="margin-top:4px"><button class="btn ghost interest" data-id="${esc(a.id)}" style="padding:2px 8px;font-size:12px">Interest?${INTEREST.some(i => i.playerId === a.id) ? ` (${INTEREST.filter(i => i.playerId === a.id).length})` : ''}</button></div></td></tr>`).join('')}
  </tbody></table><p class="small">"2-yr" is the value we expect him to have in about two years, based on his age and position.</p></div>`;
  $('#tab-myteam').querySelectorAll('button.interest').forEach(b => b.onclick = () => toggleInterest(b));
  $('#tab-myteam').querySelectorAll('.seg button').forEach(b => b.onclick = () => {
    const id = b.parentElement.dataset.id; const m = b.dataset.m;
    if (m === 'auto') delete prefs.marks[id]; else prefs.marks[id] = m;
    savePrefs(); rebuild();
  });
}

function renderLeague() {
  const teams = MODEL.teams.slice().sort((a, b) => a.contendRank - b.contendRank);
  $('#tab-league').innerHTML = `<p class="small">Strategies are guessed from lineup strength, record and points scored. Change any team's strategy and the trade search will treat them that way.</p>
  <div class="card scroll"><table><thead><tr><th>Team</th><th class="n">Rec</th><th class="n">Lineup</th><th class="n">Roster age</th><th>Strategy</th></tr></thead><tbody>
  ${teams.map(t => `<tr><td><b>${esc(t.name)}</b>${t === MODEL.me ? ' <span class="tag buy">you</span>' : ''}<div class="small">${esc(t.username)} · ${fmt(t.pf)} PF</div></td>
    <td class="n">${t.wins}–${t.losses}</td><td class="n">${fmt(t.lineupNow)}</td><td class="n">${t.avgAge ? t.avgAge.toFixed(1) : '–'}</td>
    <td><select data-r="${t.rosterId}">${['winnow', 'middle', 'rebuild'].map(s => `<option value="${s}" ${t.strategy === s ? 'selected' : ''}>${label(s)}${s === t.autoStrategy && t !== MODEL.me ? ' (auto)' : ''}</option>`).join('')}</select></td></tr>`).join('')}
  </tbody></table><p class="small">"Lineup" is this season's value of each team's best possible starting lineup. "Roster age" is weighted by value.</p></div>`;
  const log = MODEL.tradeLog || [];
  const seasons = [...new Set(log.map(e => e.season))];
  // Grade every trade on today's values (package-adjusted, so 2-for-1s are judged fairly)
  const gradeOf = pct => pct >= 0.3 ? 'A+' : pct >= 0.15 ? 'A' : pct >= 0.05 ? 'B+' : pct > -0.05 ? 'B' : pct > -0.15 ? 'C' : pct > -0.3 ? 'D' : 'F';
  const gradeCol = g => g.startsWith('A') ? 'var(--good)' : g === 'B+' || g === 'B' ? 'var(--accent)' : g === 'C' ? 'var(--warn)' : 'var(--bad)';
  const record = new Map();
  for (const e of log) {
    for (const sd of e.sides) {
      const got = ENGINE.packageValue(sd.got), gave = ENGINE.packageValue(sd.gave);
      sd.net = got - gave; sd.pct = sd.net / Math.max(got, gave, 1); sd.grade = gradeOf(sd.pct);
      if (sd.team) { const r = record.get(sd.team) || { w: 0, l: 0, d: 0, net: 0 }; Math.abs(sd.pct) < 0.05 ? r.d++ : sd.net > 0 ? r.w++ : r.l++; r.net += sd.net; record.set(sd.team, r); }
    }
    const best = e.sides.slice().sort((a, b) => b.net - a.net)[0];
    e.verdict = Math.abs(best.pct) < 0.05 ? 'Even trade, nobody clearly won' : `${best.teamName} won by ${fmt(best.net)} (${Math.round(best.pct * 100)}%)`;
  }
  const profHtml = `<h3 style="margin:18px 0 4px;font-size:16px">Manager trade tendencies</h3>
  <p class="small">${log.length ? `From ${log.length} completed trade${log.length === 1 ? '' : 's'} (${seasons.join(', ')}). These tendencies feed into the trade scores, and managers who trade more often rank a little higher. Values are today's, so they show what kind of assets moved, not what they were worth at the time.` : 'No completed trades found in this league yet. Profiles will fill in as trades happen.'}</p>
  ${log.length ? `<div class="card">${MODEL.teams.slice().sort((a, b) => b.profile.trades - a.profile.trades).map(t => `<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b>${esc(t.name)}</b>${t === MODEL.me ? ' <span class="tag buy">you</span>' : ''} <span class="small">· ${t.profile.trades} trade${t.profile.trades === 1 ? '' : 's'}${record.get(t) ? ` · record ${record.get(t).w}–${record.get(t).l}${record.get(t).d ? '–' + record.get(t).d : ''} · net ${record.get(t).net >= 0 ? '+' : ''}${fmt(record.get(t).net)}` : ''}</span><div>${t.profile.tags.map(g => `<span class="pill" style="margin:3px 4px 0 0">${esc(g)}</span>`).join('')}</div></div>`).join('')}</div>
  <h3 style="margin:18px 0 4px;font-size:16px">Recent trades</h3>
  <p class="small">Graded on today's values, with hindsight: what each side got against what they gave, adjusted so a 2-for-1 is judged fairly. A+ means a clear win, B is about even, F is a fleecing. Record is wins–losses(–evens).</p>
  ${log.slice(0, 12).map(e => `<div class="card"><div class="trade-top"><span class="small">${e.when ? new Date(e.when).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : e.season}</span><span class="small"><b>${esc(e.verdict)}</b></span></div>
    <div class="sides">${e.sides.map(sd => `<div class="side"><h4 style="display:flex;justify-content:space-between"><span>${esc(sd.teamName)} got</span><span style="font-size:18px;color:${gradeCol(sd.grade)};letter-spacing:0">${sd.grade}</span></h4>${sd.got.length ? sd.got.map(a => `<div class="asset"><div><div class="nm">${esc(a.name)}</div><div class="meta">${a.kind === 'pick' ? 'Draft pick' : esc(a.pos) + (a.age ? ' · ' + Math.floor(a.age) + ' then' : '')}</div></div><div class="val">${fmt(a.value)}</div></div>`).join('') : '<div class="small">Nothing</div>'}</div>`).join('')}</div></div>`).join('')}` : ''}`;
  $('#tab-league').insertAdjacentHTML('beforeend', profHtml);
  $('#tab-league').querySelectorAll('select').forEach(s => s.onchange = () => { prefs.strategy[s.dataset.r] = s.value; savePrefs(); rebuild(); });
}

function renderSettings() {
  $('#tab-settings').innerHTML = `<div class="card">
    <label class="set"><span>Player values<div class="small">KTC is read once a day by your GitHub job. FantasyCalc is based on real trades.</div></span>
      <select id="s-src">${[['ktc', 'KTC'], ['blend', 'Blend (50/50)'], ['fc', 'FantasyCalc']].map(([v, l]) => `<option value="${v}" ${(prefs.valueSource || 'ktc') === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <label class="set"><span>Fairness range<div class="small">How far apart the two sides' market values can be</div></span>
      <select id="s-fair">${[0.06, 0.1, 0.12, 0.15, 0.2].map(v => `<option value="${v}" ${prefs.fairness == v ? 'selected' : ''}>±${Math.round(v * 100)}%</option>`).join('')}</select></label>
    <label class="set"><span>Even deals<div class="small">Same number of pieces on each side</div></span>
      <select id="s-even">${[['prefer', 'Prefer'], ['strict', 'Only even'], ['off', 'No preference']].map(([v, l]) => `<option value="${v}" ${(prefs.evenDeals ?? 'prefer') === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <label class="set"><span>Max assets per side</span>
      <select id="s-max">${[1, 2, 3].map(v => `<option ${prefs.maxAssets == v ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
    <label class="set"><span>Target buy-low dips<div class="small">Prime-age stars whose value has dropped while their role hasn't</div></span><input type="checkbox" id="s-buylow" ${prefs.buyLow !== false ? 'checked' : ''}></label>
    <label class="set"><span>Target injury stashes<div class="small">Young injured players with a good recovery outlook</div></span><input type="checkbox" id="s-inj" ${prefs.injuryStash !== false ? 'checked' : ''}></label>
    <label class="set"><span>Buy-low look-back<div class="small">Dips are measured from each player's peak in this window (needs saved history)</div></span>
      <select id="s-win">${[60, 90, 120].map(v => `<option value="${v}" ${(prefs.dipWindow ?? 90) == v ? 'selected' : ''}>${v} days</option>`).join('')}</select></label>
    <label class="set"><span>Never trade away my picks</span><input type="checkbox" id="s-picks" ${prefs.protectPicks ? 'checked' : ''}></label>
    <label class="set"><span>Number of trades to show</span>
      <select id="s-n">${[10, 20, 30].map(v => `<option ${prefs.maxResults == v ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
    <div class="row" style="margin-top:10px"><button class="btn ghost" id="s-reset">Reset strategies and marks</button></div>
    <p class="small">Data: Sleeper (rosters, picks, stats, trending adds) and <a href="https://fantasycalc.com" target="_blank" rel="noopener">FantasyCalc</a> (trade values, based on real trades) and KeepTradeCut (crowd values, read daily). Settings are saved in this browser only.</p>
  </div>`;
  $('#s-src').onchange = e => { prefs.valueSource = e.target.value; savePrefs(); rebuild(); };
  $('#s-fair').onchange = e => { prefs.fairness = +e.target.value; savePrefs(); rebuild(); };
  $('#s-even').onchange = e => { prefs.evenDeals = e.target.value; savePrefs(); rebuild(); };
  $('#s-max').onchange = e => { prefs.maxAssets = +e.target.value; savePrefs(); rebuild(); };
  $('#s-inj').onchange = e => { prefs.injuryStash = e.target.checked; savePrefs(); rebuild(); };
  $('#s-win').onchange = e => { prefs.dipWindow = +e.target.value; savePrefs(); rebuild(); };
  $('#s-buylow').onchange = e => { prefs.buyLow = e.target.checked; savePrefs(); rebuild(); };
  $('#s-picks').onchange = e => { prefs.protectPicks = e.target.checked; savePrefs(); rebuild(); };
  $('#s-n').onchange = e => { prefs.maxResults = +e.target.value; savePrefs(); rebuild(); };
  $('#s-reset').onclick = () => { prefs.strategy = {}; prefs.marks = {}; savePrefs(); rebuild(); };
}

document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('main section').forEach(s => s.classList.toggle('hidden', s.id !== 'tab-' + b.dataset.tab));
});
$('#refresh').onclick = () => load(true);
load(false);
</script>
</body>
</html>
