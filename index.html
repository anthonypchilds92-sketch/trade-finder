<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trade Finder · Futures Past + Present</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1216">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --bg:#0f1216; --panel:#171b21; --panel2:#1e232b; --line:#2a313b;
    --text:#e8ebef; --muted:#9aa4b1; --accent:#4fb3ff; --good:#3ecf8e; --warn:#f2b84b; --bad:#ff6b6b;
    --chip:#232a33;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
  header{position:sticky;top:0;z-index:5;background:rgba(15,18,22,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .wrap{max-width:980px;margin:0 auto;padding:12px 14px}
  h1{font-size:18px;margin:0}
  .sub{color:var(--muted);font-size:13px}
  nav{display:flex;gap:6px;overflow-x:auto;padding-top:10px}
  nav button{flex:0 0 auto;background:var(--chip);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
  nav button.on{background:var(--accent);color:#06121d;border-color:var(--accent);font-weight:600}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{background:var(--accent);color:#06121d;border:0;border-radius:8px;padding:7px 12px;font-weight:600;cursor:pointer;font-size:14px}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
  .trade-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
  .partner{font-weight:600}
  .pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .pill.winnow{color:var(--warn);border-color:#5a4a26}
  .pill.rebuild{color:var(--good);border-color:#24503d}
  .pill.middle{color:var(--accent);border-color:#264a63}
  .sides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:560px){.sides{grid-template-columns:1fr}}
  .side{background:var(--panel2);border-radius:10px;padding:10px}
  .side h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .asset{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px dashed #2a313b}
  .asset:first-of-type{border-top:0}
  .asset .nm{font-weight:600}
  .asset .meta{color:var(--muted);font-size:12px}
  .val{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;text-align:right;white-space:nowrap}
  .meter{height:6px;background:var(--chip);border-radius:6px;position:relative;margin:10px 0 4px}
  .meter i{position:absolute;top:-3px;width:2px;height:12px;background:var(--text)}
  .meter b{position:absolute;top:0;height:6px;border-radius:6px}
  ul.why{margin:8px 0 0;padding-left:18px;color:#cfd6de;font-size:13.5px}
  ul.why li{margin:2px 0}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  th{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  .scroll{overflow-x:auto}
  select,input,textarea{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:14px}
  textarea{width:100%;min-height:120px}
  .tag{font-size:11px;padding:1px 6px;border-radius:6px;margin-left:4px;background:var(--chip);color:var(--muted)}
  .tag.sell{color:var(--warn)} .tag.buy{color:var(--good)} .tag.hot{color:#ff8fd0}
  .status{font-size:13px;color:var(--muted)}
  .err{color:var(--bad)}
  .hidden{display:none}
  .bar{height:5px;background:var(--chip);border-radius:4px;overflow:hidden;min-width:60px}
  .bar span{display:block;height:100%;background:var(--good)}
  label.set{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .seg button{background:var(--chip);border:1px solid var(--line);color:var(--muted);padding:3px 8px;font-size:12px;cursor:pointer}
  .seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}
  .seg button.on{color:#06121d;background:var(--accent);border-color:var(--accent)}
  .small{font-size:12px;color:var(--muted)}
  a{color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--chip);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:5px 10px;font-size:13px;cursor:pointer}
  .chip.on{background:var(--accent);color:#06121d;border-color:var(--accent)} .chip.on .small{color:#06121d}
  tr.tap{cursor:pointer} tr.tap:hover td, tr.tap.open td{background:var(--panel2)}
  tr.tap td:first-child b::after{content:' ›';color:var(--muted);font-weight:400}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="row" style="justify-content:space-between">
      <div>
        <h1 id="title">Trade Finder</h1>
        <div class="sub" id="subtitle">Loading league…</div>
      </div>
      <button class="btn ghost" id="refresh">Refresh</button>
    </div>
    <nav id="tabs">
      <button data-tab="trades" class="on">Top trades</button>
      <button data-tab="week">This week</button>
      <button data-tab="targets">Targets</button>
      <button data-tab="points">Points</button>
      <button data-tab="fa">Free agents</button>
      <button data-tab="myteam">My team</button>
      <button data-tab="league">League</button>
      <button data-tab="evaluate">Evaluate</button>
      <button data-tab="offers">Offers</button>
      <button data-tab="settings">Settings</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="status" id="status">Fetching Sleeper and FantasyCalc…</div>

  <section id="tab-trades"></section>
  <section id="tab-week" class="hidden"></section>
  <section id="tab-targets" class="hidden"></section>
  <section id="tab-points" class="hidden"></section>
  <section id="tab-fa" class="hidden"></section>
  <section id="tab-myteam" class="hidden"></section>
  <section id="tab-league" class="hidden"></section>
  <section id="tab-evaluate" class="hidden"></section>
  <section id="tab-offers" class="hidden"></section>
  <section id="tab-settings" class="hidden"></section>
</main>

<script>
/*ENGINE-START*/
// ---------- Pure trade engine (no DOM) ----------
const ENGINE = (() => {

  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const FLEX_ELIG = {
    FLEX: ['RB', 'WR', 'TE'], SUPER_FLEX: ['QB', 'RB', 'WR', 'TE'],
    REC_FLEX: ['WR', 'TE'], WRRB_FLEX: ['RB', 'WR'],
  };
  const SKILL = ['QB', 'RB', 'WR', 'TE'];

  // Two-year age-curve multiplier: how much of today's value a player is likely to keep.
  function ageMult(pos, age) {
    if (age == null || isNaN(age)) return 1;
    const a = Math.floor(age);
    const t = {
      RB: [[23, 1.15], [24, 1.05], [25, 0.92], [26, 0.78], [27, 0.62], [28, 0.5], [99, 0.4]],
      WR: [[23, 1.15], [25, 1.08], [26, 1.0], [27, 0.92], [28, 0.82], [29, 0.7], [30, 0.58], [99, 0.45]],
      TE: [[24, 1.15], [27, 1.05], [28, 0.93], [29, 0.82], [30, 0.7], [99, 0.55]],
      QB: [[25, 1.12], [29, 1.05], [32, 0.96], [33, 0.86], [34, 0.76], [99, 0.6]],
    }[pos];
    if (!t) return 1;
    for (const [lim, m] of t) if (a <= lim) return m;
    return 1;
  }

  // Parse FantasyCalc pick names like "2027 1st", "2027 Round 1", "2027 Early 1st", "2027 Pick 1.05"
  function parsePick(name) {
    const y = (name.match(/\b(20\d\d)\b/) || [])[1];
    if (!y) return null;
    let round = null, tier = 'generic', m;
    if ((m = name.match(/Pick\s*(\d)\.(\d{1,2})/i))) {
      round = +m[1]; const slot = +m[2];
      tier = slot <= 4 ? 'early' : slot <= 8 ? 'mid' : 'late';
    } else if ((m = name.match(/(\d)(?:st|nd|rd|th)\b/i)) || (m = name.match(/Round\s*(\d)/i))) {
      round = +m[1];
      if (/early/i.test(name)) tier = 'early'; else if (/mid/i.test(name)) tier = 'mid'; else if (/late/i.test(name)) tier = 'late';
    }
    if (!round) return null;
    return { season: y, round, tier };
  }

  const DEFAULT_PICK = { 1: 3600, 2: 1700, 3: 900, 4: 500, 5: 300 };

  function buildPickTable(fcRows) {
    const t = {}; // season -> round -> {early:[],mid:[],late:[],generic:[]}
    for (const r of fcRows) {
      if (r.player.position !== 'PICK') continue;
      const p = parsePick(r.player.name);
      if (!p) continue;
      t[p.season] ??= {}; t[p.season][p.round] ??= { early: [], mid: [], late: [], generic: [] };
      t[p.season][p.round][p.tier].push(r.value);
    }
    const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
    return function pickValue(season, round, tier) {
      const r = t[season]?.[round];
      if (r) {
        const exact = avg(r[tier] || []);
        if (exact) return exact;
        const all = [...r.early, ...r.mid, ...r.late];
        const g = avg(r.generic) ?? avg(all);
        if (g) return tier === 'early' ? g * 1.2 : tier === 'late' ? g * 0.82 : g;
      }
      // fall back: nearest season in table, else defaults; future years discounted slightly
      const seasons = Object.keys(t).sort();
      for (const s of seasons) if (t[s][round]) {
        const r2 = t[s][round]; const g = avg([...r2.generic, ...r2.early, ...r2.mid, ...r2.late]);
        if (g) return g * (tier === 'early' ? 1.2 : tier === 'late' ? 0.82 : 1);
      }
      return (DEFAULT_PICK[round] || 200) * (tier === 'early' ? 1.2 : tier === 'late' ? 0.82 : 1);
    };
  }

  // Best possible starting lineup value for a set of players.
  function lineupValue(players, slots, key = 'now') {
    const pool = players.filter(p => SKILL.includes(p.pos)).slice().sort((a, b) => b[key] - a[key]);
    const used = new Set(); let total = 0; const filled = [];
    const dedicated = slots.filter(s => SKILL.includes(s));
    const flex = slots.filter(s => FLEX_ELIG[s]).sort((a, b) => FLEX_ELIG[a].length - FLEX_ELIG[b].length);
    for (const s of dedicated) {
      const p = pool.find(x => !used.has(x.id) && x.pos === s);
      if (p) { used.add(p.id); total += p[key]; filled.push([s, p]); }
    }
    for (const s of flex) {
      const p = pool.find(x => !used.has(x.id) && FLEX_ELIG[s].includes(x.pos));
      if (p) { used.add(p.id); total += p[key]; filled.push([s, p]); }
    }
    return { total, starters: used, filled };
  }

  function percentileMap(entries) { // entries: [id, number]
    const sorted = entries.slice().sort((a, b) => a[1] - b[1]);
    const m = new Map(); const n = sorted.length;
    sorted.forEach(([id], i) => m.set(id, n > 1 ? i / (n - 1) : 0.5));
    return m;
  }

  function normaliseStats(raw) {
    // Accept v1 object {id: {...}} or array [{player_id, stats:{...}}]
    const out = new Map();
    if (!raw) return out;
    if (Array.isArray(raw)) { for (const r of raw) if (r && r.player_id) out.set(String(r.player_id), r.stats || r); }
    else for (const [id, s] of Object.entries(raw)) out.set(String(id), s);
    return out;
  }

  // history = { dates: ["2026-11-06", ...], values: { sleeperId: [v, v, null, ...] } }
  // Returns Map id -> {peak, daysSincePeak} over the last `windowDays`, only once there are 21+ days saved.
  function summariseHistory(history, windowDays) {
    if (!history?.dates?.length) return null;
    const dates = history.dates.map(d => Date.parse(d));
    const last = dates[dates.length - 1];
    const span = Math.round((last - dates[0]) / 86400000);
    if (span < 21) return null;
    const from = last - windowDays * 86400000;
    const out = new Map(); out.span = Math.min(span, windowDays);
    for (const [id, vals] of Object.entries(history.values || {})) {
      let peak = -1, peakAt = null;
      vals.forEach((v, i) => { if (v != null && dates[i] >= from && v >= peak) { peak = v; peakAt = dates[i]; } });
      if (peak >= 0) out.set(String(id), { peak, daysSincePeak: Math.round((last - peakAt) / 86400000) });
    }
    return out;
  }

  // ---- Injuries ----
  // Out/IR players score nothing for a contender this season, so their price dips. Young ones with a
  // good recovery outlook are classic rebuilder buys.
  const SEVERE = /achilles/i;
  const LONG = /acl|mcl|knee|lisfranc|patell|tibia|fibula|fracture|broken|leg|neck|spine|pectoral|foot/i;
  function injuryAssess(p) {
    const st = (p.injury || '').toUpperCase();
    const outNow = /^(IR|PUP|OUT|DOUBTFUL|SUS|NFI)/.test(st);
    p.injuredOut = outNow;
    if (!outNow) { p.injStash = false; return; }
    const body = `${p.injuryBody || ''} ${p.injuryNotes || ''}`;
    let recovery = SEVERE.test(body) ? 0.65 : LONG.test(body) ? 0.85 : 0.95;
    p.injSeverity = SEVERE.test(body) ? 'severe' : LONG.test(body) ? 'long-term' : 'short-term';
    const age = p.age ?? 30;
    if (age <= 24) recovery += 0.05; else if (age >= 27) recovery -= 0.1;
    p.injRecovery = clamp(recovery, 0.4, 1);
    // A contender gets little or nothing from him this season
    p.now *= /^(IR|PUP|NFI)/.test(st) ? 0.1 : st.startsWith('OUT') || st.startsWith('SUS') ? 0.5 : 0.7;
    // Worth stashing: young, was a real asset, decent recovery odds
    const quality = p.value >= 1500 || (p.yoe ?? 9) <= 1 && p.value >= 800 || (p.peakValue ?? 0) >= 2000;
    p.injStash = age <= 26 && quality && p.injRecovery >= 0.75;
    p.injRebound = p.injStash ? Math.max(p.peakValue || p.value, p.value * 1.2) * p.ageMult * p.injRecovery : null;
  }

  // ---- Trade history: what each manager tends to do ----
  // tradeHistory = [{ season, rosters: [{roster_id, owner_id}], txns: [...] }]
  // Values are today's FantasyCalc values (a guide to what moved, not what it was worth at the time).
  function buildTendencies(tradeHistory, teams, { fcById, sleeperPlayers, pickValue, history }) {
    const log = [];
    // Value on the day of the trade, from the saved daily history (null if the trade predates it)
    const hDates = (history?.dates || []).map(d => Date.parse(d));
    const valueAt = (key, when) => {
      if (!when || !hDates.length || when < hDates[0] - 86400000) return null;
      const vals = history.values?.[key]; if (!vals) return null;
      let i = hDates.length - 1; while (i > 0 && hDates[i] > when) i--;
      for (let j = i; j >= 0 && j >= i - 3; j--) if (vals[j] != null) return vals[j];
      return null;
    };
    for (const t of teams) t.profile = { trades: 0, seasons: new Set(), partners: {}, picksIn: 0, picksOut: 0, piecesIn: 0, piecesOut: 0, ageIn: [0, 0], ageOut: [0, 0], posIn: {}, valIn: 0, valOut: 0, tags: [], favPos: [], perSeason: 0, pickNet: 0, consol: 0, ageNet: 0 };
    if (!tradeHistory?.length) return log;
    const byOwner = new Map(teams.map(t => [t.ownerId, t]));
    const nowYear = new Date().getFullYear() + new Date().getMonth() / 12;
    for (const set of tradeHistory) {
      const ownerOf = new Map((set.rosters || []).map(r => [r.roster_id, r.owner_id]));
      for (const tx of set.txns || []) {
        if (tx.type !== 'trade' || tx.status !== 'complete') continue;
        const when = tx.status_updated || tx.created || 0;
        const yearsAgo = when ? Math.max(0, nowYear - (new Date(when).getFullYear() + new Date(when).getMonth() / 12)) : 0;
        const sides = {};
        for (const rid of tx.roster_ids || []) sides[rid] = { got: [], gave: [] };
        const pl = (id) => {
          const f = fcById.get(String(id)), sp = sleeperPlayers?.[id] || {};
          const age = f?.player.maybeAge ?? sp.age;
          return { kind: 'player', id: String(id), name: f?.player.name || sp.full_name || `Player ${id}`, pos: f?.player.position || sp.position || '?',
            value: f?.value ?? 0, then: valueAt(String(id), when), age: age != null ? +age - yearsAgo : null };
        };
        for (const [id, rid] of Object.entries(tx.adds || {})) sides[rid]?.got.push(pl(id));
        for (const [id, rid] of Object.entries(tx.drops || {})) sides[rid]?.gave.push(pl(id));
        for (const dp of tx.draft_picks || []) {
          const pk = { kind: 'pick', name: `${dp.season} round ${dp.round}`, value: pickValue(String(dp.season), dp.round, 'generic'), then: valueAt(`pick:${dp.season}:${dp.round}`, when), pos: 'PICK' };
          sides[dp.owner_id]?.got.push(pk); sides[dp.previous_owner_id]?.gave.push(pk);
        }
        const entry = { when, season: set.season, sides: [] };
        const allAssets = Object.values(sides).flatMap(sd => [...sd.got, ...sd.gave]);
        // Graded "at the time" only if we have a saved value for (nearly) everything that moved
        entry.atTime = allAssets.length > 0 && allAssets.filter(a => a.then != null || a.value < 200).length === allAssets.length;
        for (const [rid, sd] of Object.entries(sides)) {
          const team = byOwner.get(ownerOf.get(+rid));
          entry.sides.push({ team, teamName: team?.name || 'Former manager', ...sd });
          if (!team) continue;
          const pr = team.profile;
          pr.trades++; pr.seasons.add(set.season);
          pr.piecesIn += sd.got.length; pr.piecesOut += sd.gave.length;
          for (const a of sd.got) {
            pr.valIn += a.value;
            if (a.kind === 'pick') pr.picksIn += a.value;
            else { pr.posIn[a.pos] = (pr.posIn[a.pos] || 0) + a.value; if (a.age) { pr.ageIn[0] += a.age * a.value; pr.ageIn[1] += a.value; } }
          }
          for (const a of sd.gave) {
            pr.valOut += a.value;
            if (a.kind === 'pick') pr.picksOut += a.value;
            else if (a.age) { pr.ageOut[0] += a.age * a.value; pr.ageOut[1] += a.value; }
          }
          for (const other of tx.roster_ids || []) if (other !== +rid) {
            const ot = byOwner.get(ownerOf.get(other));
            if (ot) pr.partners[ot.name] = (pr.partners[ot.name] || 0) + 1;
          }
        }
        log.push(entry);
      }
    }
    log.sort((a, b) => b.when - a.when);
    const seasonsTotal = new Set(tradeHistory.map(s => s.season)).size || 1;
    for (const t of teams) {
      const pr = t.profile;
      pr.perSeason = pr.trades / seasonsTotal;
      pr.pickNet = pr.picksIn - pr.picksOut;
      pr.consol = pr.trades ? (pr.piecesOut - pr.piecesIn) / pr.trades : 0; // >0: gives more pieces than gets (consolidator)
      const ai = pr.ageIn[1] ? pr.ageIn[0] / pr.ageIn[1] : null, ao = pr.ageOut[1] ? pr.ageOut[0] / pr.ageOut[1] : null;
      pr.ageNet = ai != null && ao != null ? ai - ao : 0; // >0: buys older than they sell
      const posTot = Object.values(pr.posIn).reduce((a, b) => a + b, 0) || 1;
      pr.posShare = Object.fromEntries(Object.entries(pr.posIn).map(([k, v]) => [k, v / posTot]));
      const tags = [];
      if (!pr.trades) tags.push("Hasn't traded");
      else {
        if (pr.perSeason >= 3) tags.push('Active trader'); else if (pr.perSeason < 1) tags.push('Rarely trades');
        if (pr.pickNet > 1500) tags.push('Collects picks'); else if (pr.pickNet < -1500) tags.push('Spends picks');
        if (pr.consol >= 0.5) tags.push('Consolidates (2-for-1s)'); else if (pr.consol <= -0.5) tags.push('Adds depth (1-for-2s)');
        if (pr.ageNet >= 1.5) tags.push('Buys veterans'); else if (pr.ageNet <= -1.5) tags.push('Buys youth');
        const fav = Object.entries(pr.posShare).filter(([k]) => k !== '?').sort((a, b) => b[1] - a[1])[0];
        if (fav && fav[1] >= 0.45 && pr.trades >= 2) tags.push(`Targets ${fav[0]}s`);
        const bud = Object.entries(pr.partners).sort((a, b) => b[1] - a[1])[0];
        if (bud && bud[1] >= 2) tags.push(`Often trades with ${bud[0]}`);
      }
      pr.tags = tags;
      pr.favPos = Object.entries(pr.posShare).filter(([k, v]) => k !== '?' && v >= 0.45 && pr.trades >= 2).map(([k]) => k);
    }
    return log;
  }

  function buildModel(input, prefs) {
    const result = buildModelInner(input, prefs);
    model_ref = result;
    return result;
  }
  function buildModelInner(input, prefs) {
    const { league, users, rosters, tradedPicks = [], fc = [], sleeperPlayers = null, stats = null, trending = [], myUsername, history = null } = input;
    const hist = summariseHistory(history, prefs.dipWindow ?? 90);
    const slots = (league.roster_positions || []).filter(s => SKILL.includes(s) || FLEX_ELIG[s]);
    const season = +league.season;
    const draftRounds = league.settings?.draft_rounds || 4;

    const fcById = new Map();
    for (const r of fc) if (r.player?.sleeperId) fcById.set(String(r.player.sleeperId), r);
    const pickValue = buildPickTable(fc);
    const statMap = normaliseStats(stats);
    const trendMap = new Map((trending || []).map(t => [String(t.player_id), t.count]));
    const expertMap = new Map((input.experts?.players || []).map(e => [String(e.id), e]));
    const maxTrend = Math.max(1, ...trendMap.values());

    const userById = new Map(users.map(u => [u.user_id, u]));

      const slotTxt = projected ? `${r}.${String(Math.round(slot)).padStart(2, '0')}` : null;
      const equiv = base !== n || projected ? `${tier} ${ORD[r2] || 'R' + r2}${base !== n ? ` in a ${base}-team draft` : ''}` : null;
      const label = `${s} ${ord}` + (slotTxt ? ` (proj. ${slotTxt})` : '') + (+orig !== owner ? ` from ${origTeam.name}` : '');
      picks.set(`pick:${k}`, {
        id: `pick:${k}`, kind: 'pick', owner, name: label, pos: 'PICK', season: s, round: +r, origRoster: +orig, equiv,
        value, now: 0, future: value * 1.05, age: null, ageMult: 1, breakout: +r === 1 ? 0.35 : 0.15, sell: 0, trend: 0, signals: {}, dropPct: 0, dipFatigue: 0,
      });
    }

    for (const t of teams) {
      t.assets = [...t.playerIds.map(id => players.get(id)), ...[...picks.values()].filter(p => p.owner === t.rosterId)];
      t.players = t.assets.filter(a => a.kind === 'player');
    }
    const tradeLog = buildTendencies(input.tradeHistory, teams, { fcById, sleeperPlayers, pickValue, history: input.history });
    TREND_LABEL = input.trendLabel || 'in 30 days';
    return { trendLabel: input.trendLabel || null, league, slots, season, teams, teamById, players, picks, me, haveStats, haveTrending: trendMap.size > 0, histSpan: hist?.span || 0, tradeLog,
      fcById, sleeperPlayers, trendMap, statMap, maxTrend, rostered: new Set(teams.flatMap(t => t.playerIds)), proj, fit, featMode, fairFit };
  }

  const STRAT_W = { winnow: { now: 1.0, fut: 0.25 }, middle: { now: 0.6, fut: 0.6 }, rebuild: { now: 0.12, fut: 1.0 } };

  // How a team with a given strategy values an asset long-term.
  // Rebuilders: older players are nearly worthless, QBs/WRs/picks are prized, RBs discounted.
  // Contenders: picks are worth a bit less (they don't help this season).
  const REBUILD_POS = { QB: 1.12, WR: 1.1, TE: 0.95, RB: 0.82 };
  function stratFuture(a, strat) {
    let f = a.future;
    if (strat === 'rebuild') {
      if (a.kind === 'pick') return f * 1.1;
      if (a.ageMult < 0.9) f *= 0.35;
      return f * (REBUILD_POS[a.pos] || 1);
    }
    if (strat === 'winnow' && a.kind === 'pick') return f * 0.85;
    return f;
  }
  // Power mean on plain numbers (same consolidation logic as packageValue)
  const pm = vals => Math.pow(vals.reduce((s, v) => s + Math.pow(Math.max(0, v), CONSOLIDATION_K), 0), 1 / CONSOLIDATION_K);

  // Effective market value of a package. Uses a power mean so one great asset beats several
  // middling ones: two 1,500s ≈ 2,300, not 3,000; two 4,000s ≈ 6,200, not 8,000.
  const CONSOLIDATION_K = 1.6;
  function packageValue(assets) {
    const k = CONSOLIDATION_K;
    return Math.pow(assets.reduce((s, a) => s + Math.pow(Math.max(0, a.value), k), 0), 1 / k);
  }
  const rawValue = assets => assets.reduce((s, a) => s + a.value, 0);

  // KeepTradeCut's trade-calculator value adjustment. Each piece is re-weighted against the best single
  // piece in the whole trade; the side with the better weighted total gets a "value adjustment" added,
  // converted back into raw value. Returns effective totals for each side.
  const KTC_TOP = 10099;
  const ktcAdj = (v, r) => (0.1 * Math.pow(v / KTC_TOP, 1.4) + 0.7 * Math.pow(v / (1.05 * r), 1.25) + 0.2) * v;
  function ktcInverse(target, r) { // solve ktcAdj(x, r) = target (Newton's method, as KTC does)
    if (target <= 0) return 0;
    let x = Math.min(5 * target, 3 * r);
    for (let i = 0; i < 30; i++) {
      const f = ktcAdj(x, r) - target;
      const d = 0.24 * Math.pow(x, 1.4) / Math.pow(KTC_TOP, 1.4) + 1.575 * Math.pow(x, 1.25) / (Math.pow(1.05, 1.25) * Math.pow(r, 1.25)) + 0.2;
      const nx = Math.max(0, x - f / d);
      if (Math.abs(nx - x) < 1e-6) return nx;
      x = nx;
    }
    return x;
  }
  function ktcCompare(A, B) {
    const ra = rawValue(A), rb = rawValue(B);
    const r = Math.max(1, ...A.map(a => a.value), ...B.map(b => b.value));
    const sa = A.reduce((s, a) => s + ktcAdj(Math.max(0, a.value), r), 0);
    const sb = B.reduce((s, b) => s + ktcAdj(Math.max(0, b.value), r), 0);
    const x = ktcInverse(Math.abs(sa - sb), r);
    let adjA = 0, adjB = 0;
    if (sa > sb) { const b = rb + x - ra; if (b > 0) adjA = b; else adjB = -b; }
    else if (sb > sa) { const b = ra + x - rb; if (b > 0) adjB = b; else adjA = -b; }
    return { a: ra + adjA, b: rb + adjB, rawA: ra, rawB: rb, adjA, adjB };
  }

  // ---- Learning from offers you've sent ----
  // offers: [{ownerId, partnerName, give:[{id,name,value}], get:[...], status:'open'|'accepted'|'rejected'|'withdrawn', reason}]
  const offerKey = (give, get) => give.map(a => a.id).sort().join(',') + '|' + get.map(a => a.id).sort().join(',');
  function learnFromOffers(offers, interest = []) {
    const L = { mgrBias: {}, premium: {}, dislike: {}, rejectedKeys: new Set(), offeredKeys: new Set(), notes: {}, wants: {}, demand: {} };
    // Interest in your players: that manager values him more; a little more demand league-wide too
    for (const i of interest) {
      (L.wants[i.ownerId] ??= {})[i.playerId] = true;
      L.demand[i.playerId] = clamp((L.demand[i.playerId] || 0) + 0.05, 0, 0.15);
    }
    const add = (o, k, v, lo, hi) => { o[k] = clamp((o[k] || 0) + v, lo, hi); };
    const note = (owner, txt) => (L.notes[owner] ??= []).push(txt);
    for (const o of offers || []) {
      const key = offerKey(o.give, o.get);
      L.offeredKeys.add(key);
      if (o.status === 'accepted') {
        add(L.mgrBias, o.ownerId, -0.15, -0.5, 1.5);
        note(o.ownerId, 'accepted');
      } else if (o.status === 'rejected') {
        L.rejectedKeys.add(key);
        if (o.reason === 'more') { add(L.mgrBias, o.ownerId, 0.35, -0.5, 1.5); note(o.ownerId, 'wanted more'); }
        else if (o.reason === 'keep') {
          add(L.mgrBias, o.ownerId, 0.1, -0.5, 1.5);
          for (const a of o.get) add(L.premium, a.id, 0.15, 0, 0.6);
          note(o.ownerId, `wouldn't sell ${o.get.map(a => a.name).join(', ')}`);
        } else if (o.reason === 'dislike') {
          L.dislike[o.ownerId] ??= {};
          for (const a of o.give) add(L.dislike[o.ownerId], a.id, 0.3, 0, 1);
          note(o.ownerId, `didn't want ${o.give.map(a => a.name).join(', ')}`);
        } else { add(L.mgrBias, o.ownerId, 0.2, -0.5, 1.5); note(o.ownerId, 'said no'); }
      }
    }
    return L;
  }

  // Extra value of owning your starter's handcuff: insurance worth ~15% of the starter's this-season value
  const CUFF_SHARE = 0.15;
  function cuffValue(players) {
    const ids = new Set(players.map(p => p.id));
    let v = 0;
    for (const p of players) if (p.cuffId && ids.has(p.cuffId) && p.now >= 800) v += CUFF_SHARE * p.now;
    return v;
  }

  // ---- Shared trade evaluator ----
  function makeCtx(model, prefs) {
    const me = model.me;
    // Want at least `taxiGoal` good taxi-eligible players for next season: boost rookies until then
    const goal = prefs.taxiGoal ?? 4;
    const haveTaxi = me.players.filter(p => p.taxiNext && p.value >= 800).length;
    const taxiBoost = a => a.taxiNext && a.owner !== me.rosterId && haveTaxi < goal && a.value >= 500 ? 1.12 : 1;
    const myAssetScore = a => {
      if (a.injStash && prefs.injuryStash !== false) return Math.max(a.future, a.injRebound) * 1.1 * taxiBoost(a);
      if (a.buyLow && prefs.buyLow !== false) return Math.max(a.future, a.rebound) * (1.15 * (0.85 + 0.3 * a.dipFatigue));
      // Same strategy lens on what you receive as on what you give (a rebuild discounts veterans either way)
      return stratFuture(a, me.strategy) * (1 + 0.35 * a.breakout) * taxiBoost(a);
    };
    // A manager whose player dipped recently still anchors to the old price; after a long dip they let go.
    const anchored = a => a.buyLow ? 1 + a.dropPct * (1 - a.dipFatigue) : 1;
    return {
      me, tol: prefs.fairness ?? 0.12, myAssetScore, anchored, even: prefs.evenDeals ?? 'prefer', learn: prefs.learn || null,
      myStrat: STRAT_W[me.strategy],
      myLineupBefore: lineupValue(me.players, model.slots).total,
      theirBefore: new Map(model.teams.map(t => [t.rosterId, lineupValue(t.players, model.slots)])),
      cuffBefore: new Map(model.teams.map(t => [t.rosterId, cuffValue(t.players)])),
    };
  }

  function evaluate(model, ctx, t, G, R, opts = {}) {
    const { me, tol } = ctx;
    const kc = ktcCompare(G, R);
    const gv = kc.a, rv = kc.b;
    const diff = (rv - gv) / Math.max(rv, gv, 1); // + means I receive more market value
    const res = { partner: t, give: G, get: R, gv, rv, diff, ok: true, why: [], kc };
    const fail = m => { res.ok = false; res.fail = m; return res; };
    if (Math.abs(diff) > tol) if (!opts.noChecks) return fail(diff > 0 ? 'they lose too much market value' : 'you overpay');
    const topGive = Math.max(...G.map(a => a.value)), topGet = Math.max(...R.map(a => a.value));
    if (topGet > topGive && diff > 0.05) if (!opts.noChecks) return fail('they give the best piece and lose value');
    if (topGive > topGet && diff < -0.05) if (!opts.noChecks) return fail('you give the best piece and lose value');
    if (Math.min(topGive, topGet) < 0.5 * Math.max(topGive, topGet)) if (!opts.noChecks) return fail('quantity for quality');
    const w = STRAT_W[t.strategy];
    const before = ctx.theirBefore.get(t.rosterId);
    const gIds = new Set(G.map(a => a.id)), rIds = new Set(R.map(a => a.id));
    const theirAfterPl = t.players.filter(p => !rIds.has(p.id)).concat(G.filter(a => a.kind === 'player'));
    const after = lineupValue(theirAfterPl, model.slots);
    res.cuffThem = cuffValue(theirAfterPl) - ctx.cuffBefore.get(t.rosterId);
    res.theirNow = after.total - before.total + res.cuffThem;
    res.cuffNotes = [];
    for (const a of G) if (a.cuffOf && t.players.some(p => p.id === a.cuffOf)) res.cuffNotes.push(`${a.name} is the handcuff to their starter ${a.cuffOfName}, so he's worth extra to them`);
    for (const a of R) if (a.cuffOf && t.players.some(p => p.id === a.cuffOf)) res.cuffNotes.push(`they'd lose ${a.name}, their handcuff for ${a.cuffOfName}`);
    res.newStarters = after.filled.filter(([, p]) => gIds.has(p.id)).map(([slot, p]) => [slot, p]);
    res.theirFut = pm(G.map(a => stratFuture(a, t.strategy))) - pm(R.map(a => stratFuture(a, t.strategy) * ctx.anchored(a)));
    res.partnerU = (w.now * res.theirNow + w.fut * res.theirFut) / 1000 - Math.max(0, diff) * 2.5;
    // Nudge by this manager's trade history
    const pr = t.profile; res.tendency = [];
    if (pr?.trades) {
      let b = 0;
      const gPl = G.filter(a => a.kind === 'player'), rPl = R.filter(a => a.kind === 'player');
      const avgAge = l => { const x = l.filter(a => a.age); return x.length ? x.reduce((s, a) => s + a.age, 0) / x.length : null; };
      if (pr.pickNet > 1500 && G.some(a => a.kind === 'pick')) { b += 0.3; res.tendency.push('they tend to collect picks'); }
      if (pr.pickNet < -1500 && R.some(a => a.kind === 'pick')) { b += 0.25; res.tendency.push('they tend to spend picks on players'); }
      if (pr.consol >= 0.5 && G.length < R.length) { b += 0.25; res.tendency.push('they like consolidating into fewer, better pieces'); }
      if (pr.consol <= -0.5 && G.length > R.length) { b += 0.2; res.tendency.push('they like adding depth'); }
      const ag = avgAge(gPl), ar = avgAge(rPl);
      if (ag && ar && pr.ageNet >= 1.5 && ag > ar) { b += 0.2; res.tendency.push('they usually buy proven veterans'); }
      if (ag && ar && pr.ageNet <= -1.5 && ag < ar) { b += 0.2; res.tendency.push('they usually buy youth'); }
      const fp = gPl.find(a => pr.favPos.includes(a.pos));
      if (fp) { b += 0.15; res.tendency.push(`they often trade for ${fp.pos}s`); }
      res.partnerU += b;
    }
    // Managers prefer deals with the same number of pieces each side (roster spots, and uneven deals feel lopsided)
    res.imbalance = Math.abs(G.length - R.length);
    if (res.imbalance && ctx.even === 'strict') if (!opts.noChecks) return fail('uneven number of pieces');
    if (res.imbalance && ctx.even === 'prefer') {
      const likesIt = pr?.consol >= 0.5 && G.length < R.length; // a known consolidator doesn't mind
      res.partnerU -= (likesIt ? 0.15 : 0.35) * res.imbalance;
    }
    const myAfter = me.players.filter(p => !gIds.has(p.id)).concat(R.filter(a => a.kind === 'player'));
    res.myNow = lineupValue(myAfter, model.slots).total - ctx.myLineupBefore + (cuffValue(myAfter) - ctx.cuffBefore.get(me.rosterId));
    res.myFut = pm(R.map(ctx.myAssetScore)) - pm(G.map(a => stratFuture(a, me.strategy)));
    res.myU = (ctx.myStrat.now * res.myNow + ctx.myStrat.fut * res.myFut) / 1000;
    // What we've learned from offers you've sent
    const L = ctx.learn;
    if (L) {
      if (L.rejectedKeys.has(offerKey(G, R))) if (!opts.noChecks) return fail('they already turned this exact offer down');
      res.learned = [];
      const bias = L.mgrBias[t.ownerId] || 0;
      if (bias) { res.partnerU -= bias; res.learned.push(bias > 0 ? 'they have turned down offers, so they likely need a bit more' : 'they have accepted offers from you before'); }
      const prem = R.reduce((s, a) => s + (L.premium[a.id] || 0) * a.value, 0) / 1000;
      if (prem) { res.partnerU -= prem; res.learned.push(`${R.filter(a => L.premium[a.id]).map(a => a.name).join(', ')} is valued above market by managers`); }
      const wanted = G.filter(a => L.wants[t.ownerId]?.[a.id]);
      const pull = G.reduce((s, a) => s + ((L.wants[t.ownerId]?.[a.id] ? 0.2 : 0) + (L.demand[a.id] || 0)) * a.value, 0) / 1000;
      if (pull) { res.partnerU += pull; if (wanted.length) res.learned.push(`they asked about ${wanted.map(a => a.name).join(', ')}`); }
      const dis = G.reduce((s, a) => s + (L.dislike[t.ownerId]?.[a.id] || 0) * a.value, 0) / 1000;
      if (dis) { res.partnerU -= dis; res.learned.push(`they didn't want ${G.filter(a => L.dislike[t.ownerId]?.[a.id]).map(a => a.name).join(', ')} last time`); }
    }
    if (opts.partnerBonus) res.partnerU += opts.partnerBonus;
    if (res.partnerU <= (opts.minPartner ?? 0.15)) if (!opts.noChecks) return fail('not enough in it for them');
    if (res.myU <= (opts.minMine ?? 0.2)) if (!opts.noChecks) return fail('not enough in it for you');
    // Managers who actually trade are worth more of your time
    const act = !pr || !model.tradeLog?.length ? 1 : pr.trades === 0 ? 0.85 : clamp(0.92 + 0.06 * pr.perSeason, 0.92, 1.12);
    const evenPen = ctx.even === 'prefer' ? 0.8 * res.imbalance : 0;
    res.score = (res.myU + 0.6 * Math.min(res.partnerU, 3) - 4 * Math.max(0, Math.abs(diff) - 0.04) - evenPen) * act;
    return res;
  }

  function myGivePool(model, prefs, { forOffer = false } = {}) {
    const mark = prefs.marks || {};
    return model.me.assets.filter(a => {
      const m = mark[a.id];
      if (m === 'protect') return false;
      if (m === 'shop') return true;
      if (a.kind === 'pick') return !prefs.protectPicks && a.value >= 400;
      if (a.dip) return false; // never sell a star during a situational dip unless marked Shop
      if (a.injuredOut) return false; // injured players fetch little: don't sell low
      if (a.trendPct <= -0.08) return false; // avoid selling into a falling market
      if (forOffer) return a.value >= 250;
      return a.value >= 600 && (a.sell >= 0.35 || a.ageMult < 0.9);
    });
  }

  function generateTrades(model, prefs) {
    const maxPer = prefs.maxAssets ?? 2;
    const ctx = makeCtx(model, prefs);
    const me = model.me;
    const give = myGivePool(model, prefs).sort((a, b) => (b.sell * b.value) - (a.sell * a.value)).slice(0, 12);
    const results = [];
    for (const t of model.teams) {
      if (t === me) continue;
      // What I'd want from them: young / breakout / picks / buy-low dips
      const want = t.assets.filter(a => a.value >= 400 && (a.kind === 'pick' || a.ageMult >= 1 || a.breakout >= 0.45 || (a.buyLow && prefs.buyLow !== false) || (a.injStash && prefs.injuryStash !== false)))
        .sort((a, b) => ctx.myAssetScore(b) - ctx.myAssetScore(a)).slice(0, 14);
      const cap = maxPer >= 3 ? 8 : 99;
      const giveSets = combos(give.slice(0, cap), maxPer), getSets = combos(want.slice(0, cap + 2), maxPer);
      for (const G of giveSets) {
        if (packageValue(G) < 800) continue;
        for (const R of getSets) {
          if (packageValue(R) < 600) continue;
          const r = evaluate(model, ctx, t, G, R);
          if (r.ok) results.push(r);
        }
      }
    }
    results.sort((a, b) => b.score - a.score);
    // Diversity: max 3 per partner, each of my assets at most twice, each of theirs once
    const out = [], perPartner = {}, myUse = {}, theirUse = {};
    for (const r of results) {
      const pid = r.partner.rosterId;
      if ((perPartner[pid] || 0) >= 3) continue;
      if (r.give.some(a => (myUse[a.id] || 0) >= 2)) continue;
      if (r.get.some(a => theirUse[a.id])) continue;
      out.push(r); perPartner[pid] = (perPartner[pid] || 0) + 1;
      r.give.forEach(a => myUse[a.id] = (myUse[a.id] || 0) + 1);
      r.get.forEach(a => theirUse[a.id] = 1);
      if (out.length >= (prefs.maxResults ?? 20)) break;
    }
    return out;
  }

  // Swap in KTC values (or a 50/50 blend) for FantasyCalc's, keeping FantasyCalc's redraft values and trends
  function applyValues(RAW, src = 'ktc') {
    const K = RAW.ktc;
    if (src === 'fc' || !K?.values) return { ...RAW, valueLabel: 'FantasyCalc', trendLabel: 'in 30 days' };
    const tePrem = (RAW.league.scoring_settings?.bonus_rec_te || 0) > 0;
    const kv = (id, pos) => { const x = K.values[id]; if (!x) return null; return pos === 'TE' && tePrem && x.tep ? x.tep : x.v; };
    // Scale for players KTC doesn't list, so they sit on the same scale
    const ratios = RAW.fc.filter(r => r.player?.sleeperId && K.values[r.player.sleeperId] && r.value > 500).map(r => kv(String(r.player.sleeperId), r.player.position) / r.value).sort((a, b) => a - b);
    const scale = ratios.length ? ratios[Math.floor(ratios.length / 2)] : 1;
    // Value change: from our saved daily KTC values (up to 30 days back), not FantasyCalc's trend
    const H = RAW.historyKtc;
    let ktcTrend = null, trendDays = null, trendSince = null;
    if (H?.dates?.length >= 2) {
      const ds = H.dates.map(d => Date.parse(d)), last = ds[ds.length - 1];
      let bi = ds.findIndex(d => d >= last - 30 * 86400000);
      trendDays = Math.round((last - ds[bi]) / 86400000);
      if (trendDays >= 3) {
        trendSince = H.dates[bi];
        ktcTrend = id => {
          const vals = H.values?.[id]; if (!vals) return 0;
          let base = null; for (let i = bi; i < vals.length - 1 && base == null; i++) base = vals[i];
          const cur = K.values[id]?.v ?? vals[vals.length - 1];
          return base == null || cur == null ? 0 : cur - base;
        };
      }
    }
    const trendFor = (id, v, r) => {
      const fcT = (r?.trend30Day || 0) * (v / Math.max(1, r?.value || v));
      if (src === 'fc') return fcT;
      if (!ktcTrend) return src === 'blend' ? fcT / 2 : 0; // no KTC history yet: don't show FantasyCalc moves as KTC moves
      const raw = K.values[id]?.v || v;
      const kt = ktcTrend(id) * (v / Math.max(1, raw)); // scale for TE-premium values
      return src === 'blend' ? (kt + fcT) / 2 : kt;
    };
    const seen = new Set();
    const rows = [];
    for (const r of RAW.fc) {
      if (r.player?.position === 'PICK') { if (src === 'blend') rows.push(r); continue; }
      const id = r.player?.sleeperId ? String(r.player.sleeperId) : null;
      const k = id ? kv(id, r.player.position) : null;
      const fcv = r.value * scale;
      const v = k == null ? fcv : src === 'blend' ? (k + r.value) / 2 : k;
      if (id) seen.add(id);
      rows.push({ ...r, value: v, trend30Day: id ? trendFor(id, v, r) : 0 });
    }
    // Players KTC values that FantasyCalc doesn't list
    for (const [id, x] of Object.entries(K.values)) {
      if (seen.has(id)) continue;
      const sp = RAW.sleeperPlayers?.[id] || {};
      const pos = sp.position || '?';
      rows.push({ player: { name: x.name, sleeperId: id, position: pos, maybeAge: sp.age ?? null, maybeTeam: sp.team || null, maybeYoe: sp.years_exp ?? null }, value: kv(id, pos), redraftValue: kv(id, pos) * 0.55, trend30Day: trendFor(id, kv(id, pos), null) });
    }
    for (const pk of K.picks || []) rows.push({ player: { name: pk.name, position: 'PICK' }, value: pk.value });
    const history = src === 'ktc' && RAW.historyKtc?.dates?.length ? RAW.historyKtc : RAW.history;
    const trendLabel = src === 'fc' ? 'in 30 days' : trendDays >= 28 ? 'in 30 days' : trendSince ? `since ${new Date(trendSince).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}` : null;
    return { ...RAW, fc: rows, history, trendLabel, pickTeams: src === 'ktc' ? 12 : undefined, valueLabel: src === 'blend' ? 'KTC + FantasyCalc blend' : 'KTC' };
  }

  // ---- Draft order: max PF (best possible lineup each week) excluding taxi players, regular season only ----
  // matchups: { [week]: [{ roster_id, players: [ids], players_points: {id: pts} }] }
  function draftOrder(model, matchups, regWeeks) {
    const sp = model.sleeperPlayers || {};
    const posOf = id => model.players.get(id)?.pos || sp[id]?.position || '?';
    const rows = model.teams.map(t => ({ team: t, maxPF: 0, weeks: 0, byWeek: [] }));
    const byRoster = new Map(rows.map(r => [r.team.rosterId, r]));
    const taxi = new Map(model.teams.map(t => [t.rosterId, new Set(t.taxiIds || [])]));
    for (const w of Object.keys(matchups || {}).map(Number).sort((a, b) => a - b)) {
      if (w > regWeeks) continue;
      for (const m of matchups[w] || []) {
        const row = byRoster.get(m.roster_id); if (!row) continue;
        const pts = m.players_points || {};
        const pool = (m.players || []).map(String).filter(id => !taxi.get(m.roster_id)?.has(id))
          .map(id => ({ id, pos: posOf(id), pts: pts[id] || 0 }));
        const best = lineupValue(pool, model.slots, 'pts').total;
        row.maxPF += best; row.weeks++; row.byWeek.push(best);
      }
    }
    for (const r of rows) {
      const recent = r.byWeek.slice(-4);
      r.recentAvg = recent.length ? recent.reduce((a, b) => a + b, 0) / recent.length : 0;
      const left = Math.max(0, regWeeks - r.weeks);
      r.projected = r.maxPF + r.recentAvg * left;
    }
    // Draft order uses actual max PF so far (lowest picks first); projected order shown separately
    rows.slice().sort((a, b) => a.projected - b.projected).forEach((r, i) => { r.projSlot = i + 1; });
    rows.sort((a, b) => a.maxPF - b.maxPF);
    rows.forEach((r, i) => { r.slot = i + 1; });
    return { rows, played: Math.max(0, ...rows.map(r => r.weeks)), regWeeks };
  }

  // ---- Free agents worth picking up ----
  function freeAgents(model, prefs, opts = {}) {
    const sp = model.sleeperPlayers;
    if (!sp) return { list: [], reason: 'Player details from Sleeper are needed for free agents.' };
    const OUTR = /^(IR|PUP|OUT|SUS|NFI|DOUBTFUL)/i;
    // Depth charts: team|pos -> players in order
    const depth = {};
    for (const [id, p] of Object.entries(sp)) {
      if (!p.team || p.depth_chart_order == null || !SKILL.includes(p.position)) continue;
      const dp = p.depth_chart_position && SKILL.includes(p.depth_chart_position) ? p.depth_chart_position : p.position;
      (depth[`${p.team}|${dp}`] ??= []).push({ id: String(id), order: p.depth_chart_order, p });
    }
    for (const k in depth) depth[k].sort((a, b) => a.order - b.order);
    const nameOf = p => p.full_name || `${p.first_name || ''} ${p.last_name || ''}`.trim();
    const me = model.me;
    const rebuild = me.strategy === 'rebuild';
    const W = rebuild ? { opp: 0.25, buzz: 0.15, value: 0.25, youth: 0.25, prod: 0.1 } : { opp: 0.35, buzz: 0.2, value: 0.15, youth: 0.05, prod: 0.25 };
    const out = [];
    for (const [id0, p] of Object.entries(sp)) {
      const id = String(id0);
      if (model.rostered.has(id) || !p.active || !p.team || !SKILL.includes(p.position)) continue;
      const f = model.fcById.get(id);
      const value = f?.value ?? 0;
      const adds = model.trendMap.get(id) || 0;
      const st = model.statMap.get(id);
      const ppg = st && (st.gp || 0) >= 2 ? (st.pts_half_ppr ?? st.pts_ppr ?? 0) / st.gp : null;
      const age = f?.player.maybeAge ?? p.age ?? null;
      const yoe = p.years_exp ?? f?.player.maybeYoe ?? null;
      // Opportunity from the depth chart
      const dp = p.depth_chart_position && SKILL.includes(p.depth_chart_position) ? p.depth_chart_position : p.position;
      const grp = depth[`${p.team}|${dp}`] || [];
      const idx = grp.findIndex(x => x.id === id);
      let opp = 0, oppNote = null;
      const starters = { QB: 1, RB: 1, WR: 3, TE: 1 }[p.position] || 1;
      const selfOut = OUTR.test(p.injury_status || '') || p.status === 'Injured Reserve';
      if (idx >= 0 && !selfOut) {
        const ahead = grp.slice(0, idx);
        const healthyAhead = ahead.filter(x => !OUTR.test(x.p.injury_status || '') && x.p.status !== 'Injured Reserve');
        if (idx < starters) { opp = 0.8; oppNote = `listed as a starter (${p.position}${idx + 1}) on the ${p.team} depth chart`; }
        if (healthyAhead.length < starters && ahead.length >= healthyAhead.length + 1 && idx < starters + 2) {
          const hurt = ahead.filter(x => !healthyAhead.includes(x)).map(x => `${nameOf(x.p)} (${x.p.injury_status || 'IR'})`);
          opp = 1; oppNote = `next man up: ${hurt.join(', ')} ${hurt.length > 1 ? 'are' : 'is'} out ahead of him on ${p.team}`;
        } else if (!oppNote && p.position === 'RB' && idx === 1) { opp = 0.4; oppNote = `${p.team}'s RB2, one injury from a starting role`; }
      }
      const buzz = adds ? Math.log1p(adds) / Math.log1p(model.maxTrend || 1) : 0;
      const youth = age == null ? 0 : age <= 23 ? 1 : age <= 25 ? 0.6 : age <= 27 ? 0.2 : 0;
      const prod = ppg == null ? 0 : clamp(ppg / 14);
      const vScore = clamp(value / 2500);
      const score = W.opp * opp + W.buzz * buzz + W.value * vScore + W.youth * youth + W.prod * prod;
      if (!opts.byPpg && score < 0.18 && value < 400) continue;
      if (opts.byPpg && (ppg == null || ppg < 5 || OUTR.test(p.injury_status || ''))) continue;
      const est = value + 900 * opp + 500 * buzz + (rebuild ? 400 * youth : 300 * prod);
      const notes = [];
      if (oppNote) notes.push(oppNote);
      if (adds >= 500) notes.push(`${fmt(adds)} adds on Sleeper in the last 72h`);
      if (ppg != null && ppg >= 6) notes.push(`${ppg.toFixed(1)} pts per game`);
      if (age != null) notes.push(`age ${Math.floor(age)}${yoe === 0 ? ', rookie' : ''}`);
      if (value) notes.push(`value ${fmt(value)}`);
      out.push({ id, name: nameOf(p), pos: p.position, team: p.team, age, value, adds, ppg, opp, score, est, notes, injury: p.injury_status || null });
    }
    if (opts.byPpg) return { list: out.sort((a, b) => b.ppg - a.ppg).slice(0, 15) };
    out.sort((a, b) => b.score - a.score);
    const list = out.slice(0, 25);
    // Drop candidates: your least valuable players (not protected, not injury stashes / buy-low holds)
    const mark = prefs.marks || {};
    const drops = me.players.filter(p => mark[p.id] !== 'protect' && !p.injStash && !p.dip && (p.breakout ?? 0) < 0.55)
      .sort((a, b) => (a.value + 0.5 * a.future) - (b.value + 0.5 * b.future));
    let di = 0;
    for (const fa of list) {
      const d = drops[di];
      if (d && fa.est > d.value * 1.25 + 150) { fa.drop = d; di++; }
    }
    return { list };
  }

  // ---- Evaluate an offer someone sent you ----
  // giveIds: your assets they asked for; getIds: their assets they offered
  function evaluateIncoming(model, prefs, rosterId, giveIds, getIds, mode = 'received') {
    const proposing = mode === 'propose';
    const me = model.me, t = model.teamById.get(+rosterId);
    const G = giveIds.map(id => me.assets.find(a => a.id === id)).filter(Boolean);
    const R = getIds.map(id => t.assets.find(a => a.id === id)).filter(Boolean);
    if (!t || !G.length || !R.length) return null;
    const ctx = makeCtx(model, prefs);
    const r = evaluate(model, ctx, t, G, R, { noChecks: true });
    const mark = prefs.marks || {};
    const flags = [];
    for (const a of G) {
      if (mark[a.id] === 'protect') flags.push(`${a.name} is marked Protect.`);
      if (a.dip) flags.push(`${a.name} is in a dip (${Math.round(a.dropPct * 100)}% below his peak). Selling now is selling low.`);
      if (a.injuredOut) flags.push(`${a.name} is ${a.injury}, so his price is at its lowest.`);
      if (a.breakout >= 0.55 && a.kind === 'player') flags.push(`${a.name} has strong breakout signals.`);
      if (a.kind === 'pick') flags.push(`You'd be giving up a pick (${a.name}).`);
    }
    for (const a of R) {
      if (a.kind === 'player' && a.ageMult < 0.9) flags.push(`${a.name} is ${Math.floor(a.age)}. ${a.pos}s usually lose value from here, which is bad for a rebuild.`);
      if (a.injuredOut && !a.injStash) flags.push(`${a.name} is ${a.injury} with a weaker recovery outlook.`);
    }
    const goods = [];
    for (const a of R) {
      if (a.buyLow) goods.push(`${a.name} is a buy-low (${Math.round(a.dropPct * 100)}% below peak, role intact).`);
      if (a.injStash) goods.push(`${a.name} is an injury stash with a good recovery outlook.`);
      if (a.kind === 'pick') goods.push(`You get a pick (${a.name}).`);
      if (a.kind === 'player' && a.ageMult >= 1.05) goods.push(`${a.name} is young (${Math.floor(a.age)}) and should gain value.`);
      if (a.breakout >= 0.55 && a.kind === 'player') goods.push(`${a.name} has strong breakout signals.`);
    }
    for (const a of G) if (a.kind === 'player' && a.sell >= 0.45 && !a.dip) goods.push(`Good time to sell ${a.name}: near his peak value.`);
    // They sent it, so they want your players: you can hold out for a little more than market
    const premium = proposing ? 0 : 0.05;
    const adjDiff = r.diff - premium;
    const protectedHit = G.some(a => mark[a.id] === 'protect');
    let verdict, tone, likely = null;
    if (proposing) {
      likely = r.partnerU >= 0.4 ? 'Likely' : r.partnerU >= 0.1 ? 'Possible' : r.partnerU >= -0.3 ? 'Unlikely' : 'Very unlikely';
      if (r.myU < 0) { verdict = 'Not worth it for you'; tone = 'bad'; }
      else if (r.partnerU < 0.1) { verdict = 'Unlikely to be accepted'; tone = 'warn'; }
      else if (r.myU >= 0.2) { verdict = 'Good offer to send'; tone = 'good'; }
      else { verdict = 'Fair, small gain for you'; tone = 'warn'; }
      if (r.partnerU >= 1.2 && r.myU >= 0) flags.push('They gain a lot from this. You could probably ask for more.');
    } else if (r.myU >= 0.3 && adjDiff >= -0.03 && !protectedHit) { verdict = 'Accept'; tone = 'good'; }
    else if (r.myU >= -0.25 && adjDiff >= -0.15) { verdict = 'Counter'; tone = 'warn'; }
    else { verdict = 'Decline'; tone = 'bad'; }
    // Counter-offers
    const counters = [];
    const want = t.assets.filter(a => !R.includes(a) && a.value >= 150 && (a.kind === 'pick' || a.ageMult >= 1 || a.breakout >= 0.45 || a.buyLow || a.injStash))
      .sort((a, b) => a.value - b.value);
    const target = packageValue(G) * (1 + premium);
    if (proposing && r.partnerU < 0.1) {
      // (d) add the smallest sweetener from your tradeable players/picks that gets them interested
      const pool = myGivePool(model, prefs, { forOffer: true }).filter(a => !G.includes(a)).sort((a, b) => a.value - b.value);
      for (const x of pool) {
        const c = evaluate(model, ctx, t, G.concat([x]), R, { noChecks: true });
        if (c.partnerU >= 0.15 && c.myU >= 0) { counters.push({ kind: 'Sweeten it', note: `Add ${x.name} to your side.`, give: G.concat([x]), get: R, r: c }); break; }
      }
      // (e) ask for less: drop the piece of theirs you value least
      if (R.length > 1) {
        const least = R.slice().sort((a, b) => ctx.myAssetScore(a) - ctx.myAssetScore(b))[0];
        const R2 = R.filter(a => a !== least);
        const c = evaluate(model, ctx, t, G, R2, { noChecks: true });
        if (c.partnerU > r.partnerU && c.myU >= 0) counters.push({ kind: 'Ask for less', note: `Drop ${least.name} from your ask.`, give: G, get: R2, r: c });
      }
      return { r, verdict, tone, likely, flags, goods, counters, premium, team: t, G, R, proposing };
    }
    // (a) ask for one more piece: the smallest that gets you to fair-plus-premium
    for (const x of want) {
      const R2 = R.concat([x]);
      if (packageValue(R2) < target * 0.98) continue;
      const c = evaluate(model, ctx, t, G, R2, { noChecks: true });
      if (c.myU > r.myU && c.partnerU > -0.4) { counters.push({ kind: 'Ask for more', note: `Keep the deal and ask them to add ${x.name}.`, give: G, get: R2, r: c }); break; }
    }
    // (b) swap their weakest piece for a better one
    if (R.length >= 1) {
      const weakest = R.slice().sort((a, b) => ctx.myAssetScore(a) - ctx.myAssetScore(b))[0];
      const rest = R.filter(a => a !== weakest);
      for (const x of want.slice().reverse()) {
        const R2 = rest.concat([x]);
        const pv = packageValue(R2);
        if (pv < target * 0.98 || pv > target * 1.2) continue;
        const c = evaluate(model, ctx, t, G, R2, { noChecks: true });
        if (c.myU > r.myU + 0.2 && c.partnerU > -0.4) { counters.push({ kind: 'Swap a piece', note: `Ask for ${x.name} instead of ${weakest.name}.`, give: G, get: R2, r: c }); break; }
      }
    }
    // (c) take one of your pieces out
    if (G.length > 1) {
      for (const a of G.slice().sort((x, y) => y.value - x.value)) {
        const G2 = G.filter(x => x !== a);
        const c = evaluate(model, ctx, t, G2, R, { noChecks: true });
        if (c.myU > r.myU && c.partnerU > -0.3) { counters.push({ kind: 'Give less', note: `Offer the same deal without ${a.name}.`, give: G2, get: R, r: c }); break; }
      }
    }
    return { r, verdict, tone, likely, flags, goods, counters, premium, team: t, G, R, proposing };
  }

  // ---- This week: who is short because of byes or injuries, and can I sell them a fix? ----
  const OUT_RE = /^(IR|PUP|OUT|DOUBTFUL|SUS|NFI)/i;
  function weeklyNeeds(model, prefs, byeTeams) {
    const bye = new Set(byeTeams || []);
    const why = p => bye.has(p.team) ? 'bye' : OUT_RE.test(p.injury || '') ? (p.injury || 'out') : null;
    const wk = p => p.projPpg ?? p.ppg ?? p.now / 400; // weekly points: projection where we have one
    const ctx = makeCtx(model, prefs);
    const me = model.me;
    const mine = myGivePool(model, prefs, { forOffer: true }).filter(a => a.kind === 'player' && !why(a));
    const out = [];
    for (const t of model.teams) {
      if (t === me || t.strategy === 'rebuild') continue; // rebuilders don't chase weekly points
      const wrap = l => l.map(p => Object.assign(Object.create(p), { wk: wk(p) }));
      const full = lineupValue(wrap(t.players), model.slots, 'wk');
      const week = lineupValue(wrap(t.players.filter(p => !why(p))), model.slots, 'wk');
      const grp = f => f.reduce((g, [, p]) => (g[p.pos] = (g[p.pos] || 0) + p.wk, g), {});
      const gF = grp(full.filled), gW = grp(week.filled);
      const missing = full.filled.map(([, p]) => p).filter(p => why(p));
      const usedGet = new Set();
      for (const pos of ['QB', 'RB', 'WR', 'TE']) {
        const gap = (gF[pos] || 0) - (gW[pos] || 0);
        if (gap < 4) continue;
        const reasons = missing.filter(p => p.pos === pos).map(p => `${p.name} (${why(p)})`);
        // My available players at that position who would actually start for them
        const cands = mine.filter(a => a.pos === pos && wk(a) >= 6).sort((x, y) => wk(y) - wk(x)).slice(0, 4);
        const want = t.assets.filter(a => a.value >= 300 && (a.kind === 'pick' || a.ageMult >= 1 || a.breakout >= 0.45 || a.buyLow || a.injStash))
          .sort((x, y) => ctx.myAssetScore(y) - ctx.myAssetScore(x)).slice(0, 12);
        let best = null;
        for (const c of cands) {
          const urgency = Math.min(gap, wk(c)) * (t.strategy === 'winnow' ? 0.05 : 0.03);
          for (const R of combos(want, 2)) {
            if (R.length > 1 && prefs.evenDeals === 'strict') continue;
            if (R.some(a => usedGet.has(a.id))) continue;
            const r = evaluate(model, ctx, t, [c], R, { partnerBonus: urgency, minMine: 0.1 });
            if (r.ok && (!best || r.score > best.score)) { best = r; best.urgency = urgency; }
          }
        }
        if (best) best.get.forEach(a => usedGet.add(a.id));
        out.push({ team: t, pos, gap, reasons, weekLineup: week.total, fullLineup: full.total, cands, trade: best });
      }
    }
    out.sort((a, b) => (b.team.strategy === 'winnow') - (a.team.strategy === 'winnow') || b.gap - a.gap);
    return out;
  }

  // Someone asked about one of my players: what should I ask for back from that team?
  function asksFor(model, prefs, myAssetId, rosterId) {
    const me = model.me;
    const a = me.assets.find(x => x.id === myAssetId);
    const t = model.teamById.get(+rosterId);
    if (!a || !t) return null;
    const ctx = makeCtx(model, prefs);
    const mark = (prefs.marks || {})[a.id];
    // Price basis: today's value, or his likely recovery value if he's in a dip or injured
    let basis = a.value; const notes = [];
    if (a.dip && a.peakValue > a.value) { basis = Math.max(basis, a.value + (a.peakValue - a.value) * 0.8); notes.push(`he's in a dip, so you're pricing him near his ${fmt(a.peakValue)} peak, not today's ${fmt(a.value)}`); }
    if (a.injuredOut && a.injRebound) { basis = Math.max(basis, a.injRebound / Math.max(0.5, a.ageMult)); notes.push(`he's ${a.injury}, so you're pricing him on his healthy value`); }
    let mult = 1.05; notes.unshift('they came to you, so start above market (+5%)');
    if (mark === 'protect') { mult += 0.25; notes.push("you've marked him Protect, so it should take a clear overpay (+25%)"); }
    if (a.dip) { mult += 0.1; notes.push('selling in a dip needs compensating (+10%)'); }
    if (a.breakout >= 0.55 && a.kind === 'player') { mult += 0.1; notes.push('he has strong breakout signals (+10%)'); }
    if (a.kind === 'player' && a.ageMult >= 1.05) { mult += 0.05; notes.push('he is young enough to keep gaining value (+5%)'); }
    const floor = basis * mult;
    // What I'd want back from them (young / breakout / picks / buy-lows), within a sensible range
    // Rebuild-friendly assets first; only widen to near-peak players if they have too few
    const fits = x => x.kind === 'pick' || x.ageMult >= 1 || x.breakout >= 0.45 || x.buyLow || x.injStash;
    let pool = t.assets.filter(x => x.value >= 200 && x.value <= floor * 1.4 && (me.strategy !== 'rebuild' || fits(x)));
    if (pool.length < 3) pool = t.assets.filter(x => x.value >= 200 && x.value <= floor * 1.4 && x.ageMult >= 0.9);
    pool = pool.sort((x, y) => ctx.myAssetScore(y) - ctx.myAssetScore(x)).slice(0, 14);
    const theirBefore = ctx.theirBefore.get(t.rosterId).total;
    const cands = [];
    for (const R of combos(pool, 2)) {
      // KTC-adjusted value of their package, on the same scale as your player's price
      const kc = ktcCompare([a], R);
      const rv = a.value > 0 ? kc.b * (basis / Math.max(1, kc.a)) : packageValue(R);
      if (rv < floor * 0.97 || rv > floor * 1.45) continue;
      const rIds = new Set(R.map(x => x.id));
      const theirAfter = lineupValue(t.players.filter(p => !rIds.has(p.id)).concat(a.kind === 'player' ? [a] : []), model.slots).total;
      const myGain = pm(R.map(ctx.myAssetScore)) - stratFuture(a, me.strategy);
      const evenPen = R.length > 1 ? 0.15 : 0;
      cands.push({ get: R, rv, myGain, theirNow: theirAfter - theirBefore, score: myGain / 1000 - evenPen - Math.max(0, (rv - floor * 1.1) / floor) });
    }
    cands.sort((x, y) => y.score - x.score);
    const pick = (lo, hi, exclude) => cands.find(c => c.rv >= floor * lo && c.rv <= floor * hi && !exclude.some(e => e.get.some(g => c.get.includes(g))));
    const chosen = [];
    const open = pick(1.1, 1.45, chosen); if (open) chosen.push(Object.assign(open, { label: 'Opening ask', hint: 'Start here, since they came to you.' }));
    const settle = pick(0.97, 1.12, chosen); if (settle) chosen.push(Object.assign(settle, { label: 'Where to settle', hint: "A fair landing spot if they counter." }));
    const pk = cands.find(c => c.get.some(g => g.kind === 'pick') && !chosen.includes(c)); if (pk) chosen.push(Object.assign(pk, { label: 'Picks option', hint: 'Mostly future value, which suits a rebuild.' }));
    return { asset: a, team: t, basis, floor, notes, asks: chosen };
  }

  // Offers built around one specific target: what could I send his manager that they'd like?
  function offersFor(model, prefs, assetId, n = 3) {
    const target = model.players.get(assetId) || model.picks.get(assetId);
    if (!target) return { target: null, offers: [] };
    const t = model.teamById.get(target.owner);
    const ctx = makeCtx(model, prefs);
    const tv = target.value;
    // What this manager would like from me, among pieces in a sensible value range
    const appeal = a => STRAT_W[t.strategy].now * a.now + STRAT_W[t.strategy].fut * stratFuture(a, t.strategy);
    const pool = myGivePool(model, prefs, { forOffer: true })
      .filter(a => a.value <= tv * 1.35 && a.value >= Math.min(250, tv * 0.2))
      .sort((a, b) => appeal(b) - appeal(a)).slice(0, 12);
    const sets = combos(pool, 3);
    // To keep piece counts even, also try asking for a small extra piece back: one they'd miss least
    const fillers = t.assets.filter(a => a.id !== target.id && a.value >= 150 && a.value <= tv * 0.5)
      .sort((a, b) => appeal(a) - appeal(b)).slice(0, 8);
    const getSets = [[target], ...fillers.map(f => [target, f])];
    const good = [], near = [];
    for (const G of sets) for (const R of getSets) {
      if (R.length > G.length) continue;
      const r = evaluate(model, ctx, t, G, R, { minPartner: 0.1, minMine: 0 });
      if (r.ok) { r.offerScore = 0.65 * Math.min(r.partnerU, 4) + 0.35 * r.myU - 3 * Math.abs(r.diff) - (ctx.even === 'prefer' ? 0.8 * r.imbalance : 0); good.push(r); }
      else if (r.partnerU != null) near.push(r);
    }
    good.sort((a, b) => b.offerScore - a.offerScore);
    const out = [], used = {};
    for (const r of good) {
      const lead = r.give.slice().sort((a, b) => b.value - a.value)[0].id;
      if (used[lead]) continue; used[lead] = 1; out.push(r);
      if (out.length >= n) break;
    }
    let nearest = null;
    if (!out.length) {
      // Show the closest miss so the user knows what's lacking
      const cands = near.filter(r => r.myU > 0).sort((a, b) => b.partnerU - a.partnerU);
      nearest = cands[0] || null;
    }
    return { target, team: t, offers: out, nearest };
  }

  function combos(arr, k) {
    const out = arr.map(a => [a]);
    if (k >= 2) for (let i = 0; i < arr.length; i++) for (let j = i + 1; j < arr.length; j++) out.push([arr[i], arr[j]]);

    return `<tr class="${r.t && r.t !== MODEL.me ? 'xtap' : ''}" data-id="${esc(e.id)}"><td><b>${esc(e.name)}</b>${flat && e.up > e.down ? '<span class="tag hot">value hasn\'t moved</span>' : ''}<div class="small">${esc(e.pos)} · ${esc(sp[e.id]?.team || '')} · ${e.up} positive / ${e.down} negative mention${e.up + e.down === 1 ? '' : 's'} · ${e.sources.length} site${e.sources.length === 1 ? '' : 's'}</div>
