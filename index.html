      <td class="small">${own}</td><td class="n">${p ? fmt(p.value) : '–'}${p && p.trend ? `<div class="small" style="color:${p.trend > 0 ? 'var(--good)' : 'var(--bad)'}">${p.trend > 0 ? '+' : ''}${fmt(p.trend)}</div>` : ''}</td></tr>`;
  };
  return `<h3 style="margin:18px 0 4px;font-size:16px">Expert tips</h3>
  <p class="small">Players that recent articles (last ${X.days} days) tip to rise: mentioned alongside words like buy, stash, breakout or sleeper, minus mentions alongside sell, fade or bust. Read from ${ok.length ? esc(ok.join(', ')) : 'fantasy sites'}, updated ${new Date(X.generatedAt).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })}. "Value hasn't moved" means the market hasn't caught up yet. Tap a player on another team for offers.</p>
  ${risers.length ? `<div class="card scroll"><table><tbody>${risers.map(line).join('')}</tbody></table></div>` : '<div class="card small">No clear risers in recent articles.</div>'}
  ${cooling.length ? `<h3 style="margin:14px 0 4px;font-size:15px">Experts cooling on your players</h3><p class="small">More negative than positive mentions recently. Consider selling before the market follows.</p><div class="card scroll"><table><tbody>${cooling.map(line).join('')}</tbody></table></div>` : ''}`;
}

// ---------- Week review: season, last week, performers, verdict ----------
function weekReview() {
  const MU = RAW.matchups; if (!MU) return '';
  const weeks = Object.keys(MU).filter(w => MU[w]?.length && MU[w].some(m => m.points)).map(Number).sort((a, b) => a - b);
  if (!weeks.length) return '';
  const W = weeks[weeks.length - 1];
  const me = MODEL.me, rid = me.rosterId;
  const mine = MU[W].find(m => m.roster_id === rid); if (!mine) return '';
  const opp = MU[W].find(m => m.matchup_id === mine.matchup_id && m.roster_id !== rid);
  const oppT = opp ? MODEL.teamById.get(opp.roster_id) : null;
  const reg = (RAW.league.settings?.playoff_week_start || 15) - 1;
  const D = ENGINE.draftOrder(MODEL, MU, reg);
  const dme = D.rows.find(r => r.team === me);
  const wkMax = dme?.byWeek?.[weeks.indexOf(W)] ?? null;
  // Season context
  const pfRank = MODEL.teams.slice().sort((a, b) => b.pf - a.pf).indexOf(me) + 1;
  const avgAll = MODEL.teams.reduce((s, t) => s + t.pf, 0) / MODEL.teams.length / Math.max(1, me.games);
  const myAvg = me.pf / Math.max(1, me.games);
  const recent = weeks.slice(-3).map(w => MU[w].find(m => m.roster_id === rid)?.points || 0);
  const early = weeks.slice(0, Math.max(1, weeks.length - 3)).map(w => MU[w].find(m => m.roster_id === rid)?.points || 0);
  const rAvg = recent.reduce((a, b) => a + b, 0) / recent.length, eAvg = early.reduce((a, b) => a + b, 0) / early.length;
  const formTxt = rAvg > eAvg + 8 ? `scoring is up lately (${rAvg.toFixed(1)} a week over the last 3, against ${eAvg.toFixed(1)} before)` : rAvg < eAvg - 8 ? `scoring has dipped lately (${rAvg.toFixed(1)} a week over the last 3, against ${eAvg.toFixed(1)} before)` : `scoring is steady at about ${rAvg.toFixed(1)} a week`;
  // Last week's players: against their projection
  const pts = mine.players_points || {};
  const starters = new Set(mine.starters || []);
  const perf = me.players.filter(p => pts[p.id] != null && (p.projPpg ?? p.seasonPpg) != null).map(p => ({ p, pts: pts[p.id], exp: p.projPpg ?? p.seasonPpg, started: starters.has(p.id) }))
    .map(x => Object.assign(x, { diff: x.pts - x.exp }));
  const stars = perf.filter(x => x.pts >= 12 && x.diff >= 5).sort((a, b) => b.diff - a.diff).slice(0, 3);
  const flops = perf.filter(x => x.exp >= 8 && x.diff <= -5).sort((a, b) => a.diff - b.diff).slice(0, 3);
  const movers = me.players.filter(p => p.value >= 800 && Math.abs(p.trend) >= Math.max(100, 0.04 * p.value)).sort((a, b) => Math.abs(b.trend) - Math.abs(a.trend)).slice(0, 4);
  // Verdict
  const goal = Object.assign({ mode: 'above' }, prefs.draftGoal || {});
  const others = D.rows.filter(r => r !== dme);
  const tgt = goal.mode === 'above' ? (others.find(r => String(r.team.rosterId) === String(goal.rid)) || others[0]) : others[0];
  const left = Math.max(0, reg - D.played);
  const projMargin = dme && tgt ? dme.maxPF - tgt.maxPF + (dme.recentAvg - tgt.recentAvg) * left : 0;
  const needPoints = goal.mode === 'above' && left > 0 && projMargin < 8 * left;
  const canSell = goal.mode !== 'above' || left === 0 || projMargin >= 8 * left;
  const sellHigh = me.players.filter(p => (p.ageMult < 0.95 || p.overvalued) && !p.undervalued && !p.dip && pts[p.id] != null && pts[p.id] >= Math.max(15, 1.5 * (p.projPpg ?? p.seasonPpg ?? 99)));
  const others2 = [...MODEL.players.values()].filter(p => p.owner !== rid);
  const longDips = others2.filter(p => p.buyLow && (p.dipFatigue ?? 0) >= 0.4).length;
  const freshTips = (RAW.experts?.players || []).filter(e => { const p = MODEL.players.get(String(e.id)); return p && p.owner !== rid && e.up > e.down && Math.abs(p.trend / Math.max(1, p.value)) < 0.03 && (p.ageMult >= 1 || p.taxiNext); }).length;
  const taxiShort = me.players.filter(p => p.taxiNext && p.value >= 800).length < (prefs.taxiGoal ?? 4);
  let verdict, vcol; const vwhy = [];
  if (canSell && sellHigh.length) {
    verdict = 'Sell'; vcol = 'var(--warn)';
    vwhy.push(`${sellHigh.map(p => `${esc(p.name)} (${pts[p.id].toFixed(1)} pts${p.overvalued ? `, valued ${Math.round(p.valueGap * 100)}% above his peers` : ', past his age peak'})`).join(', ')} just had a big week. Value rarely gets higher than straight after a week like that.`);
  } else if (needPoints) {
    verdict = 'Add points'; vcol = 'var(--bad)';
    vwhy.push(`You need more max PF to stay above ${esc(tgt.team.name)}. Hold your scorers and add cheap points (waivers, or producers whose value lags their points). Don't sell yet.`);
    if (sellHigh.length) vwhy.push(`${sellHigh.map(p => esc(p.name)).join(', ')} had a big week, but selling now would cost you max PF. Sell after week ${reg}.`);
  } else if (longDips || freshTips || taxiShort) {
    verdict = 'Buy'; vcol = 'var(--good)';
    if (longDips) vwhy.push(`${longDips} buy-low player${longDips === 1 ? ' has' : 's have'} been in a long dip, so their managers may be ready to sell.`);
    if (freshTips) vwhy.push(`${freshTips} young player${freshTips === 1 ? ' is' : 's are'} being tipped by experts but ${freshTips === 1 ? "hasn't" : "haven't"} risen in value yet.`);
    if (taxiShort) vwhy.push('You still want another rookie you can stash on next year\'s taxi squad.');
  } else {
    verdict = 'Hold'; vcol = 'var(--accent)';
    vwhy.push('No clear edges this week: no big sell-high moments, and nothing on sale that fits the rebuild. Keep monitoring rather than forcing a deal.');
  }
  if (needPoints && canSell === false && verdict !== 'Add points') vwhy.push(`Keep an eye on your max PF gap to ${esc(tgt.team.name)}.`);
  const res = opp ? (mine.points > opp.points ? 'Won' : mine.points < opp.points ? 'Lost' : 'Tied') : null;
  const benchLeft = wkMax != null ? wkMax - (mine.points || 0) : null;
  const pl = x => `<b>${esc(x.p.name)}</b> ${x.pts.toFixed(1)} <span class="small">(expected ${x.exp.toFixed(1)}${x.started ? '' : ', on your bench'})</span>`;
  return `<div class="card"><b style="font-size:16px">Week ${W} review</b>
    <p style="margin:8px 0 4px"><b>Season so far:</b> ${me.wins}–${me.losses}${me.ties ? '–' + me.ties : ''}, ${pfRank}${['th', 'st', 'nd', 'rd'][pfRank % 10 > 3 || [11, 12, 13].includes(pfRank % 100) ? 0 : pfRank % 10]} in points scored (${myAvg.toFixed(1)} a week against a league average of ${avgAll.toFixed(1)}). Your ${formTxt}.${dme ? ` On max PF you're at pick ${dme.slot}${tgt && goal.mode === 'above' ? `, ${(dme.maxPF - tgt.maxPF) >= 0 ? (dme.maxPF - tgt.maxPF).toFixed(1) + ' above' : (tgt.maxPF - dme.maxPF).toFixed(1) + ' behind'} ${esc(tgt.team.name)}` : ''}.` : ''}</p>
    ${res ? `<p style="margin:4px 0"><b>Last week:</b> ${res} ${(mine.points || 0).toFixed(1)}–${(opp.points || 0).toFixed(1)} against ${esc(oppT?.name || 'your opponent')}.${benchLeft != null && benchLeft > 0.5 ? ` Your best possible lineup would have scored ${wkMax.toFixed(1)}. That's ${benchLeft.toFixed(1)} left on the bench, which still counts towards max PF.` : ''}</p>` : ''}
    ${stars.length ? `<p style="margin:4px 0"><b>Stood out:</b> ${stars.map(pl).join('; ')}.</p>` : ''}
    ${flops.length ? `<p style="margin:4px 0"><b>Disappointed:</b> ${flops.map(pl).join('; ')}.</p>` : ''}
    ${movers.length && MODEL.trendLabel !== null ? `<p style="margin:4px 0"><b>Value movers (${esc((MODEL.trendLabel || 'in 30 days').replace(/^in /, ''))}):</b> ${movers.map(p => `${esc(p.name)} <span style="color:${p.trend > 0 ? 'var(--good)' : 'var(--bad)'}">${p.trend > 0 ? '+' : ''}${fmt(p.trend)}</span>`).join(', ')}.</p>` : ''}
    <div style="margin-top:10px;padding:10px;border-radius:10px;background:var(--panel2);border-left:4px solid ${vcol}"><div><span class="small">THIS WEEK</span> <b style="font-size:18px;color:${vcol}">${verdict}</b></div>
      <ul class="why" style="margin-top:4px">${vwhy.map(w => `<li>${w}</li>`).join('')}</ul>
      <div class="small">The specific moves are in the strategy brief below.</div></div></div>`;
}

// ---------- Weekly strategy brief ----------
function weeklyPpg(players) {
  return ENGINE.lineupValue(players.filter(p => !p.onTaxi && p.pos).map(p => Object.assign(Object.create(p), { wk: p.projPpg ?? p.ppg ?? 0 })), MODEL.slots, 'wk').total;
}
function strategyBrief(needs) {
  const reg = (RAW.league.settings?.playoff_week_start || 15) - 1;
  if (!RAW.matchups) return '';
  const D = ENGINE.draftOrder(MODEL, RAW.matchups, reg);
  if (!D.played) return '';
  const me = D.rows.find(r => r.team === MODEL.me);
  const others = D.rows.filter(r => r !== me);
  const goal = Object.assign({ mode: 'above' }, prefs.draftGoal || {});
  const tgt = goal.mode === 'above' ? (others.find(r => String(r.team.rosterId) === String(goal.rid)) || others[0]) : others[0];
  const left = Math.max(0, reg - D.played);
  const margin = me.maxPF - tgt.maxPF;
  const projMargin = margin + (me.recentAvg - tgt.recentAvg) * left;
  const myBase = weeklyPpg(MODEL.me.players);
  const items = [];
  let head, tone;
  // --- where you stand ---
  if (goal.mode === 'off') { head = `You're at pick ${me.slot} on max PF.`; tone = 'accent'; }
  else if (goal.mode === 'tank') {
    const gap = me.maxPF - tgt.maxPF; // tgt = lowest other team
    if (left === 0) { head = gap < 0 ? 'Regular season over: you finished with the lowest max PF. Pick 1 is yours.' : `Regular season over: you finished pick ${me.slot}.`; tone = gap < 0 ? 'good' : 'warn'; }
    else if (projMargin < 0) { head = `On course for the lowest max PF: ${Math.abs(gap).toFixed(1)} below ${tgt.team.name}, with ${left} week${left === 1 ? '' : 's'} left.`; tone = 'good'; }
    else { head = `You're ${gap.toFixed(1)} above ${tgt.team.name}, the lowest max PF. Sell or bench-proof your scorers to get below them.`; tone = 'warn'; }
  } else {
    if (left === 0) { head = margin > 0 ? `Regular season over: you finished ${margin.toFixed(1)} above ${tgt.team.name} on max PF. Job done, so sell your veterans to playoff teams now.` : `Regular season over: you finished ${(-margin).toFixed(1)} below ${tgt.team.name}.`; tone = margin > 0 ? 'good' : 'bad'; }
    else if (projMargin < 0) {
      const need = -projMargin / left + 3;
      head = `${margin < 0 ? `You're ${(-margin).toFixed(1)} behind` : `You're only ${margin.toFixed(1)} ahead of`} ${tgt.team.name} on max PF, and at recent rates you'd finish ${(-projMargin).toFixed(1)} behind. With ${left} week${left === 1 ? '' : 's'} left, you need about <b>${need.toFixed(1)} more points a week</b>.`;
      tone = 'bad';
    } else if (projMargin < 8 * left) { head = `You're on track to finish ${projMargin.toFixed(1)} above ${tgt.team.name} on max PF, which is still tight with ${left} week${left === 1 ? '' : 's'} left. Add points where it's cheap and hold your scorers.`; tone = 'warn'; }
    else { head = `You're comfortably on track to finish ${projMargin.toFixed(1)} above ${tgt.team.name} on max PF. You can afford to start selling.`; tone = 'good'; }
  }
  const needPoints = goal.mode === 'above' && left > 0 && projMargin < 8 * left;
  const canSell = goal.mode !== 'above' || left === 0 || projMargin >= 8 * left;
  const trCard = (tr, extra) => `<div class="card" style="margin:8px 0"><div class="small" style="margin-bottom:6px"><b>${esc(tr.partner.name)}</b> ${stratPill(tr.partner)}${extra ? ' · ' + extra : ''}</div>
    <div class="sides"><div class="side"><h4>You give</h4>${assetRows(tr.give)}</div><div class="side"><h4>You get</h4>${assetRows(tr.get)}</div></div>${offerButton(tr)}</div>`;
  const gainOf = tr => weeklyPpg(MODEL.me.players.filter(p => !tr.give.includes(p)).concat(tr.get.filter(a => a.kind === 'player'))) - myBase;

  if (needPoints) {
    // 1) Hold scorers until the regular season ends
    const scorers = MODEL.me.players.filter(p => (p.ppg || 0) >= 8 && p.ageMult < 0.95).sort((a, b) => b.ppg - a.ppg).slice(0, 4);
    if (scorers.length) items.push(`<b>Hold your scoring veterans until week ${reg}:</b> ${scorers.map(p => `${esc(p.name)} (${p.ppg.toFixed(1)} ppg)`).join(', ')}. Every point they score on your bench counts. There's no trade deadline, so sell them to playoff teams after the regular season.`);
    // 2) Free-agent points
    const fas = ENGINE.freeAgents(MODEL, P(), { byPpg: true }).list
      .map(f => ({ f, gain: weeklyPpg(MODEL.me.players.concat([{ id: f.id, pos: f.pos, ppg: f.ppg }])) - myBase })).filter(x => x.gain >= 0.5).slice(0, 3);
    if (fas.length) items.push(`<b>Free points on waivers:</b> ${fas.map(x => `${esc(x.f.name)} (${x.f.pos}, ${esc(x.f.team)}, ${x.f.ppg.toFixed(1)} ppg, about +${x.gain.toFixed(1)} a week to your max PF)`).join('; ')}. A cheap bid now, and drop them after week ${reg}.`);
    // 3) Trades that add points now AND suit the rebuild
    const cands = [...MODEL.players.values()].filter(p => p.owner !== MODEL.me.rosterId && (p.ppg || 0) >= 8 && !p.injuredOut && (p.ageMult >= 1 || p.taxiNext || p.breakout >= 0.45))
      .sort((a, b) => (b.ppg * (1 + b.breakout)) - (a.ppg * (1 + a.breakout))).slice(0, 10);
    const offers = [];
    for (const c of cands) {
      const o = ENGINE.offersFor(MODEL, P(), c.id, 3).offers.map(tr => ({ tr, gain: gainOf(tr) })).filter(x => x.gain > 0.5).sort((a, b) => b.gain - a.gain)[0];
      if (o) offers.push(o);
      if (offers.length >= 2) break;
    }
    if (offers.length) items.push(`<b>Trades that add points now and suit your rebuild:</b>` + offers.map(o => trCard(o.tr, `about +${o.gain.toFixed(1)} a week to your max PF`)).join(''));
  }
  if (canSell) {
    // Sell-high: big week last week, or a contender short at his position
    const lastW = Math.max(...Object.keys(RAW.matchups).filter(w => RAW.matchups[w]).map(Number));
    const lastPts = Object.assign({}, ...(RAW.matchups[lastW] || []).map(m => m.players_points || {}));
    const hot = MODEL.me.players.filter(p => (p.ageMult < 0.95 || p.overvalued) && !p.undervalued && (lastPts[p.id] || 0) >= Math.max(15, 1.5 * (p.ppg || 0))).sort((a, b) => (lastPts[b.id] || 0) - (lastPts[a.id] || 0));
    const sells = [];
    for (const p of hot.slice(0, 3)) {
      const n = needs.find(n => n.trade && n.trade.give.includes(p)) || needs.find(n => n.pos === p.pos && n.trade);
      const tr = n?.trade?.give.includes(p) ? n.trade : ENGINE.generateTrades(MODEL, Object.assign(P(), { marks: Object.assign({}, prefs.marks, { [p.id]: 'shop' }) })).find(t => t.give.includes(p));
      const loss = tr ? -gainOf(tr) : 0;
      if (goal.mode === 'above' && left > 0 && loss * left > projMargin - 4 * left) continue; // would put the max PF goal at risk
      sells.push(`<b>Sell high on ${esc(p.name)}:</b> ${(lastPts[p.id] || 0).toFixed(1)} points last week against his ${(p.ppg || 0).toFixed(1)} average${n ? `, and ${esc(n.team.name)} are short at ${n.pos} this week` : ''}.` + (tr ? trCard(tr, loss > 0.5 && left > 0 ? `costs you about ${loss.toFixed(1)} a week of max PF` : '') : ''));
    }
    if (sells.length) items.push(...sells);
    else if (left === 0 || goal.mode !== 'above') {
      const top = ENGINE.generateTrades(MODEL, P())[0];
      if (top) items.push(`<b>Best sell this week:</b>` + trCard(top, ''));
    }
  }
  // Always: one market-inefficiency tip and the taxi count
  const tip = (RAW.experts?.players || []).map(e => ({ e, p: MODEL.players.get(String(e.id)) })).find(x => x.p && x.p.owner !== MODEL.me.rosterId && x.e.up > x.e.down && Math.abs(x.p.trend / Math.max(1, x.p.value)) < 0.03 && (x.p.ageMult >= 1 || x.p.taxiNext));
  if (tip) items.push(`<b>Before the market moves:</b> experts are tipping ${esc(tip.p.name)} (${esc(MODEL.teamById.get(tip.p.owner)?.name || '')}) but his value hasn't moved yet. See Expert tips below.`);
  const taxiN = MODEL.me.players.filter(p => p.taxiNext && p.value >= 800).length;
  if (taxiN < (prefs.taxiGoal ?? 4)) items.push(`<b>Taxi squad for next season:</b> you have ${taxiN} rookie${taxiN === 1 ? '' : 's'} worth 800 or more; you're aiming for ${prefs.taxiGoal ?? 4}. Targets are listed in the Targets tab.`);
  const col = { good: 'var(--good)', warn: 'var(--warn)', bad: 'var(--bad)', accent: 'var(--accent)' }[tone];
  const others2 = MODEL.teams.filter(t => t !== MODEL.me);
  return `<div class="card" style="border-color:${col}"><div class="trade-top"><b style="font-size:16px">Strategy brief · week ${RAW.week || ''}</b>
      <select id="goal-mode" style="font-size:12px;padding:3px 6px"><option value="above" ${goal.mode === 'above' ? 'selected' : ''}>Stay above…</option><option value="tank" ${goal.mode === 'tank' ? 'selected' : ''}>Lowest max PF</option><option value="off" ${goal.mode === 'off' ? 'selected' : ''}>No draft goal</option></select></div>
    ${goal.mode === 'above' ? `<div class="row" style="margin-bottom:6px"><span class="small">Target:</span><select id="goal-team" style="font-size:12px;padding:3px 6px">${others2.map(t => `<option value="${t.rosterId}" ${t === tgt.team ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select></div>` : ''}
    <div style="color:${col}">${head}</div>
    <ul class="why" style="margin-top:8px">${items.map(i => `<li style="margin:6px 0">${i}</li>`).join('')}</ul></div>`;
}

function renderWeek() {
  const el = $('#tab-week');
  const wi = RAW.weekInfo;
  const byes = wi && String(wi.week) === String(RAW.week) ? wi.byes || [] : null;
  const needs = ENGINE.weeklyNeeds(MODEL, P(), byes || []);
  const others = [...MODEL.players.values()].filter(p => p.owner !== MODEL.me.rosterId);
  const prevBL = new Set(wi?.prevBuyLows || []), prevST = new Set(wi?.prevStashes || []);
  const newBL = wi ? others.filter(p => p.buyLow && !prevBL.has(p.id)) : [];
  const newST = wi ? others.filter(p => p.injStash && !prevST.has(p.id)) : [];
  const owner = id => MODEL.teamById.get(id)?.name || '';
  const mini = list => list.map(p => `<tr class="tap" data-id="${esc(p.id)}"><td><b>${esc(p.name)}</b><div class="small">${esc(assetMeta(p))}</div></td><td class="small">${esc(owner(p.owner))}</td><td class="n">${fmt(p.value)}${p.buyLow ? `<div class="small" style="color:var(--bad)">−${Math.round(p.dropPct * 100)}%</div>` : `<div class="small">${esc(p.injury || '')}</div>`}</td></tr>`).join('');
  el.innerHTML = weekReview() + strategyBrief(needs) + `<p class="small">Week ${RAW.week || '?'}. ${byes ? `Teams on bye: ${byes.length ? byes.join(', ') : 'none'}.` : "Bye weeks load from the weekly round-up (every Tuesday), so for now only injuries are counted."} Worked out live from today's injuries and your settings.</p>
  <h3 style="margin:14px 0 4px;font-size:16px">Teams short this week</h3>
  <p class="small">Win-now and middle teams whose starting lineup has a hole this week, measured in points per game. A manager chasing a win may pay more than usual to fill it.</p>
  ${needs.length ? needs.map(n => {
    const tr = n.trade;
    return `<div class="card"><div class="trade-top"><div><span class="partner">${esc(n.team.name)}</span> ${stratPill(n.team)}</div><span class="pill">${n.team.wins}–${n.team.losses}</span></div>
      <div>Short about <b>${n.gap.toFixed(1)} pts</b> at <b>${n.pos}</b>${n.reasons.length ? `: ${esc(n.reasons.join(', '))}` : ''}.</div>
      ${tr ? `<div class="sides" style="margin-top:8px"><div class="side"><h4>You give</h4>${assetRows(tr.give)}</div><div class="side"><h4>You get</h4>${assetRows(tr.get)}</div></div>
        <ul class="why">${ENGINE.explain(tr, MODEL).map(w => `<li>${esc(w)}</li>`).join('')}<li>They need a ${n.pos} this week, so the urgency should get you a little extra.</li></ul>${offerButton(tr)}`
      : n.cands.length ? `<div class="small" style="margin-top:6px">You have ${n.cands.map(c => esc(c.name)).join(', ')} at ${n.pos}, but no fair deal with them works for your rebuild right now.</div>`
      : `<div class="small" style="margin-top:6px">You don't have a tradeable ${n.pos} who would start for them.</div>`}</div>`;
  }).join('') : '<div class="card small">No contending team has a meaningful hole this week.</div>'}
  ${expertSection()}
  <h3 style="margin:18px 0 4px;font-size:16px">New buy-low candidates</h3>
  ${!wi ? '<div class="card small">This fills in after the first weekly round-up runs.</div>' : newBL.length ? `<div class="card scroll"><table><tbody>${mini(newBL)}</tbody></table></div>` : '<div class="card small">No new buy-low candidates since the last round-up.</div>'}
  <h3 style="margin:18px 0 4px;font-size:16px">New injury stashes</h3>
  ${!wi ? '<div class="card small">This fills in after the first weekly round-up runs.</div>' : newST.length ? `<div class="card scroll"><table><tbody>${mini(newST)}</tbody></table></div>` : '<div class="card small">No new injury stashes since the last round-up.</div>'}`;
  bindOfferButtons(el);
  if ($('#goal-mode')) $('#goal-mode').onchange = e => { prefs.draftGoal = Object.assign({}, prefs.draftGoal, { mode: e.target.value }); savePrefs(); renderWeek(); };
  if ($('#goal-team')) $('#goal-team').onchange = e => { prefs.draftGoal = Object.assign({}, prefs.draftGoal, { rid: e.target.value }); savePrefs(); renderWeek(); };
  el.querySelectorAll('tr.xtap').forEach(tr => tr.onclick = e => { if (e.target.closest('a')) return; toggleOffers(tr); });
  el.querySelectorAll('tr.tap').forEach(tr => tr.onclick = () => { document.querySelector('nav button[data-tab="targets"]').click(); const row = document.querySelector(`#tab-targets tr.tap[data-id="${tr.dataset.id}"]`); if (row) { row.scrollIntoView({ block: 'center' }); toggleOffers(row); } });
}

let EVAL = { team: '', give: new Set(), get: new Set(), mode: 'received' };
function renderEvaluate() {
  const el = $('#tab-evaluate');
  const others = MODEL.teams.filter(t => t !== MODEL.me).sort((a, b) => a.name.localeCompare(b.name));
  const t = EVAL.team ? MODEL.teamById.get(+EVAL.team) : null;
  const chips = (assets, set, side) => assets.slice().sort((a, b) => b.value - a.value).filter(a => a.value >= 50 || set.has(a.id)).map(a =>
    `<button class="chip ${set.has(a.id) ? 'on' : ''}" data-side="${side}" data-id="${esc(a.id)}">${esc(a.name)} <span class="small">${a.kind === 'pick' ? '' : esc(a.pos) + ' · '}${fmt(a.value)}</span></button>`).join('');
  const prop = EVAL.mode === 'propose';
  el.innerHTML = `<div class="seg" id="ev-mode" style="margin:4px 0 8px"><button data-mode="received" class="${prop ? '' : 'on'}" style="padding:6px 12px;font-size:13px">They sent me this</button><button data-mode="propose" class="${prop ? 'on' : ''}" style="padding:6px 12px;font-size:13px">I'm proposing this</button></div>
    <p class="small">${prop ? "Build your own offer: pick the team, tick what you'd give and what you'd ask for. You'll see whether it's good for you and how likely they are to accept." : "Got an offer? Pick the team, tick what they want from you and what they're offering, and you'll get a verdict and a counter-offer."}</p>
    <div class="card"><div class="row"><select id="ev-team"><option value="">${prop ? 'Which team?' : 'Who sent it?'}</option>${others.map(x => `<option value="${x.rosterId}" ${String(x.rosterId) === String(EVAL.team) ? 'selected' : ''}>${esc(x.name)} (${label(x.strategy)})</option>`).join('')}</select>
      ${EVAL.give.size || EVAL.get.size ? '<button class="btn ghost" id="ev-clear" style="padding:4px 10px">Clear</button>' : ''}</div>
    ${t ? `<h4 class="small" style="margin:12px 0 6px;text-transform:uppercase;letter-spacing:.06em">${prop ? 'You give' : 'They want from you'}</h4><div class="chips">${chips(MODEL.me.assets, EVAL.give, 'give')}</div>
      <h4 class="small" style="margin:14px 0 6px;text-transform:uppercase;letter-spacing:.06em">${prop ? 'You ask for' : "They're offering"}</h4><div class="chips">${chips(t.assets, EVAL.get, 'get')}</div>` : ''}</div>
    <div id="ev-out"></div>`;
  $('#ev-team').onchange = e => { EVAL = { team: e.target.value, give: new Set(), get: new Set(), mode: EVAL.mode }; renderEvaluate(); };
  el.querySelectorAll('#ev-mode button').forEach(b => b.onclick = () => { EVAL.mode = b.dataset.mode; renderEvaluate(); });
  if ($('#ev-clear')) $('#ev-clear').onclick = () => { EVAL.give.clear(); EVAL.get.clear(); renderEvaluate(); };
  el.querySelectorAll('button.chip').forEach(b => b.onclick = () => {
    const set = b.dataset.side === 'give' ? EVAL.give : EVAL.get;
    set.has(b.dataset.id) ? set.delete(b.dataset.id) : set.add(b.dataset.id);
    const y = window.scrollY; renderEvaluate(); window.scrollTo(0, y);
  });
  if (!t || !EVAL.give.size || !EVAL.get.size) return;
  const res = ENGINE.evaluateIncoming(MODEL, P(), t.rosterId, [...EVAL.give], [...EVAL.get], EVAL.mode);
  if (!res) return;
  const { r } = res;
  const col = { good: 'var(--good)', warn: 'var(--warn)', bad: 'var(--bad)' }[res.tone];
  const pct = Math.round(r.diff * 100);
  const why = [
    `Market: you give ${fmt(r.kc.rawA)}, you get ${fmt(r.kc.rawB)}${r.kc.adjA > 1 || r.kc.adjB > 1 ? `, plus KTC's value adjustment of ${fmt(Math.max(r.kc.adjA, r.kc.adjB))} to ${r.kc.adjA > 1 ? 'your' : 'their'} side` : ''} (${pct === 0 ? 'even' : pct > 0 ? `+${pct}% your way` : `${-pct}% their way`}).${res.proposing ? '' : ` They came to you, so aim for at least +${Math.round(res.premium * 100)}%.`}`,
    ...(res.proposing ? [`Chance they accept: ${res.likely}. ${r.theirNow > 150 ? `Their lineup gets stronger by about ${fmt(r.theirNow)}. ` : r.theirNow < -150 ? `It weakens their lineup by about ${fmt(-r.theirNow)}. ` : ''}${r.theirFut > 0 ? 'They gain long-term value.' : 'They lose long-term value.'}`] : []),
    ...(r.cuffNotes?.length ? [`Handcuff: ${r.cuffNotes.join('; ')}.`] : []),
    ...(r.tendency?.length ? [`Their trade history: ${r.tendency.join('; ')}.`] : []),
    ...(r.learned?.length ? [`From your past offers: ${r.learned.join('; ')}.`] : []),
    r.myFut > 0 ? `Long-term value for your rebuild: up about ${fmt(r.myFut)}.` : `Long-term value for your rebuild: down about ${fmt(-r.myFut)}.`,
  ];
  const counterCard = c => { const pc = Math.round(c.r.diff * 100); return `<div class="card" style="margin:8px 0"><div class="small" style="margin-bottom:6px"><b>${esc(c.kind)}</b> · ${esc(c.note)}</div>
    <div class="sides"><div class="side"><h4>You give</h4>${assetRows(c.give)}</div><div class="side"><h4>You get</h4>${assetRows(c.get)}</div></div>
    <div class="small" style="margin-top:6px">Market ${pc === 0 ? 'even' : pc > 0 ? `+${pc}% your way` : `${-pc}% their way`}.</div>${offerButton(Object.assign(c.r, { partner: res.team }))}</div>`; };
  $('#ev-out').innerHTML = `<div class="card"><div class="trade-top"><span style="font-size:20px;font-weight:700;color:${col}">${res.verdict}</span><span class="pill">${esc(res.team.name)} · ${label(res.team.strategy)}</span></div>
    <ul class="why">${why.map(w => `<li>${esc(w)}</li>`).join('')}${res.goods.map(w => `<li style="color:var(--good)">${esc(w)}</li>`).join('')}${res.flags.map(w => `<li style="color:var(--warn)">${esc(w)}</li>`).join('')}</ul>
    <div class="row" style="margin-top:10px">${res.proposing ? offerButton(Object.assign(r, { partner: res.team })) : '<button class="btn ghost" id="ev-log">Log interest in my players</button>'}</div></div>
    ${res.counters.length ? `<h3 style="margin:14px 0 4px;font-size:16px">${res.proposing ? 'Tweaks that might get it accepted' : res.verdict === 'Accept' ? 'You could still try' : 'Counter-offers'}</h3>${res.counters.map(counterCard).join('')}` : res.proposing ? (res.r.partnerU < 0.1 ? '<div class="card small">No simple addition from your tradeable assets makes this attractive to them. Try a different target or package.</div>' : '') : res.verdict === 'Decline' ? '<div class="card small">No simple counter from their roster closes the gap. Declining is reasonable.</div>' : res.verdict === 'Counter' ? '<div class="card small">Close, but no single change from their roster fixes it. Ask them to improve the offer, or name what you\'d want.</div>' : ''}`;
  bindOfferButtons($('#ev-out'));
  if ($('#ev-log')) $('#ev-log').onclick = () => {
    const day = new Date().toISOString().slice(0, 10);
    for (const a of res.G) if (a.kind === 'player' && !INTEREST.some(i => i.playerId === a.id && i.ownerId === res.team.ownerId && i.day === day))
      INTEREST.unshift({ ts: Date.now(), day, ownerId: res.team.ownerId, teamName: res.team.name, playerId: a.id, playerName: a.name });
    saveInterest(); LEARN = ENGINE.learnFromOffers(OFFERS, INTEREST); renderOffers();
    $('#ev-log').outerHTML = '<span class="pill" style="color:var(--good)">Interest logged</span>';
  };
}

let PTS_POS = 'ALL', PTS_YOUNG = false;
function renderPoints() {
  const el = $('#tab-points');
  const M = MODEL, sp = RAW.sleeperPlayers || {};
  if (!M.proj?.size) { el.innerHTML = '<div class="card small">Season stats from Sleeper are needed for the points model.</div>'; return; }
  const owner = id => { const p = M.players.get(id); return p ? M.teamById.get(p.owner) : null; };
  const rows = [...M.proj.entries()].filter(([id, x]) => x.projPpg != null && (x.gp || 0) >= 3 && x.projRank && x.valRankAll && (sp[id]?.team || M.players.has(id)))
    .map(([id, x]) => {
      const p = M.players.get(id), f = M.fcById.get(id);
      const age = p?.age ?? f?.player.maybeAge ?? sp[id]?.age ?? null;
      return { id, x, p, name: p?.name || f?.player.name || sp[id]?.full_name || id, pos: x.pos, team: p?.team || sp[id]?.team || '', age, value: p?.value ?? f?.value ?? 0, t: owner(id), gap: x.valRankAll - x.projRank };
    })
    .filter(r => (PTS_POS === 'ALL' || r.pos === PTS_POS) && (!PTS_YOUNG || (r.age ?? 99) <= 25) && r.t !== M.me)
    .filter(r => r.gap >= 6 && r.x.projPpg >= 7)
    .sort((a, b) => (b.gap * Math.sqrt(b.x.projPpg)) - (a.gap * Math.sqrt(a.x.projPpg))).slice(0, 30);
  el.innerHTML = `<p class="small"><b>Undervalued producers:</b> players whose projected points rank at their position is well above their trade-value rank. Projections blend <b>expected points from usage</b> (what their targets, carries, pass attempts and snap share are normally worth in your scoring; half-PPR, TE premium), their season average, and their last 4 weeks in your league. A big gap between expected and actual points means luck that may not last. Tap a rostered player for offers.</p>
    <div class="row" style="margin:6px 0 4px">${['ALL', 'QB', 'RB', 'WR', 'TE'].map(p => `<button class="chip ${PTS_POS === p ? 'on' : ''}" data-pos="${p}">${p === 'ALL' ? 'All' : p}</button>`).join('')}<button class="chip ${PTS_YOUNG ? 'on' : ''}" id="pts-young">25 and under</button></div>
    ${rows.length ? `<div class="card scroll"><table><thead><tr><th>Player</th><th class="n">Proj</th><th class="n">Usage</th><th class="n">Season</th><th class="n">Last 4</th><th class="n">'${String(+RAW.league.season - 1).slice(2)}</th><th class="n">Value</th><th class="n">Fair</th></tr></thead><tbody>
    ${rows.map(r => { const x = r.x; const luck = x.xppg != null ? x.seasonPpg - x.xppg : 0;
      return `<tr class="${r.t ? 'tap' : ''}" data-id="${esc(r.id)}"><td><b>${esc(r.name)}</b><div class="small">${esc(r.pos)} · ${esc(r.team)}${r.age ? ' · ' + Math.floor(r.age) : ''} · ${r.t ? esc(r.t.name) : '<span style="color:var(--good)">free agent</span>'}</div>
        <div class="small">Points ${r.pos}${x.projRank}, value ${r.pos}${x.valRankAll}${Math.abs(luck) >= 2 ? ` · ${luck > 0 ? `scoring ${luck.toFixed(1)} above his usage (may cool)` : `scoring ${(-luck).toFixed(1)} below his usage (due a bounce)`}` : ''}</div></td>
        <td class="n"><b>${x.projPpg.toFixed(1)}</b></td><td class="n">${x.xppg != null ? x.xppg.toFixed(1) : '–'}</td><td class="n">${x.seasonPpg.toFixed(1)}</td><td class="n">${x.last4 != null ? x.last4.toFixed(1) : '–'}</td><td class="n">${x.prevPpg != null ? x.prevPpg.toFixed(1) : '–'}</td><td class="n">${fmt(r.value)}</td><td class="n">${r.p?.fairValue ? fmt(r.p.fairValue) : '–'}</td></tr>`; }).join('')}
    </tbody></table><p class="small">Points per game in your league's scoring. "Usage" is what his workload would normally score. "Fair" is what the market typically pays for his projected points at his age (established players only). "'${String(+RAW.league.season - 1).slice(2)}" is last season.</p></div>` : '<div class="card small">No players with a big points-versus-value gap for this filter.</div>'}`;
  el.querySelectorAll('button[data-pos]').forEach(b => b.onclick = () => { PTS_POS = b.dataset.pos; renderPoints(); });
  $('#pts-young').onclick = () => { PTS_YOUNG = !PTS_YOUNG; renderPoints(); };
  el.querySelectorAll('tr.tap').forEach(tr => tr.onclick = () => toggleOffers(tr));
}

function renderFA() {
  const el = $('#tab-fa');
  const { list, reason } = ENGINE.freeAgents(MODEL, P());
  if (reason) { el.innerHTML = `<div class="card small">${esc(reason)}</div>`; return; }
  el.innerHTML = `<p class="small">Unrostered players ranked for ${MODEL.me.strategy === 'rebuild' ? 'a rebuild (youth and long-term value count more)' : 'your team'}. Players moving up the depth chart because someone ahead of them is out are flagged as <b>next man up</b>. Where a pickup beats one of your weakest players, a drop is suggested. Check whether he's on waivers in Sleeper before you claim.</p>
  ${list.length ? list.map(fa => `<div class="card"><div class="trade-top"><div><b>${esc(fa.name)}</b> <span class="small">${esc(fa.pos)} · ${esc(fa.team)}${fa.injury ? ' · ' + esc(fa.injury) : ''}</span>${fa.opp >= 1 ? '<span class="tag hot">next man up</span>' : fa.opp >= 0.8 ? '<span class="tag buy">starter</span>' : ''}${fa.adds >= 2000 ? '<span class="tag hot">trending</span>' : ''}</div><div class="bar" style="width:70px"><span style="width:${Math.round(fa.score * 100)}%"></span></div></div>
    <div class="small">${fa.notes.map(esc).join(' · ')}</div>
    ${fa.drop ? `<div style="margin-top:6px">Add him, drop <b>${esc(fa.drop.name)}</b> <span class="small">(${esc(fa.drop.pos)}, value ${fmt(fa.drop.value)})</span></div>` : ''}</div>`).join('')
  : '<div class="card small">No free agents stand out right now.</div>'}`;

function renderTargets() {
  const list = [...MODEL.players.values()].filter(p => p.owner !== MODEL.me.rosterId && p.value >= 300 && p.breakout > 0)
    .sort((a, b) => b.breakout - a.breakout).slice(0, 40);
  const ownerName = id => MODEL.teamById.get(id)?.name || '';
  const s = MODEL.haveStats;
  const dips = [...MODEL.players.values()].filter(p => p.owner !== MODEL.me.rosterId && p.buyLow)
    .sort((a, b) => (b.dipFatigue - a.dipFatigue) || (b.dropPct - a.dropPct));
  const hs = MODEL.histSpan;
  const lenCell = p => p.dipDays != null
    ? `<span style="color:var(--bad)">−${Math.round(p.dropPct * 100)}%</span><div class="small">${p.dipDays} days${p.dipDays >= 45 ? ' · long' : ' · recent'}</div>`
    : `<span style="color:var(--bad)">−${Math.round(p.dropPct * 100)}%</span><div class="small">${esc((MODEL.trendLabel || 'in 30 days').replace(/^in /, ''))}</div>`;
  const dipHtml = `<h3 style="margin:14px 0 4px;font-size:16px">Buy-low dips</h3>
  <p class="small">Players aged 28 or under whose value has fallen while their snaps and targets are still strong. ${hs >= 21
    ? `Measured against each player's peak over the last ${hs} days. Long dips come first, because managers sell more readily after weeks of decline.`
    : `For now this uses the change ${esc(MODEL.trendLabel || 'in 30 days')}. The site saves values every day, so from about 3 weeks in it will measure dips against each player's peak and how long they've lasted (60–120 days, set in Settings).`}
  Tap a player to see offers.</p>
  ${dips.length ? `<div class="card scroll"><table><thead><tr><th>Player</th><th>Owner</th><th class="n">Value</th><th class="n">Dip</th>${s ? '<th class="n">Snaps</th>' : ''}</tr></thead><tbody>
  ${dips.map(p => `<tr class="tap" data-id="${esc(p.id)}"><td><b>${esc(p.name)}</b><span class="tag buy">buy low</span><div class="small">${esc(assetMeta(p))}${p.ppgRank ? ` · scoring ${p.pos}${p.ppgRank}` : ''}</div></td>
    <td class="small">${esc(ownerName(p.owner))}<br>${stratPill(MODEL.teamById.get(p.owner))}</td>
    <td class="n">${fmt(p.value)}</td><td class="n">${lenCell(p)}</td>
    ${s ? `<td class="n">${p.snapShare ? Math.round(p.snapShare * 100) + '%' : '–'}</td>` : ''}</tr>`).join('')}
  </tbody></table></div>` : `<div class="card small">No role-intact dips right now. Every prime-age player who has lost value has also lost snaps or targets.</div>`}`;
  const inj = [...MODEL.players.values()].filter(p => p.owner !== MODEL.me.rosterId && p.injStash)
    .sort((a, b) => (b.injRebound - b.value) - (a.injRebound - a.value));
  const injHtml = `<h3 style="margin:18px 0 4px;font-size:16px">Injury stashes</h3>
  <p class="small">Young players (26 or under) who are out or on IR and score nothing for their team right now, but have a good chance of getting back to their old level. Contenders often sell these cheaply. Tap a player to see offers.</p>
  ${inj.length ? `<div class="card scroll"><table><thead><tr><th>Player</th><th>Owner</th><th class="n">Value</th><th>Injury</th></tr></thead><tbody>
  ${inj.map(p => `<tr class="tap" data-id="${esc(p.id)}"><td><b>${esc(p.name)}</b><span class="tag hot">stash</span><div class="small">${esc(assetMeta(p))}</div></td>
    <td class="small">${esc(ownerName(p.owner))}<br>${stratPill(MODEL.teamById.get(p.owner))}</td>
    <td class="n">${fmt(p.value)}<div class="small" style="color:var(--good)">→ ${fmt(p.injRebound / p.ageMult)}</div></td>
    <td class="small">${esc(p.injury)}${p.injuryBody ? ' · ' + esc(p.injuryBody) : ''}<br>${esc(p.injSeverity)} · ${Math.round(p.injRecovery * 100)}% recovery</td></tr>`).join('')}
  </tbody></table><p class="small">"→" is roughly what he'd be worth once healthy and producing again.</p></div>` : `<div class="card small">No young players on other teams are currently out with an injury they're expected to recover from.</div>`}`;
  const mineTaxi = MODEL.me.players.filter(p => p.taxiNext && p.value >= 300).sort((a, b) => b.value - a.value);
  const taxiT = [...MODEL.players.values()].filter(p => p.owner !== MODEL.me.rosterId && p.taxiNext && p.value >= 500)
    .sort((a, b) => (b.value * (1 + b.breakout)) - (a.value * (1 + a.breakout))).slice(0, 15);
  const taxiHtml = `<h3 style="margin:18px 0 4px;font-size:16px">Taxi stashes for next season</h3>
  <p class="small">This season's rookies, who will still be taxi-eligible next year. They don't count towards max PF while on the taxi squad, which suits a 2027 tank. You have ${mineTaxi.length}: ${mineTaxi.map(p => esc(p.name)).join(', ') || 'none'}. Until you have ${prefs.taxiGoal ?? 4} worth 800 or more, trade suggestions favour these players slightly. Tap a player to see offers.</p>
  ${taxiT.length ? `<div class="card scroll"><table><thead><tr><th>Player</th><th>Owner</th><th class="n">Value</th><th>Score</th></tr></thead><tbody>
  ${taxiT.map(p => `<tr class="tap" data-id="${esc(p.id)}"><td><b>${esc(p.name)}</b><span class="tag buy">taxi '${String(+RAW.league.season + 1).slice(2)}</span><div class="small">${esc(assetMeta(p))}${p.ppg != null ? ` · ${p.ppg.toFixed(1)} ppg` : ''}</div></td>
    <td class="small">${esc(ownerName(p.owner))}<br>${stratPill(MODEL.teamById.get(p.owner))}</td><td class="n">${fmt(p.value)}${p.trend ? `<div class="small" style="color:${p.trend > 0 ? 'var(--good)' : 'var(--bad)'}">${p.trend > 0 ? '+' : ''}${fmt(p.trend)}</div>` : ''}</td>
    <td><div class="bar"><span style="width:${Math.round(p.breakout * 100)}%"></span></div></td></tr>`).join('')}</tbody></table></div>` : '<div class="card small">No rookies on other teams worth 500 or more.</div>'}`;
  $('#tab-targets').innerHTML = dipHtml + injHtml + taxiHtml + `<h3 style="margin:18px 0 4px;font-size:16px">Breakout targets</h3><p class="small">Players on other rosters with the strongest breakout signals: youth, ${s ? 'usage, production ahead of value, ' : ''}Sleeper trending adds and 30-day value momentum.</p>
  <div class="card scroll"><table><thead><tr><th>Player</th><th>Owner</th><th class="n">Value</th>${s ? '<th class="n">PPG</th>' : ''}<th class="n">Adds</th><th>Score</th></tr></thead><tbody>
  ${list.map(p => `<tr class="tap" data-id="${esc(p.id)}"><td><b>${esc(p.name)}</b><div class="small">${esc(assetMeta(p))}${p.ppgRank && p.valRank ? ` · scoring ${p.pos}${p.ppgRank}, valued ${p.pos}${p.valRank}` : ''}</div></td>
    <td class="small">${esc(ownerName(p.owner))}<br>${stratPill(MODEL.teamById.get(p.owner))}</td><td class="n">${fmt(p.value)}${p.trend ? `<div class="small" style="color:${p.trend > 0 ? 'var(--good)' : 'var(--bad)'}">${p.trend > 0 ? '+' : ''}${fmt(p.trend)}</div>` : ''}</td>
    ${s ? `<td class="n">${p.ppg != null ? p.ppg.toFixed(1) : '–'}</td>` : ''}<td class="n">${p.adds ? fmt(p.adds) : '–'}</td>
    <td><div class="bar"><span style="width:${Math.round(p.breakout * 100)}%"></span></div><div class="small">${Math.round(p.breakout * 100)}</div></td></tr>`).join('')}
  </tbody></table></div>`;
  $('#tab-targets').querySelectorAll('tr.tap').forEach(tr => tr.onclick = () => toggleOffers(tr));
}

function assetRows(list) {
  return list.map(a => `<div class="asset"><div><div class="nm">${esc(a.name)}</div><div class="meta">${esc(assetMeta(a))}</div></div><div class="val">${fmt(a.value)}</div></div>`).join('');

function toggleOffers(tr) {

// ---------- Offer tracking ----------
function offerButton(tr) {
  const key = ENGINE.offerKey(tr.give, tr.get);
  const existing = OFFERS.find(o => o.key === key && o.status === 'open');
  if (existing) return `<div class="row" style="margin-top:10px"><span class="pill" style="color:var(--good)">Offer sent ${new Date(existing.ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })} · open</span></div>`;
  CARDS.push(tr);
  return `<div class="row" style="margin-top:10px"><button class="btn ghost" data-card="${CARDS.length - 1}">I've sent this offer</button></div>`;
}
function bindOfferButtons(root) {
  root.querySelectorAll('button[data-card]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const tr = CARDS[+b.dataset.card]; if (!tr) return;
    const slim = a => ({ id: a.id, name: a.name, value: Math.round(a.value), pos: a.pos, kind: a.kind });
    OFFERS.unshift({
      key: ENGINE.offerKey(tr.give, tr.get), ts: Date.now(), ownerId: tr.partner.ownerId, partnerName: tr.partner.name,
      give: tr.give.map(slim), get: tr.get.map(slim), diff: tr.diff, status: 'open',
    });
    saveOffers();
    b.outerHTML = `<span class="pill" style="color:var(--good)">Saved to Offers · open</span>`;
    renderOffers();
  });
}
// If a logged offer shows up as a completed Sleeper trade, mark it accepted automatically
function autoDetectAccepted() {
  const log = MODEL.tradeLog || [];
  let changed = false;
  for (const o of OFFERS) {
    if (o.status !== 'open') continue;
    const wantIds = o.get.filter(a => a.kind === 'player').map(a => a.id);
    if (!wantIds.length) continue;
    const hit = log.find(e => e.when >= o.ts - 86400000 && e.sides.some(sd => sd.team === MODEL.me && wantIds.every(id => sd.got.some(g => g.id === id))));
    if (hit) { o.status = 'accepted'; o.closedTs = hit.when; o.auto = true; changed = true; }
  }
  if (changed) saveOffers();
}

  const log = MODEL.tradeLog || [];

      const kN = ENGINE.ktcCompare(sd.gave, sd.got);
      const gotN = sd.got.length && sd.gave.length ? kN.b : ENGINE.packageValue(sd.got), gaveN = sd.got.length && sd.gave.length ? kN.a : ENGINE.packageValue(sd.gave);
      sd.netNow = gotN - gaveN; sd.pctNow = sd.netNow / Math.max(gotN, gaveN, 1); sd.gradeNow = gradeOf(sd.pctNow);
      // At the time of the trade, when the daily history covers it
      const kT = e.atTime ? ENGINE.ktcCompare(thenL(sd.gave), thenL(sd.got)) : null;
      const got = kT ? kT.b : gotN, gave = kT ? kT.a : gaveN;
      sd.net = got - gave; sd.pct = sd.net / Math.max(got, gave, 1); sd.grade = gradeOf(sd.pct);
      if (sd.team) { const r = record.get(sd.team) || { w: 0, l: 0, d: 0, net: 0 }; Math.abs(sd.pct) < 0.05 ? r.d++ : sd.net > 0 ? r.w++ : r.l++; r.net += sd.net; record.set(sd.team, r); }
    }
    const best = e.sides.slice().sort((a, b) => b.net - a.net)[0];
    e.verdict = (e.atTime ? 'At the time: ' : '') + (Math.abs(best.pct) < 0.05 ? 'even trade' : `${best.teamName} won by ${fmt(best.net)} (${Math.round(best.pct * 100)}%)`);
    if (e.atTime) {
      const bestNow = e.sides.slice().sort((a, b) => b.netNow - a.netNow)[0];
      e.hindsight = Math.abs(bestNow.pctNow) < 0.05 ? 'With hindsight: about even now' : `With hindsight: ${bestNow.teamName} ahead by ${fmt(bestNow.netNow)} (${Math.round(bestNow.pctNow * 100)}%)`;
    }
  }
  const profHtml = `<h3 style="margin:18px 0 4px;font-size:16px">Manager trade tendencies</h3>
  <p class="small">${log.length ? `From ${log.length} completed trade${log.length === 1 ? '' : 's'} (${seasons.join(', ')}). These tendencies feed into the trade scores, and managers who trade more often rank a little higher. Values are today's, so they show what kind of assets moved, not what they were worth at the time.` : 'No completed trades found in this league yet. Profiles will fill in as trades happen.'}</p>
  ${log.length ? `<div class="card">${MODEL.teams.slice().sort((a, b) => b.profile.trades - a.profile.trades).map(t => `<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b>${esc(t.name)}</b>${t === MODEL.me ? ' <span class="tag buy">you</span>' : ''} <span class="small">· ${t.profile.trades} trade${t.profile.trades === 1 ? '' : 's'}${record.get(t) ? ` · record ${record.get(t).w}–${record.get(t).l}${record.get(t).d ? '–' + record.get(t).d : ''} · net ${record.get(t).net >= 0 ? '+' : ''}${fmt(record.get(t).net)}` : ''}</span><div>${t.profile.tags.map(g => `<span class="pill" style="margin:3px 4px 0 0">${esc(g)}</span>`).join('')}</div></div>`).join('')}</div>
  <h3 style="margin:18px 0 4px;font-size:16px">Recent trades</h3>
  <p class="small">Graded on values from the day of the trade, for trades since the site started saving daily values (${esc((RAW.history?.dates || [])[0] || 'today')}). Older trades are graded on today's values, with hindsight. Each grade compares what a side got against what it gave, using KTC's value adjustment so a 2-for-1 is judged the way KTC would. A+ means a clear win, B is about even, F is a fleecing. Record is wins–losses(–evens).</p>
  ${log.slice(0, 12).map(e => `<div class="card"><div class="trade-top"><span class="small">${e.when ? new Date(e.when).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : e.season}</span><span class="small" style="text-align:right"><b>${esc(e.verdict)}</b>${e.hindsight ? `<br>${esc(e.hindsight)}` : ''}</span></div>
    <div class="sides">${e.sides.map(sd => `<div class="side"><h4 style="display:flex;justify-content:space-between"><span>${esc(sd.teamName)} got</span><span style="font-size:18px;color:${gradeCol(sd.grade)};letter-spacing:0">${sd.grade}${e.atTime && sd.gradeNow !== sd.grade ? `<span class="small" style="font-size:11px;color:var(--muted)"> now ${sd.gradeNow}</span>` : ''}</span></h4>${sd.got.length ? sd.got.map(a => `<div class="asset"><div><div class="nm">${esc(a.name)}</div><div class="meta">${a.kind === 'pick' ? 'Draft pick' : esc(a.pos) + (a.age ? ' · ' + Math.floor(a.age) + ' then' : '')}</div></div><div class="val">${e.atTime && a.then != null ? `${fmt(a.then)}<div class="small">now ${fmt(a.value)}</div>` : fmt(a.value)}</div></div>`).join('') : '<div class="small">Nothing</div>'}</div>`).join('')}</div></div>`).join('')}` : ''}`;
  $('#tab-league').insertAdjacentHTML('beforeend', profHtml);
  $('#tab-league').querySelectorAll('select').forEach(s => s.onchange = () => { prefs.strategy[s.dataset.r] = s.value; savePrefs(); rebuild(); });
}

function renderSettings() {
  $('#tab-settings').innerHTML = `<div class="card">
    <label class="set"><span>Player values<div class="small">KTC is read once a day by your GitHub job. FantasyCalc is based on real trades.</div></span>
      <select id="s-src">${[['ktc', 'KTC'], ['blend', 'Blend (50/50)'], ['fc', 'FantasyCalc']].map(([v, l]) => `<option value="${v}" ${(prefs.valueSource || 'ktc') === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <label class="set"><span>Fairness range<div class="small">How far apart the two sides' market values can be</div></span>
      <select id="s-fair">${[0.06, 0.1, 0.12, 0.15, 0.2].map(v => `<option value="${v}" ${prefs.fairness == v ? 'selected' : ''}>±${Math.round(v * 100)}%</option>`).join('')}</select></label>
    <label class="set"><span>Even deals<div class="small">Same number of pieces on each side</div></span>
      <select id="s-even">${[['prefer', 'Prefer'], ['strict', 'Only even'], ['off', 'No preference']].map(([v, l]) => `<option value="${v}" ${(prefs.evenDeals ?? 'prefer') === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <label class="set"><span>Max assets per side</span>
      <select id="s-max">${[1, 2, 3].map(v => `<option ${prefs.maxAssets == v ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
    <label class="set"><span>Target buy-low dips<div class="small">Prime-age stars whose value has dropped while their role hasn't</div></span><input type="checkbox" id="s-buylow" ${prefs.buyLow !== false ? 'checked' : ''}></label>
    <label class="set"><span>Target injury stashes<div class="small">Young injured players with a good recovery outlook</div></span><input type="checkbox" id="s-inj" ${prefs.injuryStash !== false ? 'checked' : ''}></label>
    <label class="set"><span>Buy-low look-back<div class="small">Dips are measured from each player's peak in this window (needs saved history)</div></span>
      <select id="s-win">${[60, 90, 120].map(v => `<option value="${v}" ${(prefs.dipWindow ?? 90) == v ? 'selected' : ''}>${v} days</option>`).join('')}</select></label>
    <label class="set"><span>Never trade away my picks</span><input type="checkbox" id="s-picks" ${prefs.protectPicks ? 'checked' : ''}></label>
    <label class="set"><span>Number of trades to show</span>
      <select id="s-n">${[10, 20, 30].map(v => `<option ${prefs.maxResults == v ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
    <div class="row" style="margin-top:10px"><button class="btn ghost" id="s-reset">Reset strategies and marks</button></div>
    <p class="small">Data: Sleeper (rosters, picks, stats, trending adds) and <a href="https://fantasycalc.com" target="_blank" rel="noopener">FantasyCalc</a> (trade values, based on real trades) and KeepTradeCut (crowd values, read daily). Settings are saved in this browser only.</p>
  </div>`;
  $('#s-src').onchange = e => { prefs.valueSource = e.target.value; savePrefs(); rebuild(); };
  $('#s-fair').onchange = e => { prefs.fairness = +e.target.value; savePrefs(); rebuild(); };
  $('#s-even').onchange = e => { prefs.evenDeals = e.target.value; savePrefs(); rebuild(); };
  $('#s-max').onchange = e => { prefs.maxAssets = +e.target.value; savePrefs(); rebuild(); };
  $('#s-inj').onchange = e => { prefs.injuryStash = e.target.checked; savePrefs(); rebuild(); };
  $('#s-win').onchange = e => { prefs.dipWindow = +e.target.value; savePrefs(); rebuild(); };
  $('#s-buylow').onchange = e => { prefs.buyLow = e.target.checked; savePrefs(); rebuild(); };
  $('#s-picks').onchange = e => { prefs.protectPicks = e.target.checked; savePrefs(); rebuild(); };
  $('#s-n').onchange = e => { prefs.maxResults = +e.target.value; savePrefs(); rebuild(); };
  $('#s-reset').onclick = () => { prefs.strategy = {}; prefs.marks = {}; savePrefs(); rebuild(); };
}

document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('main section').forEach(s => s.classList.toggle('hidden', s.id !== 'tab-' + b.dataset.tab));
});
$('#refresh').onclick = () => load(true);
load(false);
</script>
