<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trade Finder · Futures Past + Present</title>
<style>
  :root{
    --bg:#0f1216; --panel:#171b21; --panel2:#1e232b; --line:#2a313b;
    --text:#e8ebef; --muted:#9aa4b1; --accent:#4fb3ff; --good:#3ecf8e; --warn:#f2b84b; --bad:#ff6b6b;
    --chip:#232a33;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
  header{position:sticky;top:0;z-index:5;background:rgba(15,18,22,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .wrap{max-width:980px;margin:0 auto;padding:12px 14px}
  h1{font-size:18px;margin:0}
  .sub{color:var(--muted);font-size:13px}
  nav{display:flex;gap:6px;overflow-x:auto;padding-top:10px}
  nav button{flex:0 0 auto;background:var(--chip);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
  nav button.on{background:var(--accent);color:#06121d;border-color:var(--accent);font-weight:600}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{background:var(--accent);color:#06121d;border:0;border-radius:8px;padding:7px 12px;font-weight:600;cursor:pointer;font-size:14px}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
  .trade-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
  .partner{font-weight:600}
  .pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .pill.winnow{color:var(--warn);border-color:#5a4a26}
  .pill.rebuild{color:var(--good);border-color:#24503d}
  .pill.middle{color:var(--accent);border-color:#264a63}
  .sides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:560px){.sides{grid-template-columns:1fr}}
  .side{background:var(--panel2);border-radius:10px;padding:10px}
  .side h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .asset{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px dashed #2a313b}
  .asset:first-of-type{border-top:0}
  .asset .nm{font-weight:600}
  .asset .meta{color:var(--muted);font-size:12px}
  .val{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;text-align:right;white-space:nowrap}
  .meter{height:6px;background:var(--chip);border-radius:6px;position:relative;margin:10px 0 4px}
  .meter i{position:absolute;top:-3px;width:2px;height:12px;background:var(--text)}
  .meter b{position:absolute;top:0;height:6px;border-radius:6px}
  ul.why{margin:8px 0 0;padding-left:18px;color:#cfd6de;font-size:13.5px}
  ul.why li{margin:2px 0}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  th{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  .scroll{overflow-x:auto}
  select,input,textarea{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:14px}
  textarea{width:100%;min-height:120px}
  .tag{font-size:11px;padding:1px 6px;border-radius:6px;margin-left:4px;background:var(--chip);color:var(--muted)}
  .tag.sell{color:var(--warn)} .tag.buy{color:var(--good)} .tag.hot{color:#ff8fd0}
  .status{font-size:13px;color:var(--muted)}
  .err{color:var(--bad)}
  .hidden{display:none}
  .bar{height:5px;background:var(--chip);border-radius:4px;overflow:hidden;min-width:60px}
  .bar span{display:block;height:100%;background:var(--good)}
  label.set{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .seg button{background:var(--chip);border:1px solid var(--line);color:var(--muted);padding:3px 8px;font-size:12px;cursor:pointer}
  .seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}
  .seg button.on{color:#06121d;background:var(--accent);border-color:var(--accent)}
  .small{font-size:12px;color:var(--muted)}
  a{color:var(--accent)}
  tr.tap{cursor:pointer} tr.tap:hover td, tr.tap.open td{background:var(--panel2)}
  tr.tap td:first-child b::after{content:' ›';color:var(--muted);font-weight:400}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="row" style="justify-content:space-between">
      <div>
        <h1 id="title">Trade Finder</h1>
        <div class="sub" id="subtitle">Loading league…</div>
      </div>
      <button class="btn ghost" id="refresh">Refresh</button>
    </div>
    <nav id="tabs">
      <button data-tab="trades" class="on">Top trades</button>
      <button data-tab="targets">Targets</button>
      <button data-tab="myteam">My team</button>
      <button data-tab="league">League</button>
      <button data-tab="settings">Settings</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="status" id="status">Fetching Sleeper and FantasyCalc…</div>

  <section id="tab-trades"></section>
  <section id="tab-targets" class="hidden"></section>
  <section id="tab-myteam" class="hidden"></section>
  <section id="tab-league" class="hidden"></section>
  <section id="tab-settings" class="hidden"></section>
</main>

<script>
/*ENGINE-START*/
// ---------- Pure trade engine (no DOM) ----------
const ENGINE = (() => {

  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const FLEX_ELIG = {
    FLEX: ['RB', 'WR', 'TE'], SUPER_FLEX: ['QB', 'RB', 'WR', 'TE'],
    REC_FLEX: ['WR', 'TE'], WRRB_FLEX: ['RB', 'WR'],
  };
  const SKILL = ['QB', 'RB', 'WR', 'TE'];

  // Two-year age-curve multiplier: how much of today's value a player is likely to keep.
  function ageMult(pos, age) {
    if (age == null || isNaN(age)) return 1;
    const a = Math.floor(age);
    const t = {
      RB: [[23, 1.15], [24, 1.05], [25, 0.92], [26, 0.78], [27, 0.62], [28, 0.5], [99, 0.4]],
      WR: [[23, 1.15], [25, 1.08], [26, 1.0], [27, 0.92], [28, 0.82], [29, 0.7], [30, 0.58], [99, 0.45]],
      TE: [[24, 1.15], [27, 1.05], [28, 0.93], [29, 0.82], [30, 0.7], [99, 0.55]],
      QB: [[25, 1.12], [29, 1.05], [32, 0.96], [33, 0.86], [34, 0.76], [99, 0.6]],
    }[pos];
    if (!t) return 1;
    for (const [lim, m] of t) if (a <= lim) return m;
    return 1;
  }

  // Parse FantasyCalc pick names like "2027 1st", "2027 Round 1", "2027 Early 1st", "2027 Pick 1.05"
  function parsePick(name) {
    const y = (name.match(/\b(20\d\d)\b/) || [])[1];
    if (!y) return null;
    let round = null, tier = 'generic', m;
    if ((m = name.match(/Pick\s*(\d)\.(\d{1,2})/i))) {
      round = +m[1]; const slot = +m[2];
      tier = slot <= 4 ? 'early' : slot <= 8 ? 'mid' : 'late';
    } else if ((m = name.match(/(\d)(?:st|nd|rd|th)\b/i)) || (m = name.match(/Round\s*(\d)/i))) {
      round = +m[1];
      if (/early/i.test(name)) tier = 'early'; else if (/mid/i.test(name)) tier = 'mid'; else if (/late/i.test(name)) tier = 'late';
    }
    if (!round) return null;
    return { season: y, round, tier };
  }

  const DEFAULT_PICK = { 1: 3600, 2: 1700, 3: 900, 4: 500, 5: 300 };

  function buildPickTable(fcRows) {
    const t = {}; // season -> round -> {early:[],mid:[],late:[],generic:[]}
    for (const r of fcRows) {
      if (r.player.position !== 'PICK') continue;
      const p = parsePick(r.player.name);
      if (!p) continue;
      t[p.season] ??= {}; t[p.season][p.round] ??= { early: [], mid: [], late: [], generic: [] };
      t[p.season][p.round][p.tier].push(r.value);
    }
    const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
    return function pickValue(season, round, tier) {
      const r = t[season]?.[round];
      if (r) {
        const exact = avg(r[tier] || []);
        if (exact) return exact;
        const all = [...r.early, ...r.mid, ...r.late];
        const g = avg(r.generic) ?? avg(all);
        if (g) return tier === 'early' ? g * 1.2 : tier === 'late' ? g * 0.82 : g;
      }
      // fall back: nearest season in table, else defaults; future years discounted slightly
      const seasons = Object.keys(t).sort();
      for (const s of seasons) if (t[s][round]) {
        const r2 = t[s][round]; const g = avg([...r2.generic, ...r2.early, ...r2.mid, ...r2.late]);
        if (g) return g * (tier === 'early' ? 1.2 : tier === 'late' ? 0.82 : 1);
      }
      return (DEFAULT_PICK[round] || 200) * (tier === 'early' ? 1.2 : tier === 'late' ? 0.82 : 1);
    };
  }

  // Best possible starting lineup value for a set of players.
  function lineupValue(players, slots, key = 'now') {
    const pool = players.filter(p => SKILL.includes(p.pos)).slice().sort((a, b) => b[key] - a[key]);
    const used = new Set(); let total = 0; const filled = [];
    const dedicated = slots.filter(s => SKILL.includes(s));
    const flex = slots.filter(s => FLEX_ELIG[s]).sort((a, b) => FLEX_ELIG[a].length - FLEX_ELIG[b].length);
    for (const s of dedicated) {
      const p = pool.find(x => !used.has(x.id) && x.pos === s);
      if (p) { used.add(p.id); total += p[key]; filled.push([s, p]); }
    }
    for (const s of flex) {
      const p = pool.find(x => !used.has(x.id) && FLEX_ELIG[s].includes(x.pos));
      if (p) { used.add(p.id); total += p[key]; filled.push([s, p]); }
    }
    return { total, starters: used, filled };
  }

  function percentileMap(entries) { // entries: [id, number]
    const sorted = entries.slice().sort((a, b) => a[1] - b[1]);
    const m = new Map(); const n = sorted.length;
    sorted.forEach(([id], i) => m.set(id, n > 1 ? i / (n - 1) : 0.5));
    return m;
  }

  function normaliseStats(raw) {
    // Accept v1 object {id: {...}} or array [{player_id, stats:{...}}]
    const out = new Map();
    if (!raw) return out;
    if (Array.isArray(raw)) { for (const r of raw) if (r && r.player_id) out.set(String(r.player_id), r.stats || r); }
    else for (const [id, s] of Object.entries(raw)) out.set(String(id), s);
    return out;
  }

  // history = { dates: ["2026-11-06", ...], values: { sleeperId: [v, v, null, ...] } }
  // Returns Map id -> {peak, daysSincePeak} over the last `windowDays`, only once there are 21+ days saved.
  function summariseHistory(history, windowDays) {
    if (!history?.dates?.length) return null;
    const dates = history.dates.map(d => Date.parse(d));
    const last = dates[dates.length - 1];
    const span = Math.round((last - dates[0]) / 86400000);
    if (span < 21) return null;
    const from = last - windowDays * 86400000;
    const out = new Map(); out.span = Math.min(span, windowDays);
    for (const [id, vals] of Object.entries(history.values || {})) {
      let peak = -1, peakAt = null;
      vals.forEach((v, i) => { if (v != null && dates[i] >= from && v >= peak) { peak = v; peakAt = dates[i]; } });
      if (peak >= 0) out.set(String(id), { peak, daysSincePeak: Math.round((last - peakAt) / 86400000) });
    }
    return out;
  }

  // ---- Injuries ----
  // Out/IR players score nothing for a contender this season, so their price dips. Young ones with a
  // good recovery outlook are classic rebuilder buys.
  const SEVERE = /achilles/i;
  const LONG = /acl|mcl|knee|lisfranc|patell|tibia|fibula|fracture|broken|leg|neck|spine|pectoral|foot/i;
  function injuryAssess(p) {
    const st = (p.injury || '').toUpperCase();
    const outNow = /^(IR|PUP|OUT|DOUBTFUL|SUS|NFI)/.test(st);
    p.injuredOut = outNow;
    if (!outNow) { p.injStash = false; return; }
    const body = `${p.injuryBody || ''} ${p.injuryNotes || ''}`;
    let recovery = SEVERE.test(body) ? 0.65 : LONG.test(body) ? 0.85 : 0.95;
    p.injSeverity = SEVERE.test(body) ? 'severe' : LONG.test(body) ? 'long-term' : 'short-term';
    const age = p.age ?? 30;
    if (age <= 24) recovery += 0.05; else if (age >= 27) recovery -= 0.1;
    p.injRecovery = clamp(recovery, 0.4, 1);
    // A contender gets little or nothing from him this season
    p.now *= /^(IR|PUP|NFI)/.test(st) ? 0.1 : st.startsWith('OUT') || st.startsWith('SUS') ? 0.5 : 0.7;
    // Worth stashing: young, was a real asset, decent recovery odds
    const quality = p.value >= 1500 || (p.yoe ?? 9) <= 1 && p.value >= 800 || (p.peakValue ?? 0) >= 2000;
    p.injStash = age <= 26 && quality && p.injRecovery >= 0.75;
    p.injRebound = p.injStash ? Math.max(p.peakValue || p.value, p.value * 1.2) * p.ageMult * p.injRecovery : null;
  }

  // ---- Trade history: what each manager tends to do ----
  // tradeHistory = [{ season, rosters: [{roster_id, owner_id}], txns: [...] }]
  // Values are today's FantasyCalc values (a guide to what moved, not what it was worth at the time).
  function buildTendencies(tradeHistory, teams, { fcById, sleeperPlayers, pickValue }) {
    const log = [];
    for (const t of teams) t.profile = { trades: 0, seasons: new Set(), partners: {}, picksIn: 0, picksOut: 0, piecesIn: 0, piecesOut: 0, ageIn: [0, 0], ageOut: [0, 0], posIn: {}, valIn: 0, valOut: 0, tags: [], favPos: [], perSeason: 0, pickNet: 0, consol: 0, ageNet: 0 };
    if (!tradeHistory?.length) return log;
    const byOwner = new Map(teams.map(t => [t.ownerId, t]));
    const nowYear = new Date().getFullYear() + new Date().getMonth() / 12;
    for (const set of tradeHistory) {
      const ownerOf = new Map((set.rosters || []).map(r => [r.roster_id, r.owner_id]));
      for (const tx of set.txns || []) {
        if (tx.type !== 'trade' || tx.status !== 'complete') continue;
        const when = tx.status_updated || tx.created || 0;
        const yearsAgo = when ? Math.max(0, nowYear - (new Date(when).getFullYear() + new Date(when).getMonth() / 12)) : 0;
        const sides = {};
        for (const rid of tx.roster_ids || []) sides[rid] = { got: [], gave: [] };
        const pl = (id) => {
          const f = fcById.get(String(id)), sp = sleeperPlayers?.[id] || {};
          const age = f?.player.maybeAge ?? sp.age;
          return { kind: 'player', id: String(id), name: f?.player.name || sp.full_name || `Player ${id}`, pos: f?.player.position || sp.position || '?',
            value: f?.value ?? 0, age: age != null ? +age - yearsAgo : null };
        };
        for (const [id, rid] of Object.entries(tx.adds || {})) sides[rid]?.got.push(pl(id));
        for (const [id, rid] of Object.entries(tx.drops || {})) sides[rid]?.gave.push(pl(id));
        for (const dp of tx.draft_picks || []) {
          const pk = { kind: 'pick', name: `${dp.season} round ${dp.round}`, value: pickValue(String(dp.season), dp.round, 'generic'), pos: 'PICK' };
          sides[dp.owner_id]?.got.push(pk); sides[dp.previous_owner_id]?.gave.push(pk);
        }
        const entry = { when, season: set.season, sides: [] };
        for (const [rid, sd] of Object.entries(sides)) {
          const team = byOwner.get(ownerOf.get(+rid));
          entry.sides.push({ team, teamName: team?.name || 'Former manager', ...sd });
          if (!team) continue;
          const pr = team.profile;
          pr.trades++; pr.seasons.add(set.season);
          pr.piecesIn += sd.got.length; pr.piecesOut += sd.gave.length;
          for (const a of sd.got) {
            pr.valIn += a.value;
            if (a.kind === 'pick') pr.picksIn += a.value;
            else { pr.posIn[a.pos] = (pr.posIn[a.pos] || 0) + a.value; if (a.age) { pr.ageIn[0] += a.age * a.value; pr.ageIn[1] += a.value; } }
          }
          for (const a of sd.gave) {
            pr.valOut += a.value;
            if (a.kind === 'pick') pr.picksOut += a.value;
            else if (a.age) { pr.ageOut[0] += a.age * a.value; pr.ageOut[1] += a.value; }
          }
          for (const other of tx.roster_ids || []) if (other !== +rid) {
            const ot = byOwner.get(ownerOf.get(other));
            if (ot) pr.partners[ot.name] = (pr.partners[ot.name] || 0) + 1;
          }
        }
        log.push(entry);
      }
    }
    log.sort((a, b) => b.when - a.when);
    const seasonsTotal = new Set(tradeHistory.map(s => s.season)).size || 1;
    for (const t of teams) {
      const pr = t.profile;
      pr.perSeason = pr.trades / seasonsTotal;
      pr.pickNet = pr.picksIn - pr.picksOut;
      pr.consol = pr.trades ? (pr.piecesOut - pr.piecesIn) / pr.trades : 0; // >0: gives more pieces than gets (consolidator)
      const ai = pr.ageIn[1] ? pr.ageIn[0] / pr.ageIn[1] : null, ao = pr.ageOut[1] ? pr.ageOut[0] / pr.ageOut[1] : null;
      pr.ageNet = ai != null && ao != null ? ai - ao : 0; // >0: buys older than they sell
      const posTot = Object.values(pr.posIn).reduce((a, b) => a + b, 0) || 1;
      pr.posShare = Object.fromEntries(Object.entries(pr.posIn).map(([k, v]) => [k, v / posTot]));
      const tags = [];
      if (!pr.trades) tags.push("Hasn't traded");
      else {
        if (pr.perSeason >= 3) tags.push('Active trader'); else if (pr.perSeason < 1) tags.push('Rarely trades');
        if (pr.pickNet > 1500) tags.push('Collects picks'); else if (pr.pickNet < -1500) tags.push('Spends picks');
        if (pr.consol >= 0.5) tags.push('Consolidates (2-for-1s)'); else if (pr.consol <= -0.5) tags.push('Adds depth (1-for-2s)');
        if (pr.ageNet >= 1.5) tags.push('Buys veterans'); else if (pr.ageNet <= -1.5) tags.push('Buys youth');
        const fav = Object.entries(pr.posShare).filter(([k]) => k !== '?').sort((a, b) => b[1] - a[1])[0];
        if (fav && fav[1] >= 0.45 && pr.trades >= 2) tags.push(`Targets ${fav[0]}s`);
        const bud = Object.entries(pr.partners).sort((a, b) => b[1] - a[1])[0];
        if (bud && bud[1] >= 2) tags.push(`Often trades with ${bud[0]}`);
      }
      pr.tags = tags;
      pr.favPos = Object.entries(pr.posShare).filter(([k, v]) => k !== '?' && v >= 0.45 && pr.trades >= 2).map(([k]) => k);
    }
    return log;
  }

  function buildModel(input, prefs) {
    const { league, users, rosters, tradedPicks = [], fc = [], sleeperPlayers = null, stats = null, trending = [], myUsername, history = null } = input;
    const hist = summariseHistory(history, prefs.dipWindow ?? 90);
    const slots = (league.roster_positions || []).filter(s => SKILL.includes(s) || FLEX_ELIG[s]);
    const season = +league.season;
    const draftRounds = league.settings?.draft_rounds || 4;

    const fcById = new Map();
    for (const r of fc) if (r.player?.sleeperId) fcById.set(String(r.player.sleeperId), r);
    const pickValue = buildPickTable(fc);
    const statMap = normaliseStats(stats);
    const trendMap = new Map((trending || []).map(t => [String(t.player_id), t.count]));
    const maxTrend = Math.max(1, ...trendMap.values());

    const userById = new Map(users.map(u => [u.user_id, u]));
    const teams = rosters.map(r => {
      const u = userById.get(r.owner_id) || {};
      const s = r.settings || {};
      return {
        rosterId: r.roster_id, ownerId: r.owner_id,
        username: u.display_name || 'Unknown',
        name: u.metadata?.team_name || u.display_name || `Team ${r.roster_id}`,
        wins: s.wins || 0, losses: s.losses || 0, ties: s.ties || 0,
        pf: (s.fpts || 0) + (s.fpts_decimal || 0) / 100,
        pa: (s.fpts_against || 0) + (s.fpts_against_decimal || 0) / 100,
        playerIds: (r.players || []).map(String),
        assets: [],
      };
    });
    const teamById = new Map(teams.map(t => [t.rosterId, t]));

    // ---- Players ----
    const players = new Map();
    for (const t of teams) for (const id of t.playerIds) {
      const f = fcById.get(id); const sp = sleeperPlayers?.[id] || {};
      const pos = f?.player.position || sp.position || '?';
      const age = f?.player.maybeAge ?? sp.age ?? null;
      const value = f?.value ?? 0;
      const now = f?.redraftValue ?? value * 0.55;
      players.set(id, {
        id, kind: 'player', owner: t.rosterId,
        name: f?.player.name || sp.full_name || (sp.first_name ? `${sp.first_name} ${sp.last_name}` : `Player ${id}`),
        pos, team: f?.player.maybeTeam || sp.team || 'FA',
        age: age != null ? +age : null,
        yoe: f?.player.maybeYoe ?? sp.years_exp ?? null,
        value, now, trend: f?.trend30Day ?? 0,
        injury: sp.injury_status || (sp.status === 'Injured Reserve' ? 'IR' : null),
        injuryBody: sp.injury_body_part || null,
        injuryNotes: sp.injury_notes || null,
        stats: statMap.get(id) || null,
        adds: trendMap.get(id) || 0,
      });
    }

    // ---- Breakout signals (computed league-wide by position) ----
    const byPos = {};
    for (const p of players.values()) if (SKILL.includes(p.pos)) (byPos[p.pos] ??= []).push(p);
    const haveStats = statMap.size > 0;
    for (const [pos, list] of Object.entries(byPos)) {
      const withGames = list.filter(p => p.stats && (p.stats.gp || 0) >= 3);
      const ppg = p => (p.stats.pts_half_ppr ?? p.stats.pts_ppr ?? 0) / Math.max(1, p.stats.gp);
      const opp = p => {
        const s = p.stats, gp = Math.max(1, s.gp);
        if (pos === 'QB') return ((s.pass_att || 0) + 1.5 * (s.rush_att || 0)) / gp;
        if (pos === 'RB') return ((s.rush_att || 0) + 1.6 * (s.rec_tgt || 0)) / gp;
        return (s.rec_tgt || 0) / gp;
      };
      const snap = p => p.stats.tm_off_snp ? (p.stats.off_snp || 0) / p.stats.tm_off_snp : null;
      const oppPct = percentileMap(withGames.map(p => [p.id, opp(p)]));
      const snapPct = percentileMap(withGames.filter(p => snap(p) != null).map(p => [p.id, snap(p)]));
      const ppgRank = new Map(withGames.slice().sort((a, b) => ppg(b) - ppg(a)).map((p, i) => [p.id, i + 1]));
      const valRank = new Map(withGames.slice().sort((a, b) => b.value - a.value).map((p, i) => [p.id, i + 1]));
      for (const p of list) {
        const sig = {};
        const yoe = p.yoe ?? 5;
        sig.youth = ([1, 0.85, 0.6, 0.3][yoe] ?? 0) * ((p.age ?? 30) <= 25 ? 1 : 0.5);
        if (haveStats && p.stats && (p.stats.gp || 0) >= 3) {
          const u = 0.65 * (oppPct.get(p.id) ?? 0) + 0.35 * (snapPct.get(p.id) ?? oppPct.get(p.id) ?? 0);
          sig.usage = u;
          const gap = valRank.get(p.id) - ppgRank.get(p.id);
          sig.underval = clamp(gap / 20);
          p.ppg = ppg(p); p.ppgRank = ppgRank.get(p.id); p.valRank = valRank.get(p.id);
          p.oppPerGame = opp(p); p.snapShare = snap(p);
        } else if (haveStats) { sig.usage = 0; sig.underval = 0; }
        sig.buzz = p.adds ? Math.log1p(p.adds) / Math.log1p(maxTrend) : 0;
        const base = Math.max(1, p.value - p.trend);
        sig.momentum = clamp((p.trend / base) / 0.2);
        const W = { youth: 0.25, usage: 0.25, underval: 0.25, buzz: 0.15, momentum: 0.10 };
        let tot = 0, w = 0;
        for (const k of Object.keys(W)) if (sig[k] != null) { tot += W[k] * sig[k]; w += W[k]; }
        p.signals = sig;
        p.breakout = w ? tot / w : 0;
        // Breakouts only matter if there is some real value or role to grow from
        if (p.value < 300 && !(sig.usage > 0.6)) p.breakout *= 0.5;
        p.ageMult = ageMult(p.pos, p.age);
        p.future = p.value * p.ageMult;
        // Sell high, not low: rising value = near peak (good time to sell);
        // falling value with the role intact = situational dip (hold, don't sell low).
        const decline = clamp((1 - p.ageMult) / 0.5);
        const nowRatio = clamp((p.now / Math.max(1, p.value) - 0.45) / 0.5);
        const trendPct = p.trend / base;
        p.trendPct = trendPct;
        const peak = clamp(trendPct / 0.10);
        p.sell = 0.5 * decline + 0.25 * nowRatio + 0.25 * peak;
        const roleIntact = sig.usage == null ? true
          : sig.usage >= 0.7 && (p.snapShare == null || p.snapShare >= 0.6);
        // How far below his recent peak is he, and for how long?
        // With saved history: peak within the chosen window. Without it: the 30-day change only.
        const h = hist?.get(p.id);
        if (h && h.peak > p.value) {
          p.peakValue = h.peak; p.dropPct = (h.peak - p.value) / h.peak; p.dipDays = h.daysSincePeak; p.histDays = hist.span;
        } else if (h) {
          p.peakValue = p.value; p.dropPct = 0; p.dipDays = 0; p.histDays = hist.span;
        } else {
          p.peakValue = p.value - Math.min(0, p.trend); p.dropPct = Math.max(0, -trendPct); p.dipDays = null;
        }
        p.dip = p.dropPct >= (h ? 0.08 : 0.05) && p.value >= 1500 && roleIntact;
        if (trendPct <= -0.05) p.sell *= p.dip ? 0.35 : 0.7;
        // Long dips make managers more willing to sell: 0 at two weeks, 1 at ~3 months. Unknown length = treated as recent.
        p.dipFatigue = p.dipDays == null ? 0.25 : clamp((p.dipDays - 14) / 76);
        // Buy-low: a dip in a prime-age player whose role is intact. Assume ~60% of the drop comes back.
        p.buyLow = p.dip && (p.age ?? 99) <= 28;
        p.rebound = p.buyLow ? (p.value + (p.peakValue - p.value) * 0.6) * p.ageMult : null;
        injuryAssess(p);
      }
    }
    for (const p of players.values()) if (!SKILL.includes(p.pos)) {
      p.breakout = 0; p.signals = {}; p.ageMult = 1; p.future = p.value; p.sell = 0; p.dropPct = 0; p.dipFatigue = 0; p.injStash = false;
    }

    // ---- Strategy classification ----
    for (const t of teams) {
      const ps = t.playerIds.map(id => players.get(id)).filter(Boolean);
      t.lineupNow = lineupValue(ps, slots, 'now').total;
      t.futureTotal = ps.reduce((s, p) => s + p.future, 0);
      const vsum = ps.reduce((s, p) => s + p.value, 0) || 1;
      t.avgAge = ps.filter(p => p.age).reduce((s, p) => s + p.age * p.value, 0) / vsum;
      t.games = t.wins + t.losses + t.ties;
      t.winPct = t.games ? (t.wins + 0.5 * t.ties) / t.games : 0.5;
    }
    const z = (arr, f) => { const v = arr.map(f); const m = v.reduce((a, b) => a + b, 0) / v.length; const sd = Math.sqrt(v.reduce((a, b) => a + (b - m) ** 2, 0) / v.length) || 1; return x => (f(x) - m) / sd; };
    const zL = z(teams, t => t.lineupNow), zW = z(teams, t => t.winPct), zP = z(teams, t => t.pf);
    for (const t of teams) t.contendScore = 0.5 * zL(t) + 0.3 * zW(t) + 0.2 * zP(t);
    const ranked = teams.slice().sort((a, b) => b.contendScore - a.contendScore);
    const n = teams.length, topN = Math.round(n * 0.4), botN = Math.round(n * 0.3);
    ranked.forEach((t, i) => {
      t.contendRank = i + 1;
      t.autoStrategy = i < topN ? 'winnow' : i >= n - botN ? 'rebuild' : 'middle';
    });
    const me = teams.find(t => t.username.toLowerCase() === (myUsername || '').toLowerCase()) || teams[0];
    for (const t of teams) {
      const o = prefs.strategy?.[t.rosterId];
      t.strategy = o || (t === me ? 'rebuild' : t.autoStrategy);
    }

    // ---- Draft picks ----
    const seasons = [season + 1, season + 2, season + 3].map(String);
    const pickOwner = new Map();
    for (const s of seasons) for (let r = 1; r <= draftRounds; r++) for (const t of teams) pickOwner.set(`${s}:${r}:${t.rosterId}`, t.rosterId);
    for (const tp of tradedPicks) {
      const k = `${tp.season}:${tp.round}:${tp.roster_id}`;
      if (pickOwner.has(k)) pickOwner.set(k, tp.owner_id);
    }
    const picks = new Map();
    for (const [k, owner] of pickOwner) {
      const [s, r, orig] = k.split(':');
      const origTeam = teamById.get(+orig);
      let tier = 'generic';
      if (s === seasons[0]) tier = origTeam.contendRank > n - Math.round(n * 0.3) ? 'early' : origTeam.contendRank <= Math.round(n * 0.3) ? 'late' : 'mid';
      const value = pickValue(s, +r, tier) * (s === seasons[2] ? 0.95 : 1);
      const ord = ['', '1st', '2nd', '3rd', '4th', '5th'][+r] || `R${r}`;
      const label = `${s} ${tier !== 'generic' ? tier[0].toUpperCase() + tier.slice(1) + ' ' : ''}${ord}` + (+orig !== owner ? ` (from ${origTeam.name})` : '');
      picks.set(`pick:${k}`, {
        id: `pick:${k}`, kind: 'pick', owner, name: label, pos: 'PICK', season: s, round: +r, origRoster: +orig,
        value, now: 0, future: value * 1.05, age: null, ageMult: 1, breakout: +r === 1 ? 0.35 : 0.15, sell: 0, trend: 0, signals: {}, dropPct: 0, dipFatigue: 0,
      });
    }

    for (const t of teams) {
      t.assets = [...t.playerIds.map(id => players.get(id)), ...[...picks.values()].filter(p => p.owner === t.rosterId)];
      t.players = t.assets.filter(a => a.kind === 'player');
    }
    const tradeLog = buildTendencies(input.tradeHistory, teams, { fcById, sleeperPlayers, pickValue });
    return { league, slots, season, teams, teamById, players, picks, me, haveStats, haveTrending: trendMap.size > 0, histSpan: hist?.span || 0, tradeLog };
  }

  const STRAT_W = { winnow: { now: 1.0, fut: 0.25 }, middle: { now: 0.6, fut: 0.6 }, rebuild: { now: 0.12, fut: 1.0 } };

  // How a team with a given strategy values an asset long-term.
  // Rebuilders: older players are nearly worthless, QBs/WRs/picks are prized, RBs discounted.
  // Contenders: picks are worth a bit less (they don't help this season).
  const REBUILD_POS = { QB: 1.12, WR: 1.1, TE: 0.95, RB: 0.82 };
  function stratFuture(a, strat) {
    let f = a.future;
    if (strat === 'rebuild') {
      if (a.kind === 'pick') return f * 1.1;
      if (a.ageMult < 0.9) f *= 0.35;
      return f * (REBUILD_POS[a.pos] || 1);
    }
    if (strat === 'winnow' && a.kind === 'pick') return f * 0.85;
    return f;
  }
  // Power mean on plain numbers (same consolidation logic as packageValue)
  const pm = vals => Math.pow(vals.reduce((s, v) => s + Math.pow(Math.max(0, v), CONSOLIDATION_K), 0), 1 / CONSOLIDATION_K);

  // Effective market value of a package. Uses a power mean so one great asset beats several
  // middling ones: two 1,500s ≈ 2,300, not 3,000; two 4,000s ≈ 6,200, not 8,000.
  const CONSOLIDATION_K = 1.6;
  function packageValue(assets) {
    const k = CONSOLIDATION_K;
    return Math.pow(assets.reduce((s, a) => s + Math.pow(Math.max(0, a.value), k), 0), 1 / k);
  }
  const rawValue = assets => assets.reduce((s, a) => s + a.value, 0);

  // ---- Shared trade evaluator ----
  function makeCtx(model, prefs) {
    const me = model.me;
    const myAssetScore = a => {
      if (a.injStash && prefs.injuryStash !== false) return Math.max(a.future, a.injRebound) * 1.1;
      if (a.buyLow && prefs.buyLow !== false) return Math.max(a.future, a.rebound) * (1.15 * (0.85 + 0.3 * a.dipFatigue));
      return a.future * (1 + 0.35 * a.breakout);
    };
    // A manager whose player dipped recently still anchors to the old price; after a long dip they let go.
    const anchored = a => a.buyLow ? 1 + a.dropPct * (1 - a.dipFatigue) : 1;
    return {
      me, tol: prefs.fairness ?? 0.12, myAssetScore, anchored, even: prefs.evenDeals ?? 'prefer',
      myStrat: STRAT_W[me.strategy],
      myLineupBefore: lineupValue(me.players, model.slots).total,
      theirBefore: new Map(model.teams.map(t => [t.rosterId, lineupValue(t.players, model.slots)])),
    };
  }

  function evaluate(model, ctx, t, G, R, opts = {}) {
    const { me, tol } = ctx;
    const gv = packageValue(G), rv = packageValue(R);
    const diff = (rv - gv) / Math.max(rv, gv, 1); // + means I receive more market value
    const res = { partner: t, give: G, get: R, gv, rv, diff, ok: true, why: [] };
    const fail = m => { res.ok = false; res.fail = m; return res; };
    if (Math.abs(diff) > tol) return fail(diff > 0 ? 'they lose too much market value' : 'you overpay');
    const topGive = Math.max(...G.map(a => a.value)), topGet = Math.max(...R.map(a => a.value));
    if (topGet > topGive && diff > 0.05) return fail('they give the best piece and lose value');
    if (topGive > topGet && diff < -0.05) return fail('you give the best piece and lose value');
    if (Math.min(topGive, topGet) < 0.5 * Math.max(topGive, topGet)) return fail('quantity for quality');
    const w = STRAT_W[t.strategy];
    const before = ctx.theirBefore.get(t.rosterId);
    const gIds = new Set(G.map(a => a.id)), rIds = new Set(R.map(a => a.id));
    const after = lineupValue(t.players.filter(p => !rIds.has(p.id)).concat(G.filter(a => a.kind === 'player')), model.slots);
    res.theirNow = after.total - before.total;
    res.newStarters = after.filled.filter(([, p]) => gIds.has(p.id)).map(([slot, p]) => [slot, p]);
    res.theirFut = pm(G.map(a => stratFuture(a, t.strategy))) - pm(R.map(a => stratFuture(a, t.strategy) * ctx.anchored(a)));
    res.partnerU = (w.now * res.theirNow + w.fut * res.theirFut) / 1000 - Math.max(0, diff) * 2.5;
    // Nudge by this manager's trade history
    const pr = t.profile; res.tendency = [];
    if (pr?.trades) {
      let b = 0;
      const gPl = G.filter(a => a.kind === 'player'), rPl = R.filter(a => a.kind === 'player');
      const avgAge = l => { const x = l.filter(a => a.age); return x.length ? x.reduce((s, a) => s + a.age, 0) / x.length : null; };
      if (pr.pickNet > 1500 && G.some(a => a.kind === 'pick')) { b += 0.3; res.tendency.push('they tend to collect picks'); }
      if (pr.pickNet < -1500 && R.some(a => a.kind === 'pick')) { b += 0.25; res.tendency.push('they tend to spend picks on players'); }
      if (pr.consol >= 0.5 && G.length < R.length) { b += 0.25; res.tendency.push('they like consolidating into fewer, better pieces'); }
      if (pr.consol <= -0.5 && G.length > R.length) { b += 0.2; res.tendency.push('they like adding depth'); }
      const ag = avgAge(gPl), ar = avgAge(rPl);
      if (ag && ar && pr.ageNet >= 1.5 && ag > ar) { b += 0.2; res.tendency.push('they usually buy proven veterans'); }
      if (ag && ar && pr.ageNet <= -1.5 && ag < ar) { b += 0.2; res.tendency.push('they usually buy youth'); }
      const fp = gPl.find(a => pr.favPos.includes(a.pos));
      if (fp) { b += 0.15; res.tendency.push(`they often trade for ${fp.pos}s`); }
      res.partnerU += b;
    }
    // Managers prefer deals with the same number of pieces each side (roster spots, and uneven deals feel lopsided)
    res.imbalance = Math.abs(G.length - R.length);
    if (res.imbalance && ctx.even === 'strict') return fail('uneven number of pieces');
    if (res.imbalance && ctx.even === 'prefer') {
      const likesIt = pr?.consol >= 0.5 && G.length < R.length; // a known consolidator doesn't mind
      res.partnerU -= (likesIt ? 0.15 : 0.35) * res.imbalance;
    }
    const myAfter = me.players.filter(p => !gIds.has(p.id)).concat(R.filter(a => a.kind === 'player'));
    res.myNow = lineupValue(myAfter, model.slots).total - ctx.myLineupBefore;
    res.myFut = pm(R.map(ctx.myAssetScore)) - pm(G.map(a => stratFuture(a, me.strategy)));
    res.myU = (ctx.myStrat.now * res.myNow + ctx.myStrat.fut * res.myFut) / 1000;
    if (res.partnerU <= (opts.minPartner ?? 0.15)) return fail('not enough in it for them');
    if (res.myU <= (opts.minMine ?? 0.2)) return fail('not enough in it for you');
    // Managers who actually trade are worth more of your time
    const act = !pr || !model.tradeLog?.length ? 1 : pr.trades === 0 ? 0.85 : clamp(0.92 + 0.06 * pr.perSeason, 0.92, 1.12);
    const evenPen = ctx.even === 'prefer' ? 0.8 * res.imbalance : 0;
    res.score = (res.myU + 0.6 * Math.min(res.partnerU, 3) - 4 * Math.max(0, Math.abs(diff) - 0.04) - evenPen) * act;
    return res;
  }

  function myGivePool(model, prefs, { forOffer = false } = {}) {
    const mark = prefs.marks || {};
    return model.me.assets.filter(a => {
      const m = mark[a.id];
      if (m === 'protect') return false;
      if (m === 'shop') return true;
      if (a.kind === 'pick') return !prefs.protectPicks && a.value >= 400;
      if (a.dip) return false; // never sell a star during a situational dip unless marked Shop
      if (a.injuredOut) return false; // injured players fetch little: don't sell low
      if (a.trendPct <= -0.08) return false; // avoid selling into a falling market
      if (forOffer) return a.value >= 250;
      return a.value >= 600 && (a.sell >= 0.35 || a.ageMult < 0.9);
    });
  }

  function generateTrades(model, prefs) {
    const maxPer = prefs.maxAssets ?? 2;
    const ctx = makeCtx(model, prefs);
    const me = model.me;
    const give = myGivePool(model, prefs).sort((a, b) => (b.sell * b.value) - (a.sell * a.value)).slice(0, 12);
    const results = [];
    for (const t of model.teams) {
      if (t === me) continue;
      // What I'd want from them: young / breakout / picks / buy-low dips
      const want = t.assets.filter(a => a.value >= 400 && (a.kind === 'pick' || a.ageMult >= 1 || a.breakout >= 0.45 || (a.buyLow && prefs.buyLow !== false) || (a.injStash && prefs.injuryStash !== false)))
        .sort((a, b) => ctx.myAssetScore(b) - ctx.myAssetScore(a)).slice(0, 14);
      const cap = maxPer >= 3 ? 8 : 99;
      const giveSets = combos(give.slice(0, cap), maxPer), getSets = combos(want.slice(0, cap + 2), maxPer);
      for (const G of giveSets) {
        if (packageValue(G) < 800) continue;
        for (const R of getSets) {
          if (packageValue(R) < 600) continue;
          const r = evaluate(model, ctx, t, G, R);
          if (r.ok) results.push(r);
        }
      }
    }
    results.sort((a, b) => b.score - a.score);
    // Diversity: max 3 per partner, each of my assets at most twice, each of theirs once
    const out = [], perPartner = {}, myUse = {}, theirUse = {};
    for (const r of results) {
      const pid = r.partner.rosterId;
      if ((perPartner[pid] || 0) >= 3) continue;
      if (r.give.some(a => (myUse[a.id] || 0) >= 2)) continue;
      if (r.get.some(a => theirUse[a.id])) continue;
      out.push(r); perPartner[pid] = (perPartner[pid] || 0) + 1;
      r.give.forEach(a => myUse[a.id] = (myUse[a.id] || 0) + 1);
      r.get.forEach(a => theirUse[a.id] = 1);
      if (out.length >= (prefs.maxResults ?? 20)) break;
    }
    return out;
  }

  // Offers built around one specific target: what could I send his manager that they'd like?
  function offersFor(model, prefs, assetId, n = 3) {
    const target = model.players.get(assetId) || model.picks.get(assetId);
    if (!target) return { target: null, offers: [] };
    const t = model.teamById.get(target.owner);
    const ctx = makeCtx(model, prefs);
    const tv = target.value;
    // What this manager would like from me, among pieces in a sensible value range
    const appeal = a => STRAT_W[t.strategy].now * a.now + STRAT_W[t.strategy].fut * stratFuture(a, t.strategy);
    const pool = myGivePool(model, prefs, { forOffer: true })
      .filter(a => a.value <= tv * 1.35 && a.value >= Math.min(250, tv * 0.2))
      .sort((a, b) => appeal(b) - appeal(a)).slice(0, 12);
    const sets = combos(pool, 3);
    // To keep piece counts even, also try asking for a small extra piece back: one they'd miss least
    const fillers = t.assets.filter(a => a.id !== target.id && a.value >= 150 && a.value <= tv * 0.5)
      .sort((a, b) => appeal(a) - appeal(b)).slice(0, 8);
    const getSets = [[target], ...fillers.map(f => [target, f])];
    const good = [], near = [];
    for (const G of sets) for (const R of getSets) {
      if (R.length > G.length) continue;
      const r = evaluate(model, ctx, t, G, R, { minPartner: 0.1, minMine: 0 });
      if (r.ok) { r.offerScore = 0.65 * Math.min(r.partnerU, 4) + 0.35 * r.myU - 3 * Math.abs(r.diff) - (ctx.even === 'prefer' ? 0.8 * r.imbalance : 0); good.push(r); }
      else if (r.partnerU != null) near.push(r);
    }
    good.sort((a, b) => b.offerScore - a.offerScore);
    const out = [], used = {};
    for (const r of good) {
      const lead = r.give.slice().sort((a, b) => b.value - a.value)[0].id;
      if (used[lead]) continue; used[lead] = 1; out.push(r);
      if (out.length >= n) break;
    }
    let nearest = null;
    if (!out.length) {
      // Show the closest miss so the user knows what's lacking
      const cands = near.filter(r => r.myU > 0).sort((a, b) => b.partnerU - a.partnerU);
      nearest = cands[0] || null;
    }
    return { target, team: t, offers: out, nearest };
  }

  function combos(arr, k) {
    const out = arr.map(a => [a]);
    if (k >= 2) for (let i = 0; i < arr.length; i++) for (let j = i + 1; j < arr.length; j++) out.push([arr[i], arr[j]]);
    if (k >= 3) for (let i = 0; i < arr.length; i++) for (let j = i + 1; j < arr.length; j++) for (let l = j + 1; l < arr.length; l++) out.push([arr[i], arr[j], arr[l]]);
    return out;
  }

  // Plain-English reasons for a trade
  function explain(tr, model) {
    const why = [];
    const stratName = { winnow: 'win-now', middle: 'in the middle', rebuild: 'rebuilding' };
    const t = tr.partner;
    if (tr.theirNow > 150) why.push(`${t.name} are ${stratName[t.strategy]} (${t.wins}–${t.losses}) and their best starting lineup gets stronger by about ${fmt(tr.theirNow)} points of value.`);
    else if (tr.theirFut > 0) why.push(`${t.name} are ${stratName[t.strategy]} (${t.wins}–${t.losses}) and gain long-term value.`);
    for (const a of tr.get) why.push(`You get ${a.name}: ${assetReason(a)}`);
    for (const a of tr.give) if (a.kind === 'player') why.push(`You give ${a.name}: ${sellReason(a)}`);
    if (tr.tendency?.length) why.push(`Their trade history: ${tr.tendency.join('; ')}.`);
    const pct = Math.round(tr.diff * 100);
    const side = (list, eff) => list.length > 1 ? `${fmt(rawValue(list))} (worth ${fmt(eff)} as a package)` : fmt(eff);
    why.push(`Market check: you give ${side(tr.give, tr.gv)}, you get ${side(tr.get, tr.rv)} (${pct === 0 ? 'even' : pct > 0 ? `+${pct}% your way` : `${pct}% their way`}).`);
    return why;
  }
  // Why the other manager might say yes (used by the offer builder)
  function theirSideReasons(r) {
    const t = r.partner, out = [];
    const slotName = s => ({ FLEX: 'flex', SUPER_FLEX: 'superflex', REC_FLEX: 'flex', WRRB_FLEX: 'flex' }[s] || s);
    if (r.newStarters?.length) out.push(r.newStarters.map(([s, p]) => `${p.name} would start for them at ${slotName(s)}`).join('; ') + '.');
    if (t.strategy === 'winnow' && r.theirNow > 100) out.push(`They're playing to win now (${t.wins}–${t.losses}): this makes their best lineup stronger by about ${fmt(r.theirNow)}.`);
    if (t.strategy !== 'winnow' && r.theirFut > 0) out.push(`They're ${t.strategy === 'rebuild' ? 'rebuilding' : 'in the middle'}, so they come out ahead on long-term value (younger pieces or picks).`);
    const pk = r.give.filter(a => a.kind === 'pick');
    if (pk.length && t.strategy !== 'winnow') out.push(`Includes ${pk.map(a => a.name).join(' and ')}, the kind of asset they're collecting.`);
    for (const a of r.get) if (a.buyLow) {
      if (a.dipDays != null && a.dipDays >= 45) out.push(`${a.name} has been below his peak for ${a.dipDays} days, so his manager may be ready to move on.`);
      else out.push(`${a.name}'s dip is recent, so his manager probably still values him close to his old price. This offer allows for that.`);
    }
    if (t.strategy !== 'rebuild') for (const a of r.get) if (a.injStash) out.push(`${a.name} is ${a.injury} and won't help them this season, so they may happily swap him for players who score now.`);
    if (r.tendency?.length) out.push(`Their trade history: ${r.tendency.join('; ')}.`);
    const pct = Math.round(r.diff * 100);
    out.push(`Market: you give ${r.give.length > 1 ? fmt(rawValue(r.give)) + ' (worth ' + fmt(r.gv) + ' as a package)' : fmt(r.gv)} for ${fmt(r.rv)} (${pct === 0 ? 'even' : pct > 0 ? `+${pct}% your way` : `${-pct}% over market, paid by you`}).`);
    return out;
  }

  function assetReason(a) {
    if (a.injStash) {
      return `injury stash: ${a.injury}${a.injuryBody ? ` (${a.injuryBody})` : ''}, so he's worth little to a contender this season and his price is down. ` +
        `At ${Math.floor(a.age)} with a ${a.injSeverity} injury, his recovery outlook is good (we estimate ${Math.round(a.injRecovery * 100)}% of his old value comes back).`;
    }
    if (a.buyLow) {
      const b = [a.dipDays != null
        ? `buy low: ${Math.round(a.dropPct * 100)}% below his ${fmt(a.peakValue)} peak, and has been for ${a.dipDays} days`
        : `buy low: value down ${fmt(-a.trend)} (${Math.round(a.dropPct * 100)}%) in 30 days`];
      if (a.signals?.usage != null) b.push(`but his role is intact (${a.snapShare ? Math.round(a.snapShare * 100) + '% snaps, ' : ''}usage in the top ${Math.max(1, Math.round((1 - a.signals.usage) * 100))}% of ${a.pos}s)`);
      else b.push('but nothing suggests he has lost his role');
      b.push(`age ${Math.floor(a.age)}, so a rebound back toward ${fmt(a.value + (a.peakValue - a.value) * 0.6)} is realistic`);
      return b.join(', ') + '.';
    }
    if (a.kind === 'pick') return `a ${a.season} ${['', '1st', '2nd', '3rd', '4th'][a.round] || 'round ' + a.round}-round pick, the kind of asset rebuilders want.`;
    const bits = [];
    if (a.age) bits.push(`age ${Math.floor(a.age)}`);
    const s = a.signals || {};
    if (a.ppgRank && a.valRank && a.valRank - a.ppgRank >= 5) bits.push(`scoring like ${a.pos}${a.ppgRank} but valued as ${a.pos}${a.valRank}`);
    if (s.usage >= 0.75) bits.push(`top-tier usage among ${a.pos}s${a.snapShare ? ` (${Math.round(a.snapShare * 100)}% snaps)` : ''}`);
    if (a.adds >= 1000) bits.push(`trending on Sleeper (${fmt(a.adds)} adds in 72h)`);
    if (a.trend > 0 && a.trend / Math.max(1, a.value) > 0.05) bits.push(`value up ${fmt(a.trend)} in 30 days`);
    if ((a.yoe ?? 9) <= 1) bits.push(a.yoe === 0 ? 'rookie' : '2nd-year player');
    if (bits.length <= 1) bits.push('young enough to hold or grow his value');
    return bits.join(', ') + '.';
  }
  function sellReason(a) {
    const bits = [];
    if (a.age) bits.push(`age ${Math.floor(a.age)}`);
    if (a.ageMult < 0.9) bits.push(`${a.pos}s usually lose value from here (we expect him to keep about ${Math.round(a.ageMult * 100)}% over 2 years)`);
    if (a.trend > 0 && (a.trendPct ?? 0) >= 0.03) bits.push(`value up ${fmt(a.trend)} in 30 days, so you're selling near the top`);
    else if ((a.trendPct ?? 0) > -0.03) bits.push('value is steady, close to its peak');
    if (a.now / Math.max(1, a.value) > 0.7) bits.push('worth more to a contender this season than to your rebuild');
    if (!bits.length) bits.push('selling now gets more back than he is likely to be worth later');
    return bits.join(', ') + '.';
  }
  const fmt = x => Math.round(x).toLocaleString('en-GB');

  return { buildModel, generateTrades, offersFor, explain, theirSideReasons, lineupValue, ageMult, parsePick, packageValue, fmt };
})();
if (typeof module !== 'undefined') module.exports = ENGINE;
/*ENGINE-END*/
</script>

<script>
// ---------- App (data loading + UI) ----------
const LEAGUE_ID = '1312072052827521024';
const MY_USERNAME = 'childsy14';

const fmt = ENGINE.fmt;

const store = {
  get(k, d) { try { const v = localStorage.getItem('tf:' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('tf:' + k, JSON.stringify(v)); } catch {} },
};
let prefs = Object.assign({ fairness: 0.12, maxAssets: 2, protectPicks: true, maxResults: 20, strategy: {}, marks: {} }, store.get('prefs', {}));
const savePrefs = () => store.set('prefs', prefs);
let RAW = null, MODEL = null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const status = (msg, err) => { const el = $('#status'); el.textContent = msg; el.className = 'status' + (err ? ' err' : ''); };

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${r.status} from ${new URL(url).host}`);
  return r.json();
}
// Sleeper's full player list is ~5 MB: cache it in IndexedDB for a day.
function idb() {
  return new Promise((res, rej) => {
    try { const q = indexedDB.open('tradefinder', 1); q.onupgradeneeded = () => q.result.createObjectStore('kv'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }
    catch (e) { rej(e); }
  });
}
async function cached(key, maxAgeMs, loader) {
  try {
    const db = await idb();
    const hit = await new Promise(r => { const q = db.transaction('kv').objectStore('kv').get(key); q.onsuccess = () => r(q.result); q.onerror = () => r(null); });
    if (hit && Date.now() - hit.t < maxAgeMs) return hit.v;
    const v = await loader();
    db.transaction('kv', 'readwrite').objectStore('kv').put({ t: Date.now(), v }, key);
    return v;
  } catch { return loader(); }
}
const soft = p => p.catch(e => { console.warn(e); return null; });

async function loadTradeHistory(league, currentWeek) {
  const out = [];
  const weeksFor = (lg, isCurrent) => {
    const last = isCurrent ? Math.min(18, Math.max(1, (currentWeek || 18) + 1)) : 18;
    return Array.from({ length: last + 1 }, (_, i) => i); // week 0 = offseason trades
  };
  const fetchTxns = async (lg, isCurrent) => {
    const weeks = weeksFor(lg, isCurrent);
    const lists = await Promise.all(weeks.map(w => getJSON(`${SLEEPER}/league/${lg.league_id}/transactions/${w}`).catch(() => [])));
    return lists.flat().filter(t => t && t.type === 'trade');
  };
  const [curRosters, curTx] = [RAW_ROSTERS, await fetchTxns(league, true)];
  out.push({ season: league.season, rosters: curRosters, txns: curTx });
  let prevId = league.previous_league_id, hops = 0;
  while (prevId && prevId !== '0' && hops < 3) {
    hops++;
    const id = prevId;
    const set = await cached(`hist:${id}`, 30 * 86400000, async () => {
      const lg = await getJSON(`${SLEEPER}/league/${id}`);
      const [rosters, txns] = await Promise.all([getJSON(`${SLEEPER}/league/${id}/rosters`), fetchTxns(lg, false)]);
      return { season: lg.season, prev: lg.previous_league_id, rosters: rosters.map(r => ({ roster_id: r.roster_id, owner_id: r.owner_id })), txns };
    }).catch(() => null);
    if (!set) break;
    out.push(set); prevId = set.prev;
  }

}
let RAW_ROSTERS = [];

async function load(force) {

    const ppr = league.scoring_settings?.rec ?? 0.5;
    const fcUrl = `https://api.fantasycalc.com/values/current?isDynasty=true&numQbs=${qbSlots >= 2 ? 2 : 1}&numTeams=${numTeams}&ppr=${ppr}&includeAdjacent=true`;
    const [users, rosters, tradedPicks, nfl, fc, trending] = await Promise.all([
      getJSON(`${SLEEPER}/league/${LEAGUE_ID}/users`),

      getJSON(fcUrl).catch(e => { throw new Error('FantasyCalc values failed to load (' + e.message + ')'); }),
      soft(getJSON(`${SLEEPER}/players/nfl/trending/add?lookback_hours=72&limit=200`)),
    ]);
    status('Loading player details, season stats and trade history…');
    RAW_ROSTERS = rosters.map(r => ({ roster_id: r.roster_id, owner_id: r.owner_id }));
    const season = nfl?.season || league.season;
    const [sleeperPlayers, stats, history, tradeHistory] = await Promise.all([
      soft(force ? getJSON(`${SLEEPER}/players/nfl`) : cached('players', 86400000, () => getJSON(`${SLEEPER}/players/nfl`))),
      soft(getJSON(`${SLEEPER}/stats/nfl/regular/${season}`).catch(() => getJSON(`https://api.sleeper.com/stats/nfl/${season}?season_type=regular`))),
      soft(fetch('data/history.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null)),
      soft(loadTradeHistory(league, nfl?.week)),
    ]);
    RAW = { league, users, rosters, tradedPicks: tradedPicks || [], fc, sleeperPlayers, stats, trending: trending || [], myUsername: MY_USERNAME, week: nfl?.week, history, tradeHistory };
    rebuild();
    const missing = [!tradeHistory && 'trade history', !stats && 'season stats', !trending && 'trending adds', !sleeperPlayers && 'player details'].filter(Boolean);
    status(`Updated ${new Date().toLocaleString('en-GB', { weekday: 'short', hour: '2-digit', minute: '2-digit' })}` + (missing.length ? ` · couldn't load ${missing.join(', ')}, so those signals are skipped` : ''));
  } catch (e) {

  }
}

  const inj = [...MODEL.players.values()].filter(p => p.owner !== MODEL.me.rosterId && p.injStash)

}

function assetRows(list) {

function toggleOffers(tr) {

function renderMyTeam() {
  const me = MODEL.me;

    else if (a.sell >= 0.45) t += '<span class="tag sell">sell high</span>';
    if (a.breakout >= 0.55) t += '<span class="tag buy">core</span>';
    if (starters.has(a.id)) t += '<span class="tag">starter</span>';
    return t;
  };
  $('#tab-myteam').innerHTML = `<p class="small"><b>Protect</b> keeps a player out of every trade, and <b>Shop</b> forces him into the trade search. <b>Auto</b> lets the site decide: it shops players near their value peak who are past their age peak or whose value is mostly about this season. It won't sell anyone whose value is falling. "Dip · hold" marks a player whose value has dropped while his role hasn't, which is a bad time to sell.</p>
  <div class="card scroll"><table><thead><tr><th>Asset</th><th class="n">Value</th><th class="n">2-yr</th><th>Trade?</th></tr></thead><tbody>
  ${rows.map(a => `<tr><td><b>${esc(a.name)}</b>${tags(a)}<div class="small">${esc(assetMeta(a))}${a.injury ? ' · ' + esc(a.injury) : ''}</div></td>
  <td class="n">${fmt(a.value)}</td><td class="n" style="color:${a.ageMult >= 1 ? 'var(--good)' : a.ageMult < 0.8 ? 'var(--bad)' : 'var(--muted)'}">${fmt(a.future)}</td><td>${markBtns(a)}</td></tr>`).join('')}
  </tbody></table><p class="small">"2-yr" is the value we expect him to have in about two years, based on his age and position.</p></div>`;
  $('#tab-myteam').querySelectorAll('.seg button').forEach(b => b.onclick = () => {
    const id = b.parentElement.dataset.id; const m = b.dataset.m;
    if (m === 'auto') delete prefs.marks[id]; else prefs.marks[id] = m;
    savePrefs(); rebuild();
  });
}

function renderLeague() {
  const teams = MODEL.teams.slice().sort((a, b) => a.contendRank - b.contendRank);
  $('#tab-league').innerHTML = `<p class="small">Strategies are guessed from lineup strength, record and points scored. Change any team's strategy and the trade search will treat them that way.</p>
  <div class="card scroll"><table><thead><tr><th>Team</th><th class="n">Rec</th><th class="n">Lineup</th><th class="n">Roster age</th><th>Strategy</th></tr></thead><tbody>
  ${teams.map(t => `<tr><td><b>${esc(t.name)}</b>${t === MODEL.me ? ' <span class="tag buy">you</span>' : ''}<div class="small">${esc(t.username)} · ${fmt(t.pf)} PF</div></td>
    <td class="n">${t.wins}–${t.losses}</td><td class="n">${fmt(t.lineupNow)}</td><td class="n">${t.avgAge ? t.avgAge.toFixed(1) : '–'}</td>
    <td><select data-r="${t.rosterId}">${['winnow', 'middle', 'rebuild'].map(s => `<option value="${s}" ${t.strategy === s ? 'selected' : ''}>${label(s)}${s === t.autoStrategy && t !== MODEL.me ? ' (auto)' : ''}</option>`).join('')}</select></td></tr>`).join('')}
  </tbody></table><p class="small">"Lineup" is this season's value of each team's best possible starting lineup. "Roster age" is weighted by value.</p></div>`;
  const log = MODEL.tradeLog || [];
  const seasons = [...new Set(log.map(e => e.season))];
  const profHtml = `<h3 style="margin:18px 0 4px;font-size:16px">Manager trade tendencies</h3>
  <p class="small">${log.length ? `From ${log.length} completed trade${log.length === 1 ? '' : 's'} (${seasons.join(', ')}). These tendencies feed into the trade scores, and managers who trade more often rank a little higher. Values are today's, so they show what kind of assets moved, not what they were worth at the time.` : 'No completed trades found in this league yet. Profiles will fill in as trades happen.'}</p>
  ${log.length ? `<div class="card">${MODEL.teams.slice().sort((a, b) => b.profile.trades - a.profile.trades).map(t => `<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b>${esc(t.name)}</b>${t === MODEL.me ? ' <span class="tag buy">you</span>' : ''} <span class="small">· ${t.profile.trades} trade${t.profile.trades === 1 ? '' : 's'}</span><div>${t.profile.tags.map(g => `<span class="pill" style="margin:3px 4px 0 0">${esc(g)}</span>`).join('')}</div></div>`).join('')}</div>
  <h3 style="margin:18px 0 4px;font-size:16px">Recent trades</h3>
  ${log.slice(0, 12).map(e => `<div class="card"><div class="small" style="margin-bottom:6px">${e.when ? new Date(e.when).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : e.season}</div>
    <div class="sides">${e.sides.map(sd => `<div class="side"><h4>${esc(sd.teamName)} got</h4>${sd.got.length ? sd.got.map(a => `<div class="asset"><div><div class="nm">${esc(a.name)}</div><div class="meta">${a.kind === 'pick' ? 'Draft pick' : esc(a.pos) + (a.age ? ' · ' + Math.floor(a.age) + ' then' : '')}</div></div><div class="val">${fmt(a.value)}</div></div>`).join('') : '<div class="small">Nothing</div>'}</div>`).join('')}</div></div>`).join('')}` : ''}`;
  $('#tab-league').insertAdjacentHTML('beforeend', profHtml);
  $('#tab-league').querySelectorAll('select').forEach(s => s.onchange = () => { prefs.strategy[s.dataset.r] = s.value; savePrefs(); rebuild(); });
}

function renderSettings() {
  $('#tab-settings').innerHTML = `<div class="card">
    <label class="set"><span>Fairness range<div class="small">How far apart the two sides' market values can be</div></span>
      <select id="s-fair">${[0.06, 0.1, 0.12, 0.15, 0.2].map(v => `<option value="${v}" ${prefs.fairness == v ? 'selected' : ''}>±${Math.round(v * 100)}%</option>`).join('')}</select></label>
    <label class="set"><span>Even deals<div class="small">Same number of pieces on each side</div></span>
      <select id="s-even">${[['prefer', 'Prefer'], ['strict', 'Only even'], ['off', 'No preference']].map(([v, l]) => `<option value="${v}" ${(prefs.evenDeals ?? 'prefer') === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <label class="set"><span>Max assets per side</span>
      <select id="s-max">${[1, 2, 3].map(v => `<option ${prefs.maxAssets == v ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
    <label class="set"><span>Target buy-low dips<div class="small">Prime-age stars whose value has dropped while their role hasn't</div></span><input type="checkbox" id="s-buylow" ${prefs.buyLow !== false ? 'checked' : ''}></label>
    <label class="set"><span>Target injury stashes<div class="small">Young injured players with a good recovery outlook</div></span><input type="checkbox" id="s-inj" ${prefs.injuryStash !== false ? 'checked' : ''}></label>
    <label class="set"><span>Buy-low look-back<div class="small">Dips are measured from each player's peak in this window (needs saved history)</div></span>
      <select id="s-win">${[60, 90, 120].map(v => `<option value="${v}" ${(prefs.dipWindow ?? 90) == v ? 'selected' : ''}>${v} days</option>`).join('')}</select></label>
    <label class="set"><span>Never trade away my picks</span><input type="checkbox" id="s-picks" ${prefs.protectPicks ? 'checked' : ''}></label>
    <label class="set"><span>Number of trades to show</span>
      <select id="s-n">${[10, 20, 30].map(v => `<option ${prefs.maxResults == v ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
    <div class="row" style="margin-top:10px"><button class="btn ghost" id="s-reset">Reset strategies and marks</button></div>
    <p class="small">Data: Sleeper (rosters, picks, stats, trending adds) and <a href="https://fantasycalc.com" target="_blank" rel="noopener">FantasyCalc</a> (trade values). Settings are saved in this browser only.</p>
  </div>`;
  $('#s-fair').onchange = e => { prefs.fairness = +e.target.value; savePrefs(); rebuild(); };
  $('#s-even').onchange = e => { prefs.evenDeals = e.target.value; savePrefs(); rebuild(); };
  $('#s-max').onchange = e => { prefs.maxAssets = +e.target.value; savePrefs(); rebuild(); };
  $('#s-inj').onchange = e => { prefs.injuryStash = e.target.checked; savePrefs(); rebuild(); };
  $('#s-win').onchange = e => { prefs.dipWindow = +e.target.value; savePrefs(); rebuild(); };
  $('#s-buylow').onchange = e => { prefs.buyLow = e.target.checked; savePrefs(); rebuild(); };
  $('#s-picks').onchange = e => { prefs.protectPicks = e.target.checked; savePrefs(); rebuild(); };
  $('#s-n').onchange = e => { prefs.maxResults = +e.target.value; savePrefs(); rebuild(); };
  $('#s-reset').onclick = () => { prefs.strategy = {}; prefs.marks = {}; savePrefs(); rebuild(); };
}

document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('main section').forEach(s => s.classList.toggle('hidden', s.id !== 'tab-' + b.dataset.tab));
});
$('#refresh').onclick = () => load(true);
load(false);
</script>
</body>
</html>
