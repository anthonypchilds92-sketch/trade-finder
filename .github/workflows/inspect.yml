name: Check points model (one-off)
on: { workflow_dispatch: {}, push: { paths: [scripts/check-points.mjs] } }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/check-points.mjs
