name: Inspect KTC (one-off)
on: { workflow_dispatch: {}, push: { paths: [scripts/inspect-ktc.mjs] } }
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/inspect-ktc.mjs
