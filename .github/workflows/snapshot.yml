name: Daily value snapshot

on:
  schedule:
    - cron: '23 7 * * *'   # every day, 07:23 UTC
  workflow_dispatch:        # "Run workflow" button
  push:
    paths:
      - scripts/snapshot.mjs
      - scripts/ktc.mjs
      - scripts/experts.mjs
      - .github/workflows/snapshot.yml

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/snapshot.mjs
      - name: Expert tips from fantasy articles (allowed to fail)
        run: node scripts/experts.mjs
        continue-on-error: true
      - name: KTC values (unofficial, allowed to fail)
        run: node scripts/ktc.mjs
        continue-on-error: true
      - name: Commit snapshot
        run: |
          git config user.name "value-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in data/history.json data/ktc.json data/history-ktc.json data/experts.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || git commit -m "Value snapshot $(date -u +%F)"
          git pull --rebase
          git push
